<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Generate PWA Icons &amp; Splash Screens</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1d27; color: #fff; padding: 40px; text-align: center; }
    h1 { margin-bottom: 8px; }
    p { color: #b0b3ba; margin-bottom: 24px; }
    button { background: #81D31A; color: #111; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin: 8px; }
    button:hover { background: #9ae830; }
    .status { margin-top: 20px; color: #81D31A; font-size: 14px; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>PWA Icon &amp; Splash Generator</h1>
  <p>Click the button below to generate and download all required PNG icons and splash screens for the JobTracker PWA.<br>
  Place the downloaded files in <code>jobtracker/icons/</code>.</p>
  <button onclick="generateAll()">Generate &amp; Download All</button>
  <div class="status" id="status"></div>
  <canvas id="canvas"></canvas>

<script>
const SVG_LOGO = `<svg width="494" height="506" xmlns="http://www.w3.org/2000/svg" overflow="hidden"><defs><clipPath id="c0"><rect x="289" y="214" width="494" height="506"/></clipPath><clipPath id="c1"><path d="M355.171 214 716.829 214C753.374 214 783 243.627 783 280.174L783 653.826C783 690.373 753.374 720 716.829 720L355.171 720C318.626 720 289 690.373 289 653.826L289 280.174C289 243.627 318.626 214 355.171 214Z" fill-rule="evenodd" clip-rule="evenodd"/></clipPath></defs><g clip-path="url(#c0)" transform="translate(-289 -214)"><g clip-path="url(#c1)"><path fill="#81D31A" d="M737.46 87.9614 806.631 87.9614 806.631 593.671 737.46 593.671Z" transform="matrix(1 0 0 1.00003 -23.6306 126.308)"/><path fill="#81D31A" d="M312.631 87.9614 381.802 87.9614 381.802 593.671 312.631 593.671Z" transform="matrix(1 0 0 1.00003 -23.6306 126.308)"/><path fill="#81D31A" d="M737.484 489.463 789.074 547.755 737.484 593.413ZM389.124 95.8423 730.409 481.468 730.409 586.055 389.124 200.427ZM382.038 87.8353 382.047 87.8468 382.047 192.432 330.133 133.772Z" fill-rule="evenodd" transform="matrix(1 0 0 1.00003 -23.6306 126.308)"/><path fill="#81D31A" d="M382.047 488.962 382.047 593.519 381.93 593.655 330.035 547.705ZM730.409 95.5285 730.409 200.086 389.124 585.529 389.124 480.972ZM737.484 88.1523 789.074 133.83 737.484 192.094Z" fill-rule="evenodd" transform="matrix(1 0 0 1.00003 -23.6306 126.308)"/><path fill="#81D31A" d="M442.258 473.576 671.829 473.576 671.829 503.531 442.258 503.531Z" transform="matrix(1 0 0 1.00003 -23.6306 126.308)"/></g></g></svg>`;

const BG = '#1a1d27';
const ACCENT = '#81D31A';

function svgToImage(svgStr) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}

function download(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function generateIcon(size, filename, maskable) {
  const canvas = document.getElementById('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, size, size);

  // Logo
  const img = await svgToImage(SVG_LOGO);
  const padding = maskable ? size * 0.2 : size * 0.1;
  const logoSize = size - padding * 2;
  const aspect = img.width / img.height;
  const drawW = logoSize * aspect > logoSize ? logoSize : logoSize * aspect;
  const drawH = drawW / aspect;
  const x = (size - drawW) / 2;
  const y = (size - drawH) / 2;
  ctx.drawImage(img, x, y, drawW, drawH);

  download(canvas, filename);
}

async function generateSplash(w, h, filename) {
  const canvas = document.getElementById('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  // Logo centered
  const img = await svgToImage(SVG_LOGO);
  const logoW = w * 0.2;
  const aspect = img.width / img.height;
  const logoH = logoW / aspect;
  const x = (w - logoW) / 2;
  const y = (h - logoH) / 2 - h * 0.05;
  ctx.drawImage(img, x, y, logoW, logoH);

  // App name below logo
  ctx.fillStyle = '#ffffff';
  ctx.font = `600 ${Math.round(w * 0.035)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('JobTracker', w / 2, y + logoH + h * 0.04);

  download(canvas, filename);
}

async function generateAll() {
  const status = document.getElementById('status');

  status.textContent = 'Generating icons...';
  await generateIcon(180, 'icon-180.png', false);
  await new Promise(r => setTimeout(r, 300));
  await generateIcon(192, 'icon-192.png', false);
  await new Promise(r => setTimeout(r, 300));
  await generateIcon(512, 'icon-512.png', false);
  await new Promise(r => setTimeout(r, 300));
  await generateIcon(512, 'icon-maskable-512.png', true);
  await new Promise(r => setTimeout(r, 300));

  status.textContent = 'Generating splash screens...';
  await generateSplash(1290, 2796, 'splash-1290x2796.png');
  await new Promise(r => setTimeout(r, 300));
  await generateSplash(1179, 2556, 'splash-1179x2556.png');
  await new Promise(r => setTimeout(r, 300));
  await generateSplash(1170, 2532, 'splash-1170x2532.png');
  await new Promise(r => setTimeout(r, 300));
  await generateSplash(750, 1334, 'splash-750x1334.png');

  status.textContent = 'Done! Move all downloaded files into jobtracker/icons/';
}
</script>
</body>
</html>
