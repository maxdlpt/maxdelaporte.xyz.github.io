<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Search Tracker</title>
  <link rel="icon" href="/logo3.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1d27;
      --bg2: #252830;
      --card: #2d3436;
      --text: #ffffff;
      --muted: #b0b3ba;
      --accent: #81D31A;
      --accent-h: #9ae830;
      --success: #1dd1a1;
      --danger: #ff6348;
      --warning: #feca57;
      --bdr: rgba(176,179,186,0.12);
      --bdr2: rgba(176,179,186,0.2);
      --sh-sm: 0 2px 8px rgba(0,0,0,0.15);
      --sh-md: 0 4px 12px rgba(0,0,0,0.25);
      --sh-lg: 0 8px 20px rgba(0,0,0,0.35);
      --r: 8px;
      --r-pill: 20px;
      --col-neutral: #6b7280;
      --col-amber: #f59e0b;
      --col-red: #ef4444;
      --col-green: #10b981;
      --col-lgreen: #6ee7b7;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes popIn { from { opacity:0; transform:scale(.95); } to { opacity:1; transform:scale(1); } }
    @keyframes toastIn { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateX(100%); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }

    /* ── Auth ── */
    .auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .auth-card { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:40px; width:100%; max-width:480px; animation:fadeIn .5s ease-out; }
    .auth-card h1 { font-size:24px; font-weight:700; margin-bottom:4px; letter-spacing:-.02em; }
    .auth-card .sub { color:var(--muted); margin-bottom:28px; font-size:13px; }

    /* ── Fields ── */
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
    .field input, .field select, .field textarea { width:100%; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); }
    .field textarea { resize:vertical; min-height:72px; }
    .field select { cursor:pointer; }
    .field select option { background:var(--card); }

    /* ── Combobox ── */
    .combo-wrap { position:relative; }
    .combo-input { width:100%; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
    .combo-input:focus { border-color:var(--accent); }
    .combo-list { position:absolute; top:calc(100% + 2px); left:0; right:0; background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); max-height:180px; overflow-y:auto; z-index:50; box-shadow:var(--sh-md); }
    .combo-opt { padding:9px 12px; cursor:pointer; font-size:13px; transition:background .1s; border-bottom:1px solid var(--bdr); }
    .combo-opt:last-child { border-bottom:none; }
    .combo-opt:hover { background:var(--bg2); }
    .combo-opt.create { color:var(--accent); font-weight:600; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:var(--r); border:none; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; font-family:inherit; }
    .btn-p { background:var(--accent); color:#111; }
    .btn-p:hover { background:var(--accent-h); box-shadow:0 4px 16px rgba(129,211,26,.3); }
    .btn-s { background:transparent; color:var(--muted); border:1px solid var(--bdr2); }
    .btn-s:hover { color:var(--text); border-color:var(--muted); }
    .btn-d { background:rgba(255,99,72,.15); color:var(--danger); border:1px solid rgba(255,99,72,.3); }
    .btn-d:hover { background:rgba(255,99,72,.25); }
    .btn-sm { padding:6px 12px; font-size:12px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn-icon { padding:6px; background:transparent; border:none; cursor:pointer; color:var(--muted); border-radius:var(--r); transition:all .15s; font-size:16px; line-height:1; }
    .btn-icon:hover { color:var(--accent); background:rgba(129,211,26,.08); }

    /* ── Layout: Sidebar ── */
    .app { display:flex; height:100vh; }
    .sidebar { width:60px; background:var(--card); border-right:1px solid var(--bdr); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .35s ease; z-index:10; }
    .sidebar:hover { width:180px; }
    .sidebar-top { padding:14px 0 10px; border-bottom:1px solid var(--bdr); display:flex; align-items:center; justify-content:center; }
    .sidebar-top svg { width:28px; height:28px; fill:var(--accent); flex-shrink:0; }
    .sidebar-nav { flex:1; display:flex; flex-direction:column; padding:8px 0; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:12px 18px; cursor:pointer; color:var(--muted); transition:all .15s; white-space:nowrap; border-left:3px solid transparent; }
    .sidebar-item:hover { color:var(--text); background:rgba(255,255,255,.04); }
    .sidebar-item.active { color:var(--accent); background:rgba(129,211,26,.08); border-left-color:var(--accent); }
    .sidebar-item svg { width:22px; height:22px; flex-shrink:0; }
    .sidebar-item svg path, .sidebar-item svg rect, .sidebar-item svg circle { transition:fill .15s, stroke .15s; }
    .sidebar-item.active svg path { fill:var(--accent); }
    .sidebar-item.active svg path[stroke] { stroke:var(--accent); fill:none; }
    .sidebar-item:not(.active) svg path { fill:var(--muted); }
    .sidebar-item:not(.active) svg path[stroke] { stroke:var(--muted); fill:none; }
    .sidebar-item:not(.active) svg circle { fill:var(--muted); }
    .sidebar-item:not(.active) svg rect { fill:none; }
    .sidebar-label { font-size:13px; font-weight:600; opacity:0; transition:opacity .2s; }
    .sidebar:hover .sidebar-label { opacity:1; }
    .sidebar-bottom { border-top:1px solid var(--bdr); padding:8px 0; }

    .main-area { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--bdr); flex-shrink:0; }
    .topbar h1 { font-size:18px; font-weight:700; letter-spacing:-.02em; }
    .topbar-r { display:flex; align-items:center; gap:10px; }
    .tab-content { flex:1; overflow:auto; }

    /* ── Overview ── */
    .overview { display:flex; gap:16px; padding:20px; overflow-x:auto; min-height:0; align-items:flex-start; }
    .overview::-webkit-scrollbar { height:8px; }
    .overview::-webkit-scrollbar-track { background:var(--bg); }
    .overview::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:4px; }

    .firm-col { min-width:300px; max-width:300px; background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); flex-shrink:0; cursor:grab; transition:transform .35s, opacity .35s, border-color .28s, box-shadow .28s; animation:fadeIn .5s ease-out; }
    .firm-col:hover { border-color:rgba(129,211,26,.4); box-shadow:var(--sh-sm); }
    .firm-col.dragging { opacity:.4; cursor:grabbing; transform:scale(.97); }
    .firm-col.drag-over { border-color:var(--accent); box-shadow:0 0 16px rgba(129,211,26,.2); }

    .fc-head { padding:14px 16px 10px; }
    .fc-name { font-size:15px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:8px; }
    .fc-meta { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
    .fc-next { padding:0 16px 10px; font-size:12px; color:var(--warning); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fc-actions { display:flex; gap:4px; margin-left:auto; opacity:0; transition:opacity .15s; }
    .firm-col:hover .fc-actions { opacity:1; }

    .fc-section { border-top:1px solid var(--bdr); }
    .fc-section-head { padding:8px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; display:flex; align-items:center; justify-content:space-between; }
    .fc-item { padding:6px 16px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:background .1s; display:flex; align-items:center; gap:6px; }
    .fc-item:hover { background:rgba(255,255,255,.03); color:var(--text); }
    .fc-empty { padding:10px 16px; font-size:12px; color:var(--muted); font-style:italic; }

    .add-firm-col { min-width:300px; max-width:300px; background:transparent; border:2px dashed var(--bdr2); border-radius:var(--r); display:flex; align-items:center; justify-content:center; min-height:200px; cursor:pointer; transition:all .15s; flex-shrink:0; color:var(--muted); font-size:14px; font-weight:600; }
    .add-firm-col:hover { border-color:var(--accent); color:var(--accent); }

    /* ── Pipeline ── */
    .pipeline { display:flex; gap:10px; padding:16px; min-height:0; align-items:stretch; }
    .pipeline::-webkit-scrollbar { height:8px; }
    .pipeline::-webkit-scrollbar-track { background:var(--bg); }
    .pipeline::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:4px; }

    .pl-col { flex:1; min-width:0; background:var(--bg2); border:1px solid var(--bdr); border-radius:var(--r); display:flex; flex-direction:column; transition:border-color .28s, box-shadow .28s; }
    .pl-col.drag-over { border-color:var(--accent); box-shadow:0 0 12px rgba(129,211,26,.15); }
    .pl-col-head { padding:10px 12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--col-neutral); }
    .pl-col-head.c-neutral { border-bottom-color:var(--col-neutral); }
    .pl-col-head.c-amber { border-bottom-color:var(--col-amber); }
    .pl-col-head.c-red { border-bottom-color:var(--col-red); }
    .pl-col-head.c-green { border-bottom-color:var(--col-green); }
    .pl-col-head.c-lgreen { border-bottom-color:var(--col-lgreen); }
    .pl-count { background:var(--card); padding:2px 8px; border-radius:var(--r-pill); font-size:11px; }
    .pl-drop { min-height:120px; padding:8px; flex:1; display:flex; flex-direction:column; gap:6px; transition:padding-bottom .3s ease; }
    .pl-col.drag-over .pl-drop { padding-bottom:80px; }
    .pl-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); padding:10px 12px; cursor:grab; transition:transform .28s, opacity .28s, border-color .15s, box-shadow .15s; animation:slideIn .35s ease-out; }
    .pl-card:hover { border-color:rgba(129,211,26,.4); transform:translateY(-1px); box-shadow:var(--sh-sm); }
    .pl-card.dragging { opacity:.4; cursor:grabbing; transform:scale(.95); }
    .pl-card-firm { font-size:12px; font-weight:700; color:var(--accent); margin-bottom:2px; }
    .pl-card-role { font-size:13px; font-weight:500; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pl-card-ref { font-size:11px; color:var(--muted); }
    .pl-card-actions { display:flex; gap:4px; margin-top:6px; opacity:0; transition:opacity .15s; }
    .pl-card:hover .pl-card-actions { opacity:1; }
    .pl-empty { text-align:center; padding:20px 10px; font-size:12px; color:var(--muted); font-style:italic; }

    /* ── Interview Rounds group ── */
    .itv-group { flex:5; flex-shrink:0; border:1px dashed var(--col-neutral); border-radius:var(--r); padding:10px; background:rgba(107,114,128,.04); display:flex; flex-direction:column; }
    .itv-group-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; text-align:center; }
    .itv-grid { display:flex; gap:8px; flex:1; }
    .itv-grid .pl-col { flex:1; min-width:0; }

    /* ── Recycling bin ── */
    .recycle-zone { display:flex; align-items:center; justify-content:center; flex:1; min-height:80px; }

    /* ── Contacts ── */
    .contacts-page { padding:20px; max-width:900px; margin:0 auto; width:100%; }
    .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
    .filter-bar select, .filter-bar input { background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:8px 12px; font-size:13px; outline:none; font-family:inherit; }
    .filter-bar input { flex:1; min-width:180px; }
    .filter-bar select { cursor:pointer; }
    .filter-bar select option { background:var(--card); }

    .section-group { margin-bottom:16px; background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); overflow:hidden; animation:fadeIn .3s ease-out; }
    .section-head { padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background .1s; user-select:none; }
    .section-head:hover { background:rgba(255,255,255,.03); }
    .section-head .chevron { color:var(--muted); font-size:12px; transition:transform .28s; }
    .section-head .chevron.open { transform:rotate(90deg); }
    .section-count { font-size:12px; color:var(--muted); margin-left:8px; }

    .c-row { padding:10px 16px; border-top:1px solid var(--bdr); display:flex; align-items:center; gap:10px; transition:all .15s; cursor:pointer; }
    .c-row:hover { background:rgba(255,255,255,.03); }
    .c-row.expanded { background:var(--bg2); border-left:3px solid var(--accent); }
    .c-row-name { font-weight:600; min-width:130px; font-size:13px; }
    .c-row-role { color:var(--muted); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-row-links { display:flex; gap:4px; }
    .c-row-link { font-size:11px; color:var(--muted); text-decoration:none; padding:3px 6px; border:1px solid var(--bdr); border-radius:4px; transition:all .15s; }
    .c-row-link:hover { color:var(--accent); border-color:var(--accent); }
    .c-row-copy { background:transparent; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; padding:3px 6px; }
    .c-row-copy svg { width:13px; height:13px; fill:currentColor; display:block; }
    .c-row-actions { display:flex; gap:4px; opacity:0; transition:opacity .15s; }
    .c-row:hover .c-row-actions { opacity:1; }

    /* ── Keyboard shortcuts overlay ── */
    .kb-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:center; justify-content:center; animation:fadeIn .15s ease-out; }
    .kb-modal { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:28px 32px; width:520px; max-width:95vw; max-height:85vh; overflow-y:auto; }
    .kb-modal h2 { font-size:16px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .kb-modal h2 kbd { background:var(--bg2); border:1px solid var(--bdr2); border-radius:4px; padding:2px 7px; font-size:12px; font-weight:600; }
    .kb-section { margin-bottom:16px; }
    .kb-section-title { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:8px; }
    .kb-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--bdr); font-size:13px; }
    .kb-row:last-child { border-bottom:none; }
    .kb-keys { display:flex; gap:4px; flex-shrink:0; }
    .kb-key { background:var(--bg2); border:1px solid var(--bdr2); border-radius:4px; padding:2px 7px; font-size:11px; font-weight:600; color:var(--text); white-space:nowrap; }
    .kb-desc { color:var(--muted); }

    .c-detail { padding:12px 16px 12px 24px; border-top:1px solid var(--bdr); background:var(--bg2); font-size:13px; animation:fadeIn .2s ease-out; }
    .c-detail-row { margin-bottom:6px; }
    .c-detail-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
    .c-detail-val { color:var(--text); }
    .c-detail-val a { color:var(--accent); text-decoration:none; }
    .c-detail-val a:hover { text-decoration:underline; }

    /* ── Opportunities ── */
    .opps-page { padding:20px; max-width:900px; margin:0 auto; width:100%; }

    /* ── Badges ── */
    .badge { padding:3px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:600; white-space:nowrap; flex-shrink:0; }
    .b-grey   { background:rgba(168,181,209,.15); color:#a8b5d1; }
    .b-blue   { background:rgba(72,219,251,.15);  color:#48dbfb; }
    .b-purple { background:rgba(167,139,250,.15); color:#a78bfa; }
    .b-green  { background:rgba(0,208,132,.15);   color:var(--success); }
    .b-amber  { background:rgba(254,202,87,.15);  color:var(--warning); }
    .b-red    { background:rgba(255,99,72,.15);    color:var(--danger); }
    .b-indigo { background:rgba(99,102,241,.15);   color:#818cf8; }
    .b-teal   { background:rgba(20,184,166,.15);   color:#2dd4bf; }

    .tag { padding:3px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:600; background:var(--bg2); color:var(--muted); border:1px solid var(--bdr); }
    .tag-p { background:rgba(129,211,26,.12); color:var(--accent); border-color:rgba(129,211,26,.3); }

    /* ── Modal ── */
    .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(2px); }
    .modal { background:var(--card); border:1px solid var(--bdr2); border-radius:10px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; animation:popIn .35s ease-out; box-shadow:var(--sh-lg); }
    .modal-h { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--bdr); }
    .modal-h h3 { font-size:16px; font-weight:700; }
    .modal-b { padding:20px 24px; }
    .modal-f { display:flex; justify-content:flex-end; gap:10px; padding:0 24px 20px; }

    /* ── Toast ── */
    .toast-container { position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:12px 16px; border-radius:var(--r); font-size:13px; font-weight:500; animation:toastIn .3s ease-out; min-width:260px; box-shadow:var(--sh-md); }
    .toast.out { animation:toastOut .3s ease-in forwards; }
    .toast-s { background:#1a3d2a; border:1px solid var(--success); color:var(--success); }
    .toast-e { background:#3d1a1a; border:1px solid var(--danger); color:var(--danger); }

    /* ── Create form card ── */
    .create-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); margin-bottom:24px; overflow:hidden; }
    .create-card-head { padding:14px 16px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition:background .1s; user-select:none; color:var(--accent); }
    .create-card-head:hover { background:rgba(129,211,26,.05); }
    .create-card-body { padding:16px; border-top:1px solid var(--bdr); }

    /* ── Misc ── */
    .error-msg { color:var(--danger); font-size:13px; margin-top:8px; padding:10px; background:rgba(255,99,72,.08); border:1px solid rgba(255,99,72,.2); border-radius:var(--r); }
    .setup-code { background:var(--bg); border:1px solid var(--bdr); border-radius:var(--r); padding:14px; font-family:'Monaco','Courier New',monospace; font-size:11px; color:var(--muted); white-space:pre-wrap; margin-bottom:16px; overflow-x:auto; max-height:300px; overflow-y:auto; }
    .note-box { padding:12px 16px; background:rgba(129,211,26,.06); border:1px solid rgba(129,211,26,.2); border-radius:var(--r); font-size:13px; color:var(--muted); margin-bottom:20px; }
    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }

    /* ── Todo ── */
    .todo-page { padding:20px; max-width:700px; margin:0 auto; width:100%; }
    .task-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--bdr); border-radius:var(--r); background:var(--card); margin-bottom:6px; cursor:default; transition:border-color .15s, box-shadow .15s; animation:fadeIn .2s ease-out; position:relative; }

/* ══════════════════ DB CLASS ══════════════════ */
class DB {
  constructor(u,k,userId){this.base=`${u}/rest/v1`;this.userId=userId;this.h={'apikey':k,'Authorization':`Bearer ${k}`,'Content-Type':'application/json'};}
  async get(t,qs=''){const uf=t==='users'?'':'user_id=eq.'+this.userId;const q=[qs,uf].filter(Boolean).join('&');const r=await fetch(`${this.base}/${t}${q?'?'+q:''}`,{headers:this.h});if(!r.ok)throw new Error(await r.text());return r.json();}
  async ins(t,d){const body=t==='users'?d:{...d,user_id:this.userId};const r=await fetch(`${this.base}/${t}`,{method:'POST',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async upd(t,id,d){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'PATCH',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async del(t,id){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'DELETE',headers:{...this.h,Prefer:'return=minimal'}});if(!r.ok)throw new Error(await r.text());}
  async rpc(fn,params){const r=await fetch(`${this.base}/rpc/${fn}`,{method:'POST',headers:this.h,body:JSON.stringify(params)});if(!r.ok)throw new Error(await r.text());return r.json();}
}
function getDbConfig(){
  if(SUPABASE_URL&&SUPABASE_KEY)return{url:SUPABASE_URL,key:SUPABASE_KEY};
  try{return JSON.parse(localStorage.getItem('hfcrm_config')||'null');}catch{return null;}
}
function getAuth(){try{return JSON.parse(localStorage.getItem('hfcrm_auth')||'null');}catch{return null;}}

  const {toasts} = useContext(Ctx);
  return <div className="toast-container">{toasts.map(t=><div key={t.id} className={`toast toast-${t.type} ${t.out?'out':''}`}>{t.msg}</div>)}</div>;
}

/* ══════════════════ BADGE ══════════════════ */
function Badge({v,arr}){const info=si(v,arr);return <span className={`badge ${info.cls}`}>{info.label}</span>;}

/* ══════════════════ MODAL ══════════════════ */
function Modal({title,onClose,onSave,saveLabel='Save',children,saving,danger}){
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[onClose]);
  return(
    <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-h"><h3>{title}</h3><button className="btn-icon" onClick={onClose}>✕</button></div>
        <div className="modal-b">{children}</div>
        <div className="modal-f">
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
          <button className={`btn ${danger?'btn-d':'btn-p'}`} onClick={onSave} disabled={saving}>{saving?'Saving…':saveLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════ COMPANY COMBOBOX ══════════════════ */
function CompanyCombo({value,onChange,firms,onCreateNew}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const selFirm=firms.find(f=>f.id===value);

  useEffect(()=>{if(selFirm&&!open)setQ(selFirm.name);},[selFirm,open]);

  const matches=useMemo(()=>{
    if(!q.trim())return firms;
    return firms.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  },[firms,q]);

  const exactMatch=matches.find(f=>f.name.toLowerCase()===q.trim().toLowerCase());
  const showCreate=q.trim()&&!exactMatch;

  function pick(f){onChange(f.id);setQ(f.name);setOpen(false);}

  return(
    <div className="field">
      <label>Company</label>
      <div className="combo-wrap">
        <input className="combo-input" placeholder="Type company name..." value={q}
          onChange={e=>{setQ(e.target.value);setOpen(true);if(!e.target.value)onChange('');}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),180)}/>
        {open&&(matches.length||showCreate)&&(
          <div className="combo-list">
            {matches.map(f=><div key={f.id} className="combo-opt" onMouseDown={e=>e.preventDefault()} onClick={()=>pick(f)}>{f.name}</div>)}
            {showCreate&&<div className="combo-opt create" onMouseDown={e=>e.preventDefault()} onClick={()=>{onCreateNew(q.trim());setOpen(false);}}>+ Create: {q.trim()}</div>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════ TAB 2: OVERVIEW ══════════════════ */
function OverviewTab(){
  const {firms,contacts,opps,todos,db,toast,reload,setModal,setTab} = useContext(Ctx);
  const sorted = useMemo(()=>{
    const openTodos = [...todos.filter(t=>!t.done)].sort((a,b)=>a.priority-b.priority);
    const seen = [];
    openTodos.forEach(t=>{if(t.firm_id&&!seen.includes(t.firm_id))seen.push(t.firm_id);});
    const withTodos = seen.map(id=>firms.find(f=>f.id===id)).filter(Boolean);
    const withoutTodos = [...firms].filter(f=>!seen.includes(f.id)).sort((a,b)=>(a.order_position||0)-(b.order_position||0));
    return [...withTodos,...withoutTodos];
  },[firms,todos]);
  const dragRef = useRef(null);

  function onDragStart(e,i){dragRef.current=i;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
  function onDragEnd(e){e.currentTarget.classList.remove('dragging');dragRef.current=null;}
  function onDragOver(e,i){e.preventDefault();e.currentTarget.classList.add('drag-over');}
  function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
  async function onDrop(e,i){
    e.currentTarget.classList.remove('drag-over');
    const from=dragRef.current;if(from===null||from===i)return;
    const arr=[...sorted];const [moved]=arr.splice(from,1);arr.splice(i,0,moved);
    try{await Promise.all(arr.map((f,idx)=>db.upd('firms',f.id,{order_position:idx})));reload();toast('Order saved','s');}
    catch(err){toast('Failed to save order','e');reload();}
  }

  function firmContacts(fid){return contacts.filter(c=>c.firm_id===fid);}
  function firmOpps(fid){return opps.filter(o=>o.firm_id===fid);}

  return(
    <div className="overview">
      {sorted.map((f,i)=>{
        const fTodos=todos.filter(t=>t.firm_id===f.id&&!t.done).sort((a,b)=>a.priority-b.priority);
        return(
        <div key={f.id} className="firm-col" draggable onDragStart={e=>onDragStart(e,i)} onDragEnd={onDragEnd} onDragOver={e=>onDragOver(e,i)} onDragLeave={onDragLeave} onDrop={e=>onDrop(e,i)}>
          <div className="fc-head">
            <div className="fc-name">
              {f.name}
              <div className="fc-actions">
                <button className="btn-icon" onClick={()=>setModal({type:'edit-firm',data:f})}>✎</button>
                <button className="btn-icon" style={{color:'var(--danger)'}} onClick={()=>setModal({type:'del-firm',data:f})}>✕</button>
              </div>
            </div>
            <div className="fc-meta">
              {f.type&&<span className="tag">{f.type}</span>}
            </div>
          </div>
          {fTodos.length>0?(
            <div className="fc-section">
              <div className="fc-section-head"><span>Tasks ({fTodos.length})</span></div>
              {fTodos.slice(0,3).map(t=>(
                <div key={t.id} className="firm-todo-item" onClick={e=>{e.stopPropagation();setTab('todo');}}>
                  <span className="todo-dot"/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{t.title}</span>
                </div>
              ))}
              {fTodos.length>3&&<div className="firm-todo-item" style={{color:'var(--accent)',fontStyle:'italic'}} onClick={e=>{e.stopPropagation();setTab('todo');}}>+{fTodos.length-3} more</div>}
            </div>
          ):f.next_steps?<div className="fc-next">⚡ {f.next_steps}</div>:null}
          <div className="fc-section">
            <div className="fc-section-head"><span>Contacts ({firmContacts(f.id).length})</span><button className="btn btn-sm btn-s" onClick={()=>setModal({type:'add-contact',firmId:f.id})}>+</button></div>
            {firmContacts(f.id).length?firmContacts(f.id).map(c=>(
              <div key={c.id} className="fc-item" onClick={()=>setModal({type:'edit-contact',data:c})}><Badge v={c.status} arr={C_ST}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{c.name}{c.role?' · '+c.role:''}</span></div>
            )):<div className="fc-empty">No contacts</div>}
          </div>
          <div className="fc-section">
            <div className="fc-section-head"><span>Opportunities ({firmOpps(f.id).length})</span><button className="btn btn-sm btn-s" onClick={()=>setModal({type:'add-opp',firmId:f.id})}>+</button></div>
            {firmOpps(f.id).length?firmOpps(f.id).map(o=>(
              <div key={o.id} className="fc-item" onClick={()=>setModal({type:'edit-opp',data:o})}><Badge v={o.stage} arr={STAGES}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{o.role}</span></div>
            )):<div className="fc-empty">No opportunities</div>}
          </div>
        </div>
        );
      })}
      <div className="add-firm-col" onClick={()=>setModal({type:'add-firm'})}>+ Add Firm</div>
    </div>
  );
}

/* ══════════════════ TAB 2: PIPELINE ══════════════════ */
function PipelineTab(){
  const {firms,opps,contacts,db,toast,reload,setModal} = useContext(Ctx);
  const dragRef = useRef(null);
  const [localOpps,setLocalOpps] = useState([]);
  const [dragOverStage,setDragOverStage] = useState(null);
  const dragCounter = useRef({});

  useEffect(()=>{setLocalOpps(opps);},[opps]);

  function firmName(fid){const f=firms.find(x=>x.id===fid);return f?f.name:'?';}
  function referrer(o){const c=contacts.find(x=>x.firm_id===o.firm_id&&x.status==='willing_to_refer');return c?c.name:o.referral==='Yes'||o.referral==='Pending'?'(referral pending)':null;}
  function stageOpps(stg){return [...localOpps.filter(o=>o.stage===stg)].sort((a,b)=>(a.stage_order||0)-(b.stage_order||0));}

  function onDragStart(e,opp){dragRef.current=opp;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging');}
  function onDragEnd(e){e.currentTarget.classList.remove('dragging');dragRef.current=null;setDragOverStage(null);dragCounter.current={};}

  function onCardDragOver(e,targetOpp,stage){
    e.preventDefault();
    const src=dragRef.current;if(!src)return;
    if(src.id===targetOpp.id)return;
    if(src.stage===stage){
      const items=stageOpps(stage);
      const srcIdx=items.findIndex(o=>o.id===src.id);
      const tgtIdx=items.findIndex(o=>o.id===targetOpp.id);
      if(srcIdx===tgtIdx)return;
      const reordered=[...items];
      reordered.splice(srcIdx,1);
      reordered.splice(tgtIdx,0,src);
      const updated=localOpps.map(o=>{
        const ri=reordered.findIndex(r=>r.id===o.id);
        if(ri>=0)return {...o,stage_order:ri};
        return o;
      });
      setLocalOpps(updated);
    }
  }

  function colDragEnter(e,stage){
    e.preventDefault();
    dragCounter.current[stage]=(dragCounter.current[stage]||0)+1;
    setDragOverStage(stage);
  }
  function colDragLeave(e,stage){
    dragCounter.current[stage]=(dragCounter.current[stage]||0)-1;
    if(dragCounter.current[stage]<=0){
      dragCounter.current[stage]=0;
      if(dragOverStage===stage)setDragOverStage(null);
    }
  }
  function colDragOver(e){e.preventDefault();}

  async function colDrop(e,stage){
    e.preventDefault();
    dragCounter.current[stage]=0;
    setDragOverStage(null);
    const opp=dragRef.current;if(!opp)return;
    if(opp.stage!==stage){
      try{await db.upd('opportunities',opp.id,{stage});reload();toast(`Moved to ${si(stage,STAGES).label}`,'s');}
      catch(err){toast('Stage update failed: '+err.message,'e');reload();}
    }
  }

  function renderCol(stg){
    const items=stageOpps(stg.v);
    const isRejected=stg.v==='rejected';
    const isOver=dragOverStage===stg.v;
    const borderColor=COLOR_MAP[stg.color]||'var(--col-neutral)';
    return(
      <div key={stg.v} className={`pl-col ${isOver?'drag-over':''}`}
        onDragEnter={e=>colDragEnter(e,stg.v)}
        onDragLeave={e=>colDragLeave(e,stg.v)}
        onDragOver={colDragOver}
        onDrop={e=>colDrop(e,stg.v)}>
        <div className={`pl-col-head ${stg.color}`}><span>{stg.label}</span><span className="pl-count">{isRejected?opps.filter(o=>o.stage==='rejected').length:items.length}</span></div>
        <div className="pl-drop">
          {isRejected?(
            <div className="recycle-zone"><IconRecycleBin/></div>
          ):items.length?items.map(o=>(
            <div key={o.id} className="pl-card" draggable
              style={{borderLeft:`3px solid ${borderColor}`}}
              onDragStart={e=>onDragStart(e,o)} onDragEnd={onDragEnd}
              onDragOver={e=>onCardDragOver(e,o,stg.v)}
              onDrop={e=>{e.stopPropagation();colDrop(e,stg.v);}}>
              <div className="pl-card-firm">{firmName(o.firm_id)}</div>
              <div className="pl-card-role">{o.role}</div>
              {referrer(o)&&<div className="pl-card-ref">↪ {referrer(o)}</div>}
              <div className="pl-card-actions">
                <button className="btn-icon" style={{fontSize:14}} onClick={()=>setModal({type:'edit-opp',data:o})}>✎</button>
                <button className="btn-icon" style={{fontSize:14,color:'var(--danger)'}} onClick={()=>setModal({type:'del-opp',data:o})}>✕</button>
              </div>
            </div>
          )):<div className="pl-empty">Drop here</div>}
        </div>
      </div>
    );
  }

  const mainBefore = STAGES.filter(s=>s.group==='main'&&(s.v==='not_applied'||s.v==='waiting'));
  const mainAfter = STAGES.filter(s=>s.group==='main'&&(s.v==='rejected'||s.v==='offer'));

  return(
    <div className="pipeline">
      {mainBefore.map(renderCol)}
      <div className="itv-group">
        <div className="itv-group-label">Interview Rounds</div>
        <div className="itv-grid">
          {ITV_STAGES.map(renderCol)}
        </div>
      </div>
      {mainAfter.map(renderCol)}
    </div>
  );
}

/* ══════════════════ TAB 3: CONTACTS ══════════════════ */
function ContactsTab(){
  const {firms,contacts,db,toast,reload,setModal,shortcutAction} = useContext(Ctx);
  const [sortBy,setSortBy] = useState('company');
  const [search,setSearch] = useState('');
  const [expanded,setExpanded] = useState({});
  const [detail,setDetail] = useState(null);
  const [formOpen,setFormOpen] = useState(false);
  const searchRef = useRef(null);
  useEffect(()=>{
    if(!shortcutAction) return;
    if(shortcutAction.type==='focus-search') searchRef.current?.focus();
    if(shortcutAction.type==='new-contact') setFormOpen(true);
  },[shortcutAction]);
  const [form,setForm] = useState({firm_id:'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});
  const [saving,setSaving] = useState(false);
  const [newFirmModal,setNewFirmModal] = useState(null);
  const [newFirmForm,setNewFirmForm] = useState({name:'',type:'',next_steps:'',notes:''});

  const filtered = useMemo(()=>{
    let list = contacts;
    if(search){const q=search.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.role?.toLowerCase().includes(q)||c.email?.toLowerCase().includes(q));}
    return list;
  },[contacts,search]);

  const groups = useMemo(()=>{
    const map={};
    if(sortBy==='company'){
      firms.forEach(f=>{const fc=filtered.filter(c=>c.firm_id===f.id);if(fc.length)map[f.name]=fc;});
    } else if(sortBy==='status'){
      C_ST.forEach(s=>{const fc=filtered.filter(c=>c.status===s.v);if(fc.length)map[s.label]=fc;});
    } else {
      const sorted=[...filtered].sort((a,b)=>a.name.localeCompare(b.name));
      if(sorted.length)map['All Contacts']=sorted;
    }
    return map;
  },[sortBy,filtered,firms]);

  const toggle = k => setExpanded(p=>({...p,[k]:!p[k]}));

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{const f=await db.ins('firms',{...newFirmForm,order_position:firms.length});reload();setForm(prev=>({...prev,firm_id:f.id}));setNewFirmModal(null);toast('Firm created','s');}
    catch(e){toast('Error: '+e.message,'e');}
  }

  async function createContact(){
    if(!form.name.trim()||!form.firm_id){toast('Name and company required','e');return;}
    setSaving(true);
    try{await db.ins('contacts',form);reload();toast('Contact created','s');setForm({firm_id:'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});setFormOpen(false);}
    catch(e){toast('Error: '+e.message,'e');}
    setSaving(false);
  }

  return(
    <div className="contacts-page">
      <div className="create-card">
        <div className="create-card-head" onClick={()=>setFormOpen(!formOpen)}>
          <span style={{fontSize:18}}>{formOpen?'−':'+'}</span> New Contact
        </div>
        {formOpen&&<div className="create-card-body">
          <ContactFormFields d={form} set={setForm} firms={firms} onCreateFirm={(name)=>{setNewFirmForm({name,type:'',next_steps:'',notes:''});setNewFirmModal(true);}}/>
          <button className="btn btn-p" onClick={createContact} disabled={saving} style={{marginTop:8}}>{saving?'Saving…':'Create Contact'}</button>
        </div>}
      </div>

      {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}

      <div className="filter-bar">
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}>
          <option value="company">Sort by Company</option>
          <option value="status">Sort by Status</option>
          <option value="name">Sort by Name</option>
        </select>
        <input ref={searchRef} placeholder="Search contacts..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>

      {Object.keys(groups).length?Object.entries(groups).map(([key,list])=>{
        const isOpen = expanded[key] === true;
        return(
          <div key={key} className="section-group">
            <div className="section-head" onClick={()=>toggle(key)}>
              <div style={{display:'flex',alignItems:'center'}}><span className={`chevron ${isOpen?'open':''}`}>▶</span><span style={{marginLeft:8}}>{key}</span><span className="section-count">({list.length})</span></div>
            </div>
            {isOpen&&list.map(c=>(
              <React.Fragment key={c.id}>
                <div className={`c-row ${detail===c.id?'expanded':''}`} onClick={()=>setDetail(detail===c.id?null:c.id)}>
                  <div className="c-row-name">{c.name}</div>
                  <div className="c-row-role">{c.role}</div>
                  <Badge v={c.status} arr={C_ST}/>
                  <div className="c-row-links">
                    {c.email&&<button className="c-row-link c-row-copy" onClick={e=>{e.stopPropagation();navigator.clipboard.writeText(c.email).then(()=>toast('Email copied','s'))}} title={`Copy: ${c.email}`}><IconEmail/></button>}
                    {c.linkedin&&<a className="c-row-link" href={c.linkedin} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()}>🔗</a>}
                    {c.phone&&<button className="c-row-link c-row-copy" onClick={e=>{e.stopPropagation();navigator.clipboard.writeText(c.phone).then(()=>toast('Phone copied','s'))}} title={`Copy: ${c.phone}`}><IconPhone/></button>}
                  </div>
                  <div className="c-row-actions">
                    <button className="btn-icon" onClick={e=>{e.stopPropagation();setModal({type:'edit-contact',data:c})}}>✎</button>
                    <button className="btn-icon" style={{color:'var(--danger)'}} onClick={e=>{e.stopPropagation();setModal({type:'del-contact',data:c})}}>✕</button>
                  </div>
                </div>
                {detail===c.id&&(
                  <div className="c-detail">
                    {c.email&&<div className="c-detail-row"><div className="c-detail-label">Email</div><div className="c-detail-val"><a href={`mailto:${c.email}`}>{c.email}</a></div></div>}
                    {c.phone&&<div className="c-detail-row"><div className="c-detail-label">Phone</div><div className="c-detail-val"><a href={`tel:${c.phone}`}>{c.phone}</a></div></div>}
                    {c.linkedin&&<div className="c-detail-row"><div className="c-detail-label">LinkedIn</div><div className="c-detail-val"><a href={c.linkedin} target="_blank" rel="noreferrer">{c.linkedin}</a></div></div>}
                    {c.advice&&<div className="c-detail-row"><div className="c-detail-label">Advice</div><div className="c-detail-val" style={{fontStyle:'italic'}}>{c.advice}</div></div>}
                    {c.notes&&<div className="c-detail-row"><div className="c-detail-label">Notes</div><div className="c-detail-val">{c.notes}</div></div>}
                  </div>
                )}
              </React.Fragment>
            ))}
          </div>
        );
      }):<div className="empty-state">No contacts found</div>}
    </div>
  );
}

/* ══════════════════ TAB 4: OPPORTUNITIES ══════════════════ */
function OppsTab(){
  const {firms,opps,db,toast,reload,setModal,shortcutAction} = useContext(Ctx);
  const [sortBy,setSortBy] = useState('company');
  const [search,setSearch] = useState('');
  const [expanded,setExpanded] = useState({});
  const [formOpen,setFormOpen] = useState(false);
  const searchRef = useRef(null);
  useEffect(()=>{
    if(!shortcutAction) return;
    if(shortcutAction.type==='focus-search') searchRef.current?.focus();
    if(shortcutAction.type==='new-opp') setFormOpen(true);
  },[shortcutAction]);
  const [form,setForm] = useState({firm_id:'',role:'',location:'',link:'',referral:'',notes:''});
  const [saving,setSaving] = useState(false);
  const [newFirmModal,setNewFirmModal] = useState(null);
  const [newFirmForm,setNewFirmForm] = useState({name:'',type:'',next_steps:'',notes:''});

  const filtered = useMemo(()=>{
    let list = opps;
    if(search){const q=search.toLowerCase();list=list.filter(o=>o.role.toLowerCase().includes(q)||firms.find(f=>f.id===o.firm_id)?.name.toLowerCase().includes(q));}
    return list;
  },[opps,search,firms]);

  const groups = useMemo(()=>{
    const map={};
    if(sortBy==='company'){
      firms.forEach(f=>{const fo=filtered.filter(o=>o.firm_id===f.id);if(fo.length)map[f.name]=fo;});
    } else if(sortBy==='stage'){
      STAGES.forEach(s=>{const fo=filtered.filter(o=>o.stage===s.v);if(fo.length)map[s.label]=fo;});
    } else {
      const sorted=[...filtered].sort((a,b)=>a.role.localeCompare(b.role));
      if(sorted.length)map['All Opportunities']=sorted;
    }
    return map;
  },[sortBy,filtered,firms]);

  const toggle = k => setExpanded(p=>({...p,[k]:!p[k]}));
  function firmName(fid){const f=firms.find(x=>x.id===fid);return f?f.name:'?';}

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{const f=await db.ins('firms',{...newFirmForm,order_position:firms.length});reload();setForm(prev=>({...prev,firm_id:f.id}));setNewFirmModal(null);toast('Firm created','s');}
    catch(e){toast('Error: '+e.message,'e');}
  }

  async function createOpp(){
    if(!form.firm_id||!form.role.trim()){toast('Company and role required','e');return;}
    setSaving(true);
    try{await db.ins('opportunities',{...form,stage:'not_applied',stage_order:0});reload();toast('Opportunity created — check Pipeline','s');setForm({firm_id:'',role:'',location:'',link:'',referral:'',notes:''});setFormOpen(false);}
    catch(e){toast('Error: '+e.message,'e');}
    setSaving(false);
  }

  return(
    <div className="opps-page">
      <div className="create-card">
        <div className="create-card-head" onClick={()=>setFormOpen(!formOpen)}>
          <span style={{fontSize:18}}>{formOpen?'−':'+'}</span> New Opportunity
        </div>
        {formOpen&&<div className="create-card-body">
          <OppFormFields d={form} set={setForm} firms={firms} onCreateFirm={(name)=>{setNewFirmForm({name,type:'',next_steps:'',notes:''});setNewFirmModal(true);}}/>
          <button className="btn btn-p" onClick={createOpp} disabled={saving} style={{marginTop:8}}>{saving?'Saving…':'Create Opportunity'}</button>
        </div>}
      </div>

      {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}

      <div className="note-box">New opportunities automatically appear in the Pipeline tab under "Not Applied".</div>

      <div className="filter-bar">
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}>
          <option value="company">Sort by Company</option>
          <option value="stage">Sort by Stage</option>
          <option value="role">Sort by Role</option>
        </select>
        <input ref={searchRef} placeholder="Search opportunities..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>

      {Object.keys(groups).length?Object.entries(groups).map(([key,list])=>{
        const isOpen = expanded[key] === true;
        return(
          <div key={key} className="section-group">
            <div className="section-head" onClick={()=>toggle(key)}>
              <div style={{display:'flex',alignItems:'center'}}><span className={`chevron ${isOpen?'open':''}`}>▶</span><span style={{marginLeft:8}}>{key}</span><span className="section-count">({list.length})</span></div>
            </div>
            {isOpen&&list.map(o=>(
              <div key={o.id} className="c-row" onClick={()=>setModal({type:'edit-opp',data:o})}>
                <div className="c-row-name">{o.role}</div>
                <div className="c-row-role">{firmName(o.firm_id)}{o.location?' · '+o.location:''}</div>
                <Badge v={o.stage} arr={STAGES}/>
                {o.referral&&o.referral!=='No'&&<span className="tag" style={{fontSize:11}}>{o.referral==='Yes'?'✓ Ref':'⏳ Ref'}</span>}
                <div className="c-row-actions">
                  <button className="btn-icon" style={{fontSize:14}} onClick={e=>{e.stopPropagation();setModal({type:'edit-opp',data:o})}}>✎</button>
                  <button className="btn-icon" style={{fontSize:14,color:'var(--danger)'}} onClick={e=>{e.stopPropagation();setModal({type:'del-opp',data:o})}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        );
      }):<div className="empty-state">No opportunities yet. Create one above.</div>}
    </div>
  );
}

/* ══════════════════ TAB 0: TODO ══════════════════ */
function TaskRow({task,firms,onToggle,onEdit,onDelete,dragHandlers,isDragOver,isDragging}){
  const firm = firms.find(f=>f.id===task.firm_id);
  return(
    <>
      {isDragOver&&<div className="task-drop-indicator"/>}
      <div className={`task-row${task.done?' done-row':''}${isDragging?' dragging':''}`} {...dragHandlers}>
        <span className="task-drag-handle" title="Drag to reorder">⠿</span>
        <input type="checkbox" className="task-checkbox" checked={task.done} onChange={()=>onToggle(task)} onClick={e=>e.stopPropagation()}/>
        <div className="task-main">
          <div className="task-title">{task.title}</div>
          <div className="task-meta">
            {firm&&<span className="tag" style={{fontSize:10,padding:'1px 7px'}}>{firm.name}</span>}
            {task.notes&&<span className="task-notes">{task.notes}</span>}
          </div>
        </div>
        <div className="task-actions">
          <button className="btn-icon" style={{fontSize:13}} onClick={e=>{e.stopPropagation();onEdit(task);}}>✎</button>
          <button className="btn-icon" style={{fontSize:13,color:'var(--danger)'}} onClick={e=>{e.stopPropagation();onDelete(task);}}>✕</button>
        </div>
      </div>
    </>
  );
}

function TodoTab(){
  const {firms,todos,db,toast,reload,shortcutAction} = useContext(Ctx);
  const [formOpen,setFormOpen] = useState(false);
  const [form,setForm] = useState({title:'',firm_id:'',notes:''});
  const [saving,setSaving] = useState(false);
  const [showDone,setShowDone] = useState(false);
  const [editTodo,setEditTodo] = useState(null);
  const [editForm,setEditForm] = useState({});
  const [dragSrc,setDragSrc] = useState(null);
  const [dragOver,setDragOver] = useState(null);

  useEffect(()=>{
    if(!shortcutAction) return;
    if(shortcutAction.type==='new-todo') setFormOpen(true);
  },[shortcutAction]);

  const open = useMemo(()=>[...todos.filter(t=>!t.done)].sort((a,b)=>a.priority-b.priority),[todos]);
  const done = useMemo(()=>[...todos.filter(t=>t.done)].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),[todos]);

  async function createTodo(){
    if(!form.title.trim()){toast('Title required','e');return;}
    setSaving(true);
    try{
      await db.ins('todos',{title:form.title,firm_id:form.firm_id||null,notes:form.notes||null,priority:open.length,done:false});
      reload();toast('Task created','s');
      setForm({title:'',firm_id:'',notes:''});setFormOpen(false);
    }catch(e){toast('Error: '+e.message,'e');}
    setSaving(false);
  }

  async function toggleDone(task){
    try{await db.upd('todos',task.id,{done:!task.done});reload();}
    catch(e){toast('Error: '+e.message,'e');}
  }

  async function deleteTodo(task){
    try{await db.del('todos',task.id);reload();toast('Task deleted','s');}
    catch(e){toast('Error: '+e.message,'e');}
  }

  async function saveEdit(){
    if(!editForm.title?.trim()){toast('Title required','e');return;}
    try{
      await db.upd('todos',editTodo.id,{title:editForm.title,notes:editForm.notes||null,firm_id:editForm.firm_id||null});
      reload();toast('Task updated','s');setEditTodo(null);
    }catch(e){toast('Error: '+e.message,'e');}
  }

  function onDragStart(e,task){setDragSrc(task);e.dataTransfer.effectAllowed='move';}
  function onDragEnd(){setDragSrc(null);setDragOver(null);}
  function onDragOver(e,task){e.preventDefault();if(dragSrc&&dragSrc.id!==task.id)setDragOver(task.id);}
  function onDragLeave(){setDragOver(null);}
  async function onDrop(e,task){
    e.preventDefault();setDragOver(null);
    if(!dragSrc||dragSrc.id===task.id)return;
    const arr=[...open];
    const srcIdx=arr.findIndex(t=>t.id===dragSrc.id);
    const tgtIdx=arr.findIndex(t=>t.id===task.id);
    arr.splice(srcIdx,1);arr.splice(tgtIdx,0,dragSrc);
    try{
      await Promise.all(arr.map((t,i)=>db.upd('todos',t.id,{priority:i})));
      reload();
    }catch(e){toast('Reorder failed','e');reload();}
  }

  return(
    <div className="todo-page">
      <div className="create-card">
        <div className="create-card-head" onClick={()=>setFormOpen(!formOpen)}>
          <span style={{fontSize:18}}>{formOpen?'−':'+'}</span> New Task
        </div>
        {formOpen&&<div className="create-card-body">
          <div className="field"><label>Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="What needs to be done?" onKeyDown={e=>e.key==='Enter'&&createTodo()}/></div>
          <div className="field"><label>Company (optional)</label>
            <select value={form.firm_id} onChange={e=>setForm({...form,firm_id:e.target.value})}>
              <option value="">— none —</option>
              {firms.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Notes (optional)</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Any details..."/></div>
          <button className="btn btn-p" onClick={createTodo} disabled={saving} style={{marginTop:8}}>{saving?'Saving…':'Add Task'}</button>
        </div>}
      </div>

      {!open.length&&!done.length&&<div className="empty-state">No tasks yet. Press <strong>N</strong> to add one.</div>}

      {open.map(task=>(
        <TaskRow key={task.id} task={task} firms={firms}
          onToggle={toggleDone}
          onEdit={t=>{setEditTodo(t);setEditForm({title:t.title,notes:t.notes||'',firm_id:t.firm_id||''}); }}
          onDelete={deleteTodo}
          isDragOver={dragOver===task.id}
          isDragging={dragSrc?.id===task.id}
          dragHandlers={{draggable:true,onDragStart:e=>onDragStart(e,task),onDragEnd:onDragEnd,onDragOver:e=>onDragOver(e,task),onDragLeave:onDragLeave,onDrop:e=>onDrop(e,task)}}
        />
      ))}

      {done.length>0&&(
        <>
          <div className="done-section-header" onClick={()=>setShowDone(!showDone)}>
            <span>{showDone?'▾':'▸'}</span>
            <span>Completed ({done.length})</span>
          </div>
          {showDone&&done.map(task=>(
            <TaskRow key={task.id} task={task} firms={firms}
              onToggle={toggleDone}
              onEdit={t=>{setEditTodo(t);setEditForm({title:t.title,notes:t.notes||'',firm_id:t.firm_id||''}); }}
              onDelete={deleteTodo}
              isDragOver={false} isDragging={false} dragHandlers={{}}
            />
          ))}
        </>
      )}

      {editTodo&&(
        <Modal title="Edit Task" onClose={()=>setEditTodo(null)} onSave={saveEdit} saveLabel="Update">
          <div className="field"><label>Title</label><input value={editForm.title} onChange={e=>setEditForm({...editForm,title:e.target.value})}/></div>
          <div className="field"><label>Company</label>
            <select value={editForm.firm_id} onChange={e=>setEditForm({...editForm,firm_id:e.target.value})}>
              <option value="">— none —</option>
              {firms.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Notes</label><textarea value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})}/></div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════ GLOBAL MODAL HANDLER ══════════════════ */
function GlobalModals(){
  const {modal,setModal,db,toast,reload,firms} = useContext(Ctx);
  const [form,setForm] = useState({});
  const [saving,setSaving] = useState(false);
  const [newFirmModal,setNewFirmModal] = useState(null);
  const [newFirmForm,setNewFirmForm] = useState({name:'',type:'',next_steps:'',notes:''});

  useEffect(()=>{
    if(!modal)return;
    if(modal.type==='add-firm')setForm({name:'',type:'',next_steps:'',notes:''});
    if(modal.type==='edit-firm')setForm({name:modal.data.name,type:modal.data.type||'',next_steps:modal.data.next_steps||'',notes:modal.data.notes||''});
    if(modal.type==='add-contact')setForm({firm_id:modal.firmId||'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});
    if(modal.type==='edit-contact'){const d=modal.data;setForm({firm_id:d.firm_id,name:d.name,role:d.role||'',email:d.email||'',linkedin:d.linkedin||'',phone:d.phone||'',status:d.status||'not_contacted',notes:d.notes||'',advice:d.advice||''});}
    if(modal.type==='add-opp')setForm({firm_id:modal.firmId||'',role:'',location:'',link:'',referral:'',notes:''});
    if(modal.type==='edit-opp'){const d=modal.data;setForm({firm_id:d.firm_id,role:d.role||'',location:d.location||'',link:d.link||'',referral:d.referral||'',stage:d.stage||'not_applied',notes:d.notes||''});}
  },[modal]);

  if(!modal)return null;
  const close=()=>setModal(null);

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{const f=await db.ins('firms',{...newFirmForm,order_position:firms.length});reload();setForm(prev=>({...prev,firm_id:f.id}));setNewFirmModal(null);toast('Firm created','s');}
    catch(e){toast('Error: '+e.message,'e');}
  }

  async function save(){
    setSaving(true);
    try{
      if(modal.type==='add-firm'){if(!form.name.trim()){toast('Name required','e');setSaving(false);return;}await db.ins('firms',{...form,order_position:firms.length});reload();toast('Firm created','s');close();}
      if(modal.type==='edit-firm'){await db.upd('firms',modal.data.id,form);reload();toast('Firm updated','s');close();}
      if(modal.type==='add-contact'){if(!form.name.trim()||!form.firm_id){toast('Name and company required','e');setSaving(false);return;}await db.ins('contacts',form);reload();toast('Contact added','s');close();}
      if(modal.type==='edit-contact'){await db.upd('contacts',modal.data.id,form);reload();toast('Contact updated','s');close();}
      if(modal.type==='add-opp'){if(!form.role.trim()||!form.firm_id){toast('Role and company required','e');setSaving(false);return;}await db.ins('opportunities',{...form,stage:'not_applied',stage_order:0});reload();toast('Opportunity created','s');close();}
      if(modal.type==='edit-opp'){await db.upd('opportunities',modal.data.id,form);reload();toast('Opportunity updated','s');close();}
      if(modal.type==='del-firm'){await db.del('firms',modal.data.id);reload();toast('Firm deleted','s');close();}
      if(modal.type==='del-contact'){await db.del('contacts',modal.data.id);reload();toast('Contact deleted','s');close();}
      if(modal.type==='del-opp'){await db.del('opportunities',modal.data.id);reload();toast('Opportunity deleted','s');close();}
    }catch(e){toast('Error: '+e.message,'e');}
    setSaving(false);
  }

  if(modal.type==='del-firm')return <Modal title="Delete Firm" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.name}</strong> and all its contacts/opportunities? This cannot be undone.</p></Modal>;
  if(modal.type==='del-contact')return <Modal title="Delete Contact" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.name}</strong>? This cannot be undone.</p></Modal>;
  if(modal.type==='del-opp')return <Modal title="Delete Opportunity" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.role}</strong>? This cannot be undone.</p></Modal>;

  const createFirmCb=(name)=>{setNewFirmForm({name,type:'',next_steps:'',notes:''});setNewFirmModal(true);};

  if(modal.type==='add-firm'||modal.type==='edit-firm')return <Modal title={modal.type==='add-firm'?'Add Firm':'Edit Firm'} onClose={close} onSave={save} saveLabel={modal.type==='add-firm'?'Create':'Update'} saving={saving}><FirmForm d={form} set={setForm}/></Modal>;
  if(modal.type==='add-contact'||modal.type==='edit-contact')return(<>
    <Modal title={modal.type==='add-contact'?'Add Contact':'Edit Contact'} onClose={close} onSave={save} saveLabel={modal.type==='add-contact'?'Create':'Update'} saving={saving}><ContactFormFields d={form} set={setForm} firms={firms} onCreateFirm={createFirmCb}/></Modal>
    {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}
  </>);
  if(modal.type==='add-opp'||modal.type==='edit-opp'){
    const isEdit=modal.type==='edit-opp';
    return(<>
      <Modal title={isEdit?'Edit Opportunity':'Add Opportunity'} onClose={close} onSave={save} saveLabel={isEdit?'Update':'Create'} saving={saving}>
        <OppFormFields d={form} set={setForm} firms={firms} onCreateFirm={createFirmCb}/>
        {isEdit&&<div className="field"><label>Stage</label><select value={form.stage||'not_applied'} onChange={e=>setForm({...form,stage:e.target.value})}>{STAGES.map(s=><option key={s.v} value={s.v}>{s.label}</option>)}</select></div>}
      </Modal>
      {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}
    </>);
  }
  return null;
}

/* ══════════════════ DASHBOARD ══════════════════ */
function Dashboard({db:dbInstance}){
  const [firms,setFirms] = useState([]);
  const [contacts,setContacts] = useState([]);
  const [opps,setOpps] = useState([]);
  const [todos,setTodos] = useState([]);
  const [tab,setTab] = useState('todo');
  const [modal,setModal] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [loading,setLoading] = useState(true);
  const [showHelp,setShowHelp] = useState(false);
  const [shortcutAction,setShortcutAction] = useState(null);

  const toast = useCallback((msg,type='s')=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.map(t=>t.id===id?{...t,out:true}:t)),2500);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);

  const loadData = useCallback(async()=>{
    try{
      const [f,c,o,td] = await Promise.all([dbInstance.get('firms','order=order_position.asc.nullsfirst'),dbInstance.get('contacts'),dbInstance.get('opportunities'),dbInstance.get('todos')]);
      setFirms(Array.isArray(f)?f:[]);setContacts(Array.isArray(c)?c:[]);setOpps(Array.isArray(o)?o:[]);setTodos(Array.isArray(td)?td:[]);
    }catch(e){toast('Failed to load data: '+e.message,'e');}
    setLoading(false);
  },[dbInstance,toast]);

  useEffect(()=>{loadData();},[loadData]);

  const TABS_ORDER = ['todo','overview','pipeline','contacts','opportunities'];

  useEffect(()=>{
    function isInputFocused(){const el=document.activeElement;return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);}
    function handle(e){
      if(showHelp&&e.key==='Escape'){setShowHelp(false);return;}
      if(modal&&e.key==='Escape') return;
      if(e.key==='?'&&!isInputFocused()){setShowHelp(p=>!p);return;}
      if(isInputFocused()) return;
      const k=e.key;
      const idx=TABS_ORDER.indexOf(tab);
      if(k==='1'){setTab('todo');}
      else if(k==='2'){setTab('overview');}
      else if(k==='3'){setTab('pipeline');}
      else if(k==='4'){setTab('contacts');}
      else if(k==='5'){setTab('opportunities');}
      else if((k==='ArrowLeft'||k==='['||k==='PageUp')&&idx>0){e.preventDefault();setTab(TABS_ORDER[idx-1]);}
      else if((k==='ArrowRight'||k===']'||k==='PageDown')&&idx<TABS_ORDER.length-1){e.preventDefault();setTab(TABS_ORDER[idx+1]);}
      else if(k==='r'||k==='R'){loadData();toast('Refreshed','s');}
      else if(k==='/'){ e.preventDefault();setShortcutAction({type:'focus-search',ts:Date.now()});}
      else if(k==='n'||k==='N'){
        if(tab==='todo') setShortcutAction({type:'new-todo',ts:Date.now()});
        else if(tab==='overview') setModal({type:'add-firm'});
        else if(tab==='contacts') setShortcutAction({type:'new-contact',ts:Date.now()});
        else if(tab==='opportunities') setShortcutAction({type:'new-opp',ts:Date.now()});
      }
    }
    window.addEventListener('keydown',handle);
    return()=>window.removeEventListener('keydown',handle);
  },[tab,modal,showHelp,loadData,toast]);

  const ctx = useMemo(()=>({firms,contacts,opps,todos,db:dbInstance,toast,reload:loadData,modal,setModal,toasts,shortcutAction,setShortcutAction,setTab}),[firms,contacts,opps,todos,dbInstance,toast,loadData,modal,toasts,shortcutAction,setTab]);

  function logout(){localStorage.removeItem('hfcrm_auth');window.location.reload();}

  if(loading)return <div className="empty-state" style={{paddingTop:100}}>Loading...</div>;

  const tabs=[
    {k:'todo',label:'Todo',Icon:IconTodo},
    {k:'overview',label:'Overview',Icon:IconOverview},
    {k:'pipeline',label:'Pipeline',Icon:IconPipeline},

/* ══════════════════ SIGN-IN SCREEN ══════════════════ */
function SignInScreen(){
  const [mode,setMode]=useState('signin');
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [confirm,setConfirm]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  async function go(){
    const u=username.trim();
    if(!u||!password){setErr('Username and password required.');return;}
    if(mode==='create'){
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(u)){setErr('Username: 3–20 chars, alphanumeric + underscores.');return;}
      if(password.length<6){setErr('Password must be at least 6 characters.');return;}
      if(password!==confirm){setErr('Passwords do not match.');return;}
    }
    setLoading(true);setErr('');
    try{
      const cfg=getDbConfig();
      const db=new DB(cfg.url,cfg.key);
      if(mode==='signin'){
        const rows=await db.rpc('check_password',{p_username:u,p_password:password});
        if(Array.isArray(rows)&&rows.length>0){
          localStorage.setItem('hfcrm_auth',JSON.stringify({userId:rows[0].id,username:rows[0].username,ts:Date.now()}));
          window.location.reload();
        } else {setErr('Invalid username or password.');}
      } else {
        const rows=await db.rpc('create_user',{p_username:u,p_password:password});
        if(Array.isArray(rows)&&rows.length>0){
          localStorage.setItem('hfcrm_auth',JSON.stringify({userId:rows[0].id,username:rows[0].username,ts:Date.now()}));
          window.location.reload();
        } else {setErr('Could not create account.');}
      }
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('duplicate key')||msg.includes('unique'))setErr('Username already taken.');
      else setErr((mode==='signin'?'Login':'Signup')+' error: '+msg);
    }
    setLoading(false);
  }

  return(
    <div className="auth-wrap"><div className="auth-card">
      <h1>Job Search Tracker</h1>
      <div style={{display:'flex',gap:0,marginBottom:24}}>
        <button className={`btn ${mode==='signin'?'btn-p':'btn-s'}`} style={{flex:1,justifyContent:'center',borderRadius:'var(--r) 0 0 var(--r)'}} onClick={()=>{setMode('signin');setErr('');}}>Sign In</button>
        <button className={`btn ${mode==='create'?'btn-p':'btn-s'}`} style={{flex:1,justifyContent:'center',borderRadius:'0 var(--r) var(--r) 0'}} onClick={()=>{setMode('create');setErr('');}}>Create Account</button>
      </div>
      <div className="field"><label>Username</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Username" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      <div className="field"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" onKeyDown={e=>e.key==='Enter'&&(mode==='signin'?go():null)}/></div>
      {mode==='create'&&<div className="field"><label>Confirm Password</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="Confirm password" onKeyDown={e=>e.key==='Enter'&&go()}/></div>}
      {err&&<div className="error-msg">{err}</div>}
      <button className="btn btn-p" style={{width:'100%',justifyContent:'center',marginTop:20}} onClick={go} disabled={loading}>{loading?(mode==='signin'?'Signing in…':'Creating…'):(mode==='signin'?'Sign In →':'Create Account →')}</button>
    </div></div>
  );
}

/* ══════════════════ SETUP SCREEN (one-time fallback) ══════════════════ */
function SetupScreen(){
  const [url,setUrl]=useState('');const [key,setKey]=useState('');const [err,setErr]=useState('');const [loading,setLoading]=useState(false);
  async function go(){
    if(!url.trim()||!key.trim()){setErr('URL and key required.');return;}
    setLoading(true);setErr('');
    try{const d=new DB(url.trim(),key.trim());await d.get('firms','limit=1');localStorage.setItem('hfcrm_config',JSON.stringify({url:url.trim(),key:key.trim()}));window.location.reload();}
    catch(e){setErr('Could not connect: '+e.message);}
    setLoading(false);
  }
  return(
    <div className="auth-wrap"><div className="auth-card">
      <h1>Job Search Tracker</h1><p className="sub">One-time setup: connect your Supabase project.</p>
      <div className="note-box">After setup, you can hard-code SUPABASE_URL and SUPABASE_KEY in the source to skip this on all devices.</div>
      <details style={{marginBottom:24}}><summary style={{cursor:'pointer',fontSize:13,color:'var(--accent)',fontWeight:600,marginBottom:8}}>First time? Create tables in Supabase SQL Editor</summary>
        <div className="setup-code">{`CREATE TABLE users (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  username TEXT NOT NULL UNIQUE,
  password TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
INSERT INTO users (username, password) VALUES ('max_dlpt', 'Mulasasa1');

CREATE TABLE firms (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name TEXT NOT NULL, type TEXT, next_steps TEXT, notes TEXT,
  priority BOOLEAN DEFAULT false, order_position INTEGER DEFAULT 0,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE TABLE contacts (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID NOT NULL REFERENCES firms(id) ON DELETE CASCADE,
  name TEXT NOT NULL, role TEXT, email TEXT, linkedin TEXT, phone TEXT,
  status TEXT DEFAULT 'not_contacted', notes TEXT, advice TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE TABLE opportunities (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID NOT NULL REFERENCES firms(id) ON DELETE CASCADE,
  role TEXT NOT NULL, location TEXT, link TEXT, referral TEXT,
  stage TEXT DEFAULT 'not_applied', stage_order INTEGER DEFAULT 0,
  notes TEXT, created_at TIMESTAMPTZ DEFAULT NOW()
);

-- If upgrading from previous version:
ALTER TABLE opportunities ADD COLUMN IF NOT EXISTS stage_order INTEGER DEFAULT 0;`}</div>
      </details>
      <div className="field"><label>Project URL</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
      <div className="field"><label>Anon / Legacy Key</label><input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGci..." onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      {err&&<div className="error-msg">{err}</div>}
      <button className="btn btn-p" style={{width:'100%',justifyContent:'center',marginTop:20}} onClick={go} disabled={loading}>{loading?'Connecting…':'Connect →'}</button>
    </div></div>
  );
}

/* ══════════════════ APP ══════════════════ */
function App(){
  const cfg=getDbConfig();
  if(!cfg)return <SetupScreen/>;
  const auth=getAuth();
  if(!auth||!auth.userId)return <SignInScreen/>;
  return <Dashboard db={new DB(cfg.url,cfg.key,auth.userId)}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
