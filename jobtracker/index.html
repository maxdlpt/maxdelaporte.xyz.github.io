/* Custom animated checkbox: SVG tick draws itself on check (0.5s) */
function TaskCheckbox({checked,onChange,ticking}){
  /* Disable interaction while the draw animation is in flight */
  function handle(e){e.stopPropagation();if(!ticking)onChange();}
  return(
    <div className={`task-cb${checked?' task-cb--checked':''}${ticking?' task-cb--ticking':''}`}
      onClick={handle}
      role="checkbox" aria-checked={checked} tabIndex={0}
      style={ticking?{cursor:'default'}:undefined}
      onKeyDown={e=>(e.key===' '||e.key==='Enter')&&handle(e)}>
      <svg className="task-cb-svg" viewBox="0 0 16 16" fill="none">
        <polyline className="task-cb-check" points="3,8.5 6.5,12 13,4"
          stroke="var(--accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
      </svg>
    </div>
  );
}

function TaskRow({task,firms,contacts,onToggle,onEdit,onDelete,dragHandlers,isDragOver,isDragging,onMoveUp,onMoveDown,isFirst,isLast,ticking,setRef}){
  const firm = firms.find(f=>f.id===task.firm_id);
  const contact = contacts&&task.contact_id?contacts.find(x=>x.id===task.contact_id):null;
  const touch = isTouchDevice();
  return(
    <>
      {isDragOver&&<div className="task-drop-indicator"/>}
      <div ref={setRef} className={`task-row${task.done?' done-row':''}${isDragging?' dragging':''}${!touch&&dragHandlers?.draggable?' reorderable':''}`}
        {...(touch?{}:dragHandlers)}
        tabIndex={0} role="listitem"
        aria-label={`${task.title}${isFirst!==undefined?`, position ${isFirst?1:(isLast?'last':'middle')}`:''}`}
        title={!touch&&dragHandlers?.draggable?'Drag to reorder':undefined}
        onKeyDown={e=>{
          if(e.key==='ArrowUp'&&onMoveUp&&!isFirst){e.preventDefault();onMoveUp();}
          if(e.key==='ArrowDown'&&onMoveDown&&!isLast){e.preventDefault();onMoveDown();}
        }}>
        {touch && !task.done ? (
          <div className="task-move-btns">
            <button className="btn-icon" aria-label="Move up" onClick={onMoveUp} disabled={isFirst}>&#9650;</button>
            <button className="btn-icon" aria-label="Move down" onClick={onMoveDown} disabled={isLast}>&#9660;</button>
          </div>
        ) : null}
        <TaskCheckbox checked={task.done} onChange={()=>onToggle(task)} ticking={ticking}/>
        <div className="task-main">
          <div className="task-title">
            <span className={`task-title-text${ticking?' striking':''}${task.done&&!ticking?' struck':''}`}>{task.title}</span>
          </div>
          <div className="task-meta">
            {firm&&<span className="tag" style={{fontSize:10,padding:'1px 7px'}}>{firm.name}</span>}
            {contact&&<span className="tag" style={{fontSize:10,padding:'1px 7px',color:'var(--accent)'}}>{contact.name}</span>}
            {task.notes&&<span className="task-notes">{task.notes}</span>}
          </div>
        </div>
        <div className="task-actions">
          <button className="btn-icon" style={{fontSize:13}} onClick={e=>{e.stopPropagation();onEdit(task);}} aria-label="Edit task">✎</button>
          <button className="btn-icon" style={{fontSize:13,color:'var(--danger)'}} onClick={e=>{e.stopPropagation();onDelete(task);}} aria-label="Delete task">✕</button>
        </div>
      </div>
    </>
  );
}

function TodoTab(){
  const {firms,contacts,todos,db,reload} = useContext(DataCtx);
  const {shortcutAction} = useContext(UICtx);
  const {toast} = useContext(NotifyCtx);
  const [formOpen,setFormOpen] = useState(false);
  const [form,setForm] = useState({title:'',firm_id:'',contact_id:'',notes:''});
  const [saving,setSaving] = useState(false);
  const [showDone,setShowDone] = useState(false);
  const [editTodo,setEditTodo] = useState(null);
  const [editForm,setEditForm] = useState({});
  const [dragSrc,setDragSrc] = useState(null);
  const [dragOver,setDragOver] = useState(null);
  const [tickingIds,setTickingIds] = useState(new Set());
  /* Tracks pending animation timeouts so we can cancel on DB error */
  const tickingTimeouts = useRef({});
  /* Local optimistic overlay — mirrors context todos but allows instant UI updates.
     Don't overwrite if an animation is in progress (would jump the task immediately). */
  const [localTodos,setLocalTodos] = useState(todos);
  useEffect(()=>{
    setLocalTodos(prev=>{
      /* Preserve in-flight animation state: keep done:false for ticking tasks */
      return todos.map(t=>tickingTimeouts.current[t.id]?{...t,done:false,done_at:null}:t);
    });
  },[todos]);

  /* ── FLIP animation refs ── */
  const taskRefs = useRef({});
  const pendingFlip = useRef(null);
  function snapshotPositions(){
    const snap={};
    Object.entries(taskRefs.current).forEach(([id,el])=>{
      if(el) snap[id]=el.getBoundingClientRect().top;
    });
    pendingFlip.current=snap;
  }
  useLayoutEffect(()=>{
    const snap=pendingFlip.current;
    if(!snap) return;
    pendingFlip.current=null;
    Object.entries(taskRefs.current).forEach(([id,el])=>{
      if(!el||snap[id]==null) return;
      const delta=snap[id]-el.getBoundingClientRect().top;
      if(Math.abs(delta)<1) return;
      el.style.transition='none';
      el.style.transform=`translateY(${delta}px)`;
      el.getBoundingClientRect(); /* force reflow */
      el.style.transition='transform 0.5s var(--ease-decel)';
      el.style.transform='translateY(0)';
      const cleanup=()=>{el.style.transition='';el.style.transform='';};
      el.addEventListener('transitionend',cleanup,{once:true});
    });
  });

  useEffect(()=>{
    if(!shortcutAction) return;
    if(shortcutAction.type==='new-todo') setFormOpen(true);
  },[shortcutAction]);

  /* ── Midnight cutoff for done-today vs past-tasks ── */
  const todayMidnight = useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();},[]);

  const open = useMemo(()=>[...localTodos.filter(t=>!t.done)].sort((a,b)=>a.priority-b.priority),[localTodos]);
  const doneToday = useMemo(()=>[...localTodos.filter(t=>t.done&&t.done_at&&new Date(t.done_at).getTime()>=todayMidnight)].sort((a,b)=>new Date(a.done_at)-new Date(b.done_at)),[localTodos,todayMidnight]);
  const pastTasks = useMemo(()=>[...localTodos.filter(t=>t.done&&(!t.done_at||new Date(t.done_at).getTime()<todayMidnight))].sort((a,b)=>new Date(b.done_at||b.created_at)-new Date(a.done_at||a.created_at)),[localTodos,todayMidnight]);

  /* Combined active list: undone tasks + tasks ticked today at bottom */
  const activeList = useMemo(()=>[...open,...doneToday],[open,doneToday]);

  async function createTodo(){
    if(!form.title.trim()){toast('Title required','e');return;}
    setSaving(true);
    const tempId='temp-'+Date.now();
    const optimistic={id:tempId,title:form.title,firm_id:form.firm_id||null,contact_id:form.contact_id||null,notes:form.notes||null,priority:open.length,done:false,created_at:new Date().toISOString()};
    setLocalTodos(prev=>[...prev,optimistic]);
    setForm({title:'',firm_id:'',contact_id:'',notes:''});setFormOpen(false);
    try{
      const rows=await db.ins('todos',{title:optimistic.title,firm_id:optimistic.firm_id,contact_id:optimistic.contact_id,notes:optimistic.notes,priority:optimistic.priority,done:false});
      if(Array.isArray(rows)&&rows.length>0) setLocalTodos(prev=>prev.map(t=>t.id===tempId?rows[0]:t));
      reload();toast('Task created','s');
    }catch(e){
      setLocalTodos(prev=>prev.filter(t=>t.id!==tempId));
      toast(friendlyError(e.message),'e');
    }
    setSaving(false);
  }

  function toggleDone(task){
    const nowDone=!task.done;
    const doneAt=nowDone?new Date().toISOString():null;

    if(nowDone){
      /* ── Phase 1: animate checkbox draw + strikethrough ──
         Keep done:false in localTodos so task stays in its current position. */
      setTickingIds(prev=>new Set(prev).add(task.id));

      /* Fire DB write immediately in background (don't await — don't reload yet) */
      db.upd('todos',task.id,{done:true,done_at:doneAt}).catch(e=>{
        /* DB failed — abort animation, revert */
        clearTimeout(tickingTimeouts.current[task.id]);
        delete tickingTimeouts.current[task.id];
        setTickingIds(prev=>{const n=new Set(prev);n.delete(task.id);return n;});
        toast(friendlyError(e.message),'e');
      });

      /* ── Phase 2 (2.1s later): FLIP-slide task to bottom of active list ──
         Snapshot positions BEFORE changing done state so FLIP can compute delta. */
      const tid=setTimeout(()=>{
        delete tickingTimeouts.current[task.id];
        snapshotPositions();
        /* Now set done:true — moves task from open→doneToday, triggering FLIP */
        setLocalTodos(prev=>prev.map(t=>t.id===task.id?{...t,done:true,done_at:doneAt}:t));
        setTickingIds(prev=>{const n=new Set(prev);n.delete(task.id);return n;});
        reload();
      },2100);
      tickingTimeouts.current[task.id]=tid;

    } else {
      /* ── Untick: immediate FLIP back to open list ── */
      snapshotPositions();
      setLocalTodos(prev=>prev.map(t=>t.id===task.id?{...t,done:false,done_at:null}:t));
      db.upd('todos',task.id,{done:false,done_at:null})
        .then(()=>reload())
        .catch(e=>{
          setLocalTodos(prev=>prev.map(t=>t.id===task.id?{...t,done:task.done,done_at:task.done_at}:t));
          toast(friendlyError(e.message),'e');
        });
    }
  }

  async function deleteTodo(task){
    try{await db.del('todos',task.id);reload();toast('Task deleted','s');}
    catch(e){toast(friendlyError(e.message),'e');}
  }

  async function saveEdit(){
    if(!editForm.title?.trim()){toast('Title required','e');return;}
    try{
      await db.upd('todos',editTodo.id,{title:editForm.title,notes:editForm.notes||null,firm_id:editForm.firm_id||null,contact_id:editForm.contact_id||null});
      reload();toast('Task updated','s');setEditTodo(null);
    }catch(e){toast(friendlyError(e.message),'e');}
  }

  async function moveTask(fromIdx, toIdx) {
    if(toIdx<0||toIdx>=open.length) return;
    snapshotPositions();
    const arr=[...open];
    const [moved]=arr.splice(fromIdx,1);
    arr.splice(toIdx,0,moved);
    /* Optimistic local reorder */
    const updates=arr.map((t,i)=>({...t,priority:i}));
    setLocalTodos(prev=>prev.map(t=>{const u=updates.find(x=>x.id===t.id);return u?{...t,priority:u.priority}:t;}));
    try{
      await Promise.all(arr.map((t,i)=>db.upd('todos',t.id,{priority:i})));
      reload();
    }catch(e){toast('Reorder failed','e');reload();}
  }

  function onDragStart(e,task){setDragSrc(task);e.dataTransfer.effectAllowed='move';}
  function onDragEnd(){setDragSrc(null);setDragOver(null);}
  function onDragOverFn(e,task){e.preventDefault();if(dragSrc&&dragSrc.id!==task.id)setDragOver(task.id);}
  function onDragLeaveFn(){setDragOver(null);}
  async function onDrop(e,task){
    e.preventDefault();setDragOver(null);
    if(!dragSrc||dragSrc.id===task.id)return;
    snapshotPositions();
    const prevOrder=open.map(t=>({id:t.id,priority:t.priority}));
    const arr=[...open];
    const srcIdx=arr.findIndex(t=>t.id===dragSrc.id);
    const tgtIdx=arr.findIndex(t=>t.id===task.id);
    arr.splice(srcIdx,1);arr.splice(tgtIdx,0,dragSrc);
    /* Optimistic local reorder */
    const updates=arr.map((t,i)=>({...t,priority:i}));
    setLocalTodos(prev=>prev.map(t=>{const u=updates.find(x=>x.id===t.id);return u?{...t,priority:u.priority}:t;}));
    try{
      await Promise.all(arr.map((t,i)=>db.upd('todos',t.id,{priority:i})));
      reload();
    }catch(err){
      toast('Reorder failed, reverting','e');
      try{await Promise.all(prevOrder.map(p=>db.upd('todos',p.id,{priority:p.priority})));}catch(_){}
      reload();
    }
  }

  return(
    <div className="todo-page">
      <div className="create-card">
        <div className="create-card-head" onClick={()=>setFormOpen(!formOpen)}>
          <span className={`create-card-icon${formOpen?' open':''}`} aria-hidden="true"/> New Task
        </div>
        <div className={`create-card-body${formOpen?' create-card-body--open':''}`}>
          <div className="field"><label htmlFor="todo-title">Title</label><input id="todo-title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="What needs to be done?" onKeyDown={e=>e.key==='Enter'&&createTodo()}/></div>
          <CompanyCombo value={form.firm_id||''} onChange={v=>setForm(f=>({...f,firm_id:v,contact_id:''}))} firms={firms} label="Company (optional)"/>
          <ContactCombo value={form.contact_id||''} onChange={v=>setForm(f=>({...f,contact_id:v}))} contacts={contacts} firmId={form.firm_id} label="Contact (optional)"/>
          <div className="field"><label htmlFor="todo-notes">Notes (optional)</label><textarea id="todo-notes" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Any details..."/></div>
          <button className="btn btn-p" onClick={createTodo} disabled={saving} style={{marginTop:8}}>{saving?'Saving…':'Add Task'}</button>
        </div>
      </div>

      {!activeList.length&&!pastTasks.length&&<div className="empty-state">No tasks yet. Press <strong>N</strong> to add one.</div>}

      {activeList.map((task,idx)=>{
        const isInOpen=!task.done;
        const openIdx=isInOpen?open.indexOf(task):-1;
        return(
          <TaskRow key={task.id} task={task} firms={firms} contacts={contacts}
            onToggle={toggleDone}
            onEdit={t=>{setEditTodo(t);setEditForm({title:t.title,notes:t.notes||'',firm_id:t.firm_id||'',contact_id:t.contact_id||''}); }}
            onDelete={deleteTodo}
            isDragOver={dragOver===task.id}
            isDragging={dragSrc?.id===task.id}
            dragHandlers={isInOpen?{draggable:true,onDragStart:e=>onDragStart(e,task),onDragEnd,onDragOver:e=>onDragOverFn(e,task),onDragLeave:onDragLeaveFn,onDrop:e=>onDrop(e,task)}:{}}
            onMoveUp={isInOpen?()=>moveTask(openIdx,openIdx-1):undefined}
            onMoveDown={isInOpen?()=>moveTask(openIdx,openIdx+1):undefined}
            isFirst={isInOpen?openIdx===0:true} isLast={isInOpen?openIdx===open.length-1:true}
            ticking={tickingIds.has(task.id)}
            setRef={el=>{taskRefs.current[task.id]=el;}}
          />
        );
      })}

      {pastTasks.length>0&&(
        <>
          <div className="done-section-header" onClick={()=>setShowDone(!showDone)}>
            <span>{showDone?'▾':'▸'}</span>
            <span>Past Tasks ({pastTasks.length})</span>
          </div>
          {showDone&&pastTasks.map(task=>(
            <TaskRow key={task.id} task={task} firms={firms} contacts={contacts}
              onToggle={toggleDone}
              onEdit={t=>{setEditTodo(t);setEditForm({title:t.title,notes:t.notes||'',firm_id:t.firm_id||'',contact_id:t.contact_id||''}); }}
              onDelete={deleteTodo}
              isDragOver={false} isDragging={false} dragHandlers={{}}
              setRef={el=>{taskRefs.current[task.id]=el;}}
            />
          ))}
        </>
      )}

      {editTodo&&(
        <Modal title="Edit Task" onClose={()=>setEditTodo(null)} onSave={saveEdit} saveLabel="Update">
          <div className="field"><label htmlFor="edit-title">Title</label><input id="edit-title" value={editForm.title} onChange={e=>setEditForm({...editForm,title:e.target.value})}/></div>
          <CompanyCombo value={editForm.firm_id||''} onChange={v=>setEditForm(f=>({...f,firm_id:v,contact_id:''}))} firms={firms} label="Company"/>
          <ContactCombo value={editForm.contact_id||''} onChange={v=>setEditForm(f=>({...f,contact_id:v}))} contacts={contacts} firmId={editForm.firm_id} label="Contact"/>
          <div className="field"><label htmlFor="edit-notes">Notes</label><textarea id="edit-notes" value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})}/></div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════ GLOBAL MODAL HANDLER ══════════════════ */
function GlobalModals(){
  const {firms,db,reload} = useContext(DataCtx);
  const {modal,setModal} = useContext(UICtx);
  const {toast} = useContext(NotifyCtx);
  const [form,setForm] = useState({});
  const [saving,setSaving] = useState(false);
  const [newFirmModal,setNewFirmModal] = useState(null);
  const [newFirmForm,setNewFirmForm] = useState({name:'',type:'',next_steps:'',notes:''});

  useEffect(()=>{
    if(!modal)return;
    if(modal.type==='add-firm')setForm({name:'',type:'',next_steps:'',notes:''});
    if(modal.type==='edit-firm')setForm({name:modal.data.name,type:modal.data.type||'',next_steps:modal.data.next_steps||'',notes:modal.data.notes||''});
    if(modal.type==='add-contact')setForm({firm_id:modal.firmId||'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});
    if(modal.type==='edit-contact'){const d=modal.data;setForm({firm_id:d.firm_id,name:d.name,role:d.role||'',email:d.email||'',linkedin:d.linkedin||'',phone:d.phone||'',status:d.status||'not_contacted',notes:d.notes||'',advice:d.advice||''});}
    if(modal.type==='add-opp')setForm({firm_id:modal.firmId||'',role:'',location:'',link:'',referral:'',notes:''});
    if(modal.type==='edit-opp'){const d=modal.data;setForm({firm_id:d.firm_id,role:d.role||'',location:d.location||'',link:d.link||'',referral:d.referral||'',stage:d.stage||'not_applied',notes:d.notes||''});}
  },[modal]);

  if(!modal)return null;
  const close=()=>setModal(null);

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{const f=await db.ins('firms',{...newFirmForm,order_position:firms.length});reload();setForm(prev=>({...prev,firm_id:f.id}));setNewFirmModal(null);toast('Firm created','s');}
    catch(e){toast(friendlyError(e.message),'e');}
  }

  async function save(){
    setSaving(true);
    try{
      /* ── Firm validation ── */
      if(modal.type==='add-firm'){if(!form.name.trim()){toast('Firm name is required','e');setSaving(false);return;}await db.ins('firms',{...form,order_position:firms.length});reload();toast('Firm created','s');close();}
      if(modal.type==='edit-firm'){if(!form.name.trim()){toast('Firm name is required','e');setSaving(false);return;}await db.upd('firms',modal.data.id,form);reload();toast('Firm updated','s');close();}
      /* ── Contact validation (email, LinkedIn URL, phone) ── */
      if(modal.type==='add-contact'||modal.type==='edit-contact'){
        if(!form.name.trim()||!form.firm_id){toast('Name and company required','e');setSaving(false);return;}
        if(!isValidEmail(form.email)){toast('Invalid email format','e');setSaving(false);return;}
        if(!isValidUrl(form.linkedin)){toast('Invalid LinkedIn URL','e');setSaving(false);return;}
        if(!isValidPhone(form.phone)){toast('Invalid phone number format','e');setSaving(false);return;}
        if(modal.type==='add-contact'){await db.ins('contacts',form);reload();toast('Contact added','s');close();}
        else{await db.upd('contacts',modal.data.id,form);reload();toast('Contact updated','s');close();}
      }
      /* ── Opportunity validation (job link URL) ── */
      if(modal.type==='add-opp'||modal.type==='edit-opp'){
        if(modal.type==='add-opp'&&(!form.role.trim()||!form.firm_id)){toast('Role and company required','e');setSaving(false);return;}
        if(!isValidUrl(form.link)){toast('Invalid job link URL','e');setSaving(false);return;}
        if(modal.type==='add-opp'){await db.ins('opportunities',{...form,stage:'not_applied',stage_order:0});reload();toast('Opportunity created','s');close();}
        else{await db.upd('opportunities',modal.data.id,form);reload();toast('Opportunity updated','s');close();}
      }
      if(modal.type==='del-firm'){await db.del('firms',modal.data.id);reload();toast('Firm deleted','s');close();}
      if(modal.type==='del-contact'){await db.del('contacts',modal.data.id);reload();toast('Contact deleted','s');close();}
      if(modal.type==='del-opp'){await db.del('opportunities',modal.data.id);reload();toast('Opportunity deleted','s');close();}
    }catch(e){toast(friendlyError(e.message),'e');}
    setSaving(false);
  }

  if(modal.type==='del-firm')return <Modal title="Delete Firm" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.name}</strong> and all its contacts/opportunities? This cannot be undone.</p></Modal>;
  if(modal.type==='del-contact')return <Modal title="Delete Contact" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.name}</strong>? This cannot be undone.</p></Modal>;
  if(modal.type==='del-opp')return <Modal title="Delete Opportunity" onClose={close} onSave={save} saveLabel="Delete" saving={saving} danger><p>Delete <strong>{modal.data.role}</strong>? This cannot be undone.</p></Modal>;

  const createFirmCb=(name)=>{setNewFirmForm({name,type:'',next_steps:'',notes:''});setNewFirmModal(true);};

  if(modal.type==='add-firm'||modal.type==='edit-firm')return <Modal title={modal.type==='add-firm'?'Add Firm':'Edit Firm'} onClose={close} onSave={save} saveLabel={modal.type==='add-firm'?'Create':'Update'} saving={saving}><FirmForm d={form} set={setForm}/></Modal>;
  if(modal.type==='add-contact'||modal.type==='edit-contact')return(<>
    <Modal title={modal.type==='add-contact'?'Add Contact':'Edit Contact'} onClose={close} onSave={save} saveLabel={modal.type==='add-contact'?'Create':'Update'} saving={saving}><ContactFormFields d={form} set={setForm} firms={firms} onCreateFirm={createFirmCb}/></Modal>
    {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}
  </>);
  if(modal.type==='add-opp'||modal.type==='edit-opp'){
    const isEdit=modal.type==='edit-opp';
    return(<>
      <Modal title={isEdit?'Edit Opportunity':'Add Opportunity'} onClose={close} onSave={save} saveLabel={isEdit?'Update':'Create'} saving={saving}>
        <OppFormFields d={form} set={setForm} firms={firms} onCreateFirm={createFirmCb}/>
        {isEdit&&<div className="field"><label>Stage</label><select value={form.stage||'not_applied'} onChange={e=>setForm({...form,stage:e.target.value})}>{STAGES.map(s=><option key={s.v} value={s.v}>{s.label}</option>)}</select></div>}
      </Modal>
      {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}
    </>);
  }
  return null;
}

/* ══════════════════ TAB 4: MATCHMAKER ══════════════════ */
function MatchmakerTab(){
  const {firms, matchmaker, db, reload} = useContext(DataCtx);
  const {toast} = useContext(NotifyCtx);
  const [exitDir, setExitDir] = useState(null);
  const [entering, setEntering] = useState(false);
  const [acceptModal, setAcceptModal] = useState(null);
  const [oppForm, setOppForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [newFirmModal, setNewFirmModal] = useState(null);
  const [newFirmForm, setNewFirmForm] = useState({name:'',type:'',career_page_url:'',next_steps:'',notes:''});

  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const dragStart = useRef(null);
  const cardRef = useRef(null);

  const SWIPE_THRESHOLD = 80;

  const pending = useMemo(()=>
    matchmaker.filter(s=>s.pipeline_decision==='pending'),
  [matchmaker]);

  const reviewed = useMemo(()=>
    matchmaker.filter(s=>s.pipeline_decision!=='pending')
      .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),
  [matchmaker]);

  const current = pending[0] || null;

  function firmName(fid){ return firms.find(f=>f.id===fid)?.name || '?'; }
  function scoreClass(s){ return s>=70?'high':s>=50?'medium':'low'; }

  function animateAndAct(direction, actionFn){
    setExitDir(direction);
    setTimeout(()=>{
      actionFn();
      setExitDir(null);
      setEntering(true);
      setTimeout(()=>setEntering(false), 300);
    }, 350);
  }

  async function doReject(){
    if(!current) return;
    try{
      await db.upd('matchmaker', current.id, {pipeline_decision:'rejected'});
      reload();
    }catch(e){ toast(friendlyError(e.message),'e'); }
  }

  function doAcceptStart(){
    if(!current) return;
    setOppForm({
      firm_id: current.firm_id,
      role: current.job_title || '',
      location: current.location || '',
      link: current.job_url || '',
      referral: '',
      notes: current.department ? 'Department: '+current.department : '',
    });
    setAcceptModal(current);
  }

  function reject(){
    animateAndAct('left', doReject);
  }

  function accept(){
    animateAndAct('right', doAcceptStart);
  }

  async function confirmAccept(){
    if(!oppForm.firm_id || !oppForm.role.trim()){
      toast('Company and role required','e'); return;
    }
    setSaving(true);
    try{
      await db.ins('opportunities', {...oppForm, stage:'not_applied', stage_order:0});
      await db.upd('matchmaker', acceptModal.id, {pipeline_decision:'accepted'});
      reload();
      toast('Added to pipeline','s');
      setAcceptModal(null);
    }catch(e){ toast(friendlyError(e.message),'e'); }
    setSaving(false);
  }

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{
      const f = await db.ins('firms',{...newFirmForm, order_position:firms.length});
      reload();
      setOppForm(prev=>({...prev, firm_id:f.id}));
      setNewFirmModal(null);
      toast('Firm created','s');
    }catch(e){ toast(friendlyError(e.message),'e'); }
  }

  function onPointerDown(e){
    if(acceptModal || !current) return;
    dragStart.current = e.clientX;
    setDragging(true);
    setDragX(0);
  }

  function onPointerMove(e){
    if(!dragging || dragStart.current===null) return;
    setDragX(e.clientX - dragStart.current);
  }

  function onPointerUp(){
    if(!dragging) return;
    setDragging(false);
    dragStart.current = null;
    if(dragX < -SWIPE_THRESHOLD){
      reject();
    } else if(dragX > SWIPE_THRESHOLD){
      accept();
    }
    setDragX(0);
  }

  useEffect(()=>{
    function handle(e){
      const el = document.activeElement;
      if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')) return;
      if(acceptModal || newFirmModal) return;

      if(e.key==='ArrowLeft'){  e.preventDefault(); reject(); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); accept(); }
      else if(e.key==='o'||e.key==='O'){
        if(current?.job_url){ e.preventDefault(); window.open(current.job_url,'_blank'); }
      }
    }
    window.addEventListener('keydown', handle);
    return ()=> window.removeEventListener('keydown', handle);
  });

  const acceptedCount = reviewed.filter(s=>s.pipeline_decision==='accepted').length;
  const rejectedCount = reviewed.filter(s=>s.pipeline_decision==='rejected').length;

  const hintOpacity = Math.min(Math.abs(dragX) / SWIPE_THRESHOLD, 1);

  const cardDragStyle = dragging ? {
    transform: `translateX(${dragX}px) rotate(${dragX * 0.05}deg)`,
  } : {};

  let cardClass = 'mm-card';
  if(dragging) cardClass += ' swiping';
  if(exitDir==='left') cardClass += ' exit-left';
  if(exitDir==='right') cardClass += ' exit-right';
  if(entering && !exitDir) cardClass += ' entering';

  return(
    <div className="mm-page">

      <div className="mm-summary">
        <span className="mm-count" style={{background:'rgba(129,211,26,.12)',color:'var(--accent)'}}>
          {pending.length} pending
        </span>
        <span className="mm-count" style={{background:'rgba(16,185,129,.12)',color:'var(--col-green)'}}>
          {acceptedCount} accepted
        </span>
        <span className="mm-count" style={{background:'rgba(255,99,72,.12)',color:'var(--danger)'}}>
          {rejectedCount} rejected
        </span>
      </div>

      {current && !exitDir ? (
        <>
          <div className="mm-progress">{pending.indexOf(current)+1} of {pending.length}</div>

          <div className="mm-stack">
            <div
              ref={cardRef}
              className={cardClass}
              style={cardDragStyle}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerLeave={onPointerUp}
            >
              <div className="mm-swipe-hint reject-hint" style={{opacity: dragX<0 ? hintOpacity : 0}}>NOPE</div>
              <div className="mm-swipe-hint accept-hint" style={{opacity: dragX>0 ? hintOpacity : 0}}>LIKE</div>

              <div className="mm-firm">{firmName(current.firm_id)}</div>
              <div className="mm-title">{current.job_title}</div>

              <div className="mm-meta">
                <span className={`mm-score ${scoreClass(current.match_score)}`}>
                  {current.match_score}/100
                </span>
                {current.department && <span className="badge b-purple">{current.department}</span>}
                {current.location && <span className="badge b-grey">{current.location}</span>}
                {current.date_posted && (
                  <span className="badge b-blue">
                    Posted {new Date(current.date_posted).toLocaleDateString()}
                  </span>
                )}
              </div>

              {current.job_url && (
                <a className="mm-link-btn" href={current.job_url} target="_blank" rel="noreferrer"
                   onClick={e=>e.stopPropagation()}>
                  ↗ View posting
                </a>
              )}
            </div>
          </div>

          <div className="mm-actions">
            <button className="mm-action-btn mm-btn-reject" onClick={reject} title="Reject"><IconReject/></button>
            <button className="mm-action-btn mm-btn-accept" onClick={accept} title="Accept"><IconHeart/></button>
          </div>

        </>
      ) : !exitDir ? (
        <div className="empty-state" style={{paddingTop:60}}>
          {matchmaker.length === 0
            ? 'No matches yet. The nightly scan will populate this.'
            : 'All caught up — no pending matches to review.'}
        </div>
      ) : null}

      {reviewed.length > 0 && (
        <>
          <button className="mm-history-toggle" onClick={()=>setShowHistory(!showHistory)}>
            {showHistory ? '▾' : '▸'} Reviewed ({reviewed.length})
          </button>

          {showHistory && (
            <div className="mm-history">
              {reviewed.map(s=>(
                <div key={s.id} className="mm-history-row">
                  <Badge v={s.pipeline_decision} arr={[
                    {v:'accepted',label:'In Pipeline',cls:'b-green'},
                    {v:'rejected',label:'Rejected',cls:'b-red'},
                  ]}/>
                  <span className="h-firm">{firmName(s.firm_id)}</span>
                  <span className="h-title">{s.job_title}</span>
                  <span className={`mm-score ${scoreClass(s.match_score)}`} style={{fontSize:11,padding:'2px 8px'}}>
                    {s.match_score}
                  </span>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {acceptModal && (
        <Modal title="Add to Pipeline" onClose={()=>setAcceptModal(null)} onSave={confirmAccept}
          saveLabel="Add to Pipeline" saving={saving}>
          <OppFormFields d={oppForm} set={setOppForm} firms={firms}
            onCreateFirm={(name)=>{
              setNewFirmForm({name,type:'',career_page_url:'',next_steps:'',notes:''});
              setNewFirmModal(true);
            }}/>
        </Modal>
      )}

      {newFirmModal && (
        <Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create">
          <FirmForm d={newFirmForm} set={setNewFirmForm}/>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════ DASHBOARD ══════════════════ */
function Dashboard({db:dbInstance}){
  const [firms,setFirms] = useState([]);
  const [contacts,setContacts] = useState([]);
  const [opps,setOpps] = useState([]);
  const [todos,setTodos] = useState([]);
  const [matchmaker,setMatchmaker] = useState([]);
  const [tab,setTab] = useState('todo');
  const [modal,setModal] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [loading,setLoading] = useState(true);
  const [showHelp,setShowHelp] = useState(false);
  const [shortcutAction,setShortcutAction] = useState(null);
  const [universeSubTab,setUniverseSubTab] = useState('overview');

  /* ── Refs for keyboard handler (avoids re-creating listener on every state change) ── */
  const tabRef = useRef(tab);
  const modalRef = useRef(modal);
  const showHelpRef = useRef(showHelp);
  const universeSubTabRef = useRef(universeSubTab);
  useEffect(()=>{tabRef.current=tab;},[tab]);
  useEffect(()=>{modalRef.current=modal;},[modal]);
  useEffect(()=>{showHelpRef.current=showHelp;},[showHelp]);
  useEffect(()=>{universeSubTabRef.current=universeSubTab;},[universeSubTab]);

  /* ── Toast with deduplication (suppress identical messages within 500ms) ── */
  const lastToastRef = useRef({msg:'',ts:0});
  const toast = useCallback((msg,type='s')=>{
    const now=Date.now();
    if(msg===lastToastRef.current.msg && now-lastToastRef.current.ts<500) return;
    lastToastRef.current={msg,ts:now};
    const id=now+Math.random();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.map(t=>t.id===id?{...t,out:true}:t)),2500);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);

  /* ── Granular reload functions ── */
  const reloadFirms = useCallback(async()=>{
    try{const f=await fetchWithRetry(()=>dbInstance.get('firms','order=order_position.asc.nullsfirst'));setFirms(Array.isArray(f)?f:[]);}
    catch(e){toast(friendlyError(e.message),'e');}
  },[dbInstance,toast]);
  const reloadContacts = useCallback(async()=>{
    try{const c=await fetchWithRetry(()=>dbInstance.get('contacts'));setContacts(Array.isArray(c)?c:[]);}
    catch(e){toast(friendlyError(e.message),'e');}
  },[dbInstance,toast]);
  const reloadOpps = useCallback(async()=>{
    try{const o=await fetchWithRetry(()=>dbInstance.get('opportunities'));setOpps(Array.isArray(o)?o:[]);}
    catch(e){toast(friendlyError(e.message),'e');}
  },[dbInstance,toast]);
  const reloadTodos = useCallback(async()=>{
    try{const td=await fetchWithRetry(()=>dbInstance.get('todos'));setTodos(Array.isArray(td)?td:[]);}
    catch(e){toast(friendlyError(e.message),'e');}
  },[dbInstance,toast]);
  const reloadMatchmaker = useCallback(async()=>{
    try{const mm=await fetchWithRetry(()=>dbInstance.get('matchmaker','order=match_score.desc.nullslast'));setMatchmaker(Array.isArray(mm)?mm:[]);}
    catch(e){toast(friendlyError(e.message),'e');}
  },[dbInstance,toast]);

  /* ── Full load with Promise.allSettled (granular error handling) ── */
  const loadData = useCallback(async()=>{
    const results = await Promise.allSettled([
      fetchWithRetry(()=>dbInstance.get('firms','order=order_position.asc.nullsfirst')),
      fetchWithRetry(()=>dbInstance.get('contacts')),
      fetchWithRetry(()=>dbInstance.get('opportunities')),
      fetchWithRetry(()=>dbInstance.get('todos')),
      fetchWithRetry(()=>dbInstance.get('matchmaker','order=match_score.desc.nullslast')),
    ]);
    const names=['Firms','Contacts','Opportunities','Todos','Matchmaker'];
    const setters=[setFirms,setContacts,setOpps,setTodos,setMatchmaker];
    results.forEach((r,i)=>{
      if(r.status==='fulfilled') setters[i](Array.isArray(r.value)?r.value:[]);
      else toast('Failed to load '+names[i]+': '+friendlyError(r.reason?.message||'Unknown error'),'e');
    });
    setLoading(false);
  },[dbInstance,toast]);

  useEffect(()=>{loadData();},[loadData]);

  /* ── Pull-to-refresh for mobile ── */
  const pullProps = usePullToRefresh(loadData);

  const TABS_ORDER = ['todo','universe','pipeline','matchmaker'];

  /* ── Keyboard shortcuts (stable listener via refs) ── */
  const loadDataRef = useRef(loadData);
  const toastRef = useRef(toast);
  useEffect(()=>{loadDataRef.current=loadData;},[loadData]);
  useEffect(()=>{toastRef.current=toast;},[toast]);

  useEffect(()=>{
    function isInputFocused(){const el=document.activeElement;return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);}
    function handle(e){
      if(showHelpRef.current&&e.key==='Escape'){setShowHelp(false);return;}
      if(modalRef.current&&e.key==='Escape') return;
      if(e.key==='?'&&!isInputFocused()){setShowHelp(p=>!p);return;}
      if(isInputFocused()) return;
      const k=e.key;
      const curTab=tabRef.current;
      const idx=TABS_ORDER.indexOf(curTab);
      if(k==='1'){setTab('todo');}
      else if(k==='2'){setTab('universe');}
      else if(k==='3'){setTab('pipeline');}
      else if(k==='4'){setTab('matchmaker');}
      else if((k==='ArrowLeft'||k==='['||k==='PageUp')&&idx>0&&curTab!=='matchmaker'){e.preventDefault();setTab(TABS_ORDER[idx-1]);}
      else if((k==='ArrowRight'||k===']'||k==='PageDown')&&idx<TABS_ORDER.length-1&&curTab!=='matchmaker'){e.preventDefault();setTab(TABS_ORDER[idx+1]);}
      else if((k==='r'||k==='R')&&curTab!=='matchmaker'){loadDataRef.current();toastRef.current('Refreshed','s');}
      else if(k==='/'){ e.preventDefault();setShortcutAction({type:'focus-search',ts:Date.now()});}
      else if(k==='n'||k==='N'){
        if(curTab==='todo') setShortcutAction({type:'new-todo',ts:Date.now()});
        else if(curTab==='universe'){
          const sub=universeSubTabRef.current;
          if(sub==='overview') setModal({type:'add-firm'});
          else if(sub==='contacts') setShortcutAction({type:'new-contact',ts:Date.now()});
          else setShortcutAction({type:'new-opp',ts:Date.now()});
        }
      }
    }
    window.addEventListener('keydown',handle);
    return()=>window.removeEventListener('keydown',handle);
  },[]);

  /* ── Split memoized context values ── */
  const dataCtx = useMemo(()=>({firms,contacts,opps,todos,matchmaker,db:dbInstance,reload:loadData,reloadFirms,reloadContacts,reloadOpps,reloadTodos,reloadMatchmaker}),[firms,contacts,opps,todos,matchmaker,dbInstance,loadData,reloadFirms,reloadContacts,reloadOpps,reloadTodos,reloadMatchmaker]);
  const uiCtx = useMemo(()=>({modal,setModal,shortcutAction,setShortcutAction,setTab,universeSubTab,setUniverseSubTab}),[modal,shortcutAction,universeSubTab]);
  const notifyCtx = useMemo(()=>({toast,toasts}),[toast,toasts]);

  function logout(){localStorage.removeItem('hfcrm_auth');window.location.reload();}

  if(loading)return <div className="empty-state" style={{paddingTop:100}}>Loading...</div>;

  const tabs=[
    {k:'todo',label:'Todo',Icon:IconTodo},
    {k:'universe',label:'Universe',Icon:IconUniverse},
    {k:'pipeline',label:'Pipeline',Icon:IconPipeline},
    {k:'matchmaker',label:'Matchmaker',Icon:IconMatchmaker},
  ];

  return(
    <DataCtx.Provider value={dataCtx}>
    <UICtx.Provider value={uiCtx}>
    <NotifyCtx.Provider value={notifyCtx}>
      <div className="app">
        <div className="sidebar">
          <div className="sidebar-top"><IconJobTracker/></div>
          <div className="sidebar-nav">
            {tabs.map(({k,label,Icon})=>(
              <div key={k} data-k={k} className={`sidebar-item ${tab===k?'active':''}`} onClick={()=>setTab(k)}>
                <span className="sidebar-icon-slot"><Icon/></span><span className="sidebar-label">{label}</span>
              </div>
            ))}
          </div>
          <div className="sidebar-bottom">
            <div className="sidebar-item" onClick={logout}><span className="sidebar-icon-slot"><IconLogout/></span><span className="sidebar-label">Logout</span></div>
          </div>
        </div>
        {/* ── Mobile navigation ── */}
        <MobileNav items={tabs} tab={tab} setTab={setTab} />
        <div className="main-area">
          <div className={`topbar${tab==='universe'?' no-bdr':''}`}><h1>{({todo:'Todo',universe:'Universe',pipeline:'Pipeline',matchmaker:'Matchmaker'})[tab]}</h1><div className="topbar-r"><button className="btn-icon" onClick={()=>setShowHelp(true)} title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">⌨</button></div></div>
          <div className="tab-content" {...pullProps}>
            <ErrorBoundary key={'eb-'+tab}>
              <div key={tab} className="tab-slide">
                {tab==='todo'&&<TodoTab/>}
                {tab==='universe'&&<UniverseTab/>}
                {tab==='pipeline'&&<PipelineTab/>}
                {tab==='matchmaker'&&<MatchmakerTab/>}
              </div>
            </ErrorBoundary>
          </div>
        </div>
        <GlobalModals/>
        <ToastContainer/>
        {showHelp&&(
          <div className="kb-overlay" onClick={()=>setShowHelp(false)}>
            <div className="kb-modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" onClick={e=>e.stopPropagation()}>
              <h2>⌨ Keyboard Shortcuts <kbd>?</kbd></h2>
              <div className="kb-section">
                <div className="kb-section-title">Tab Navigation</div>
                <div className="kb-row"><span className="kb-desc">Todo</span><div className="kb-keys"><span className="kb-key">1</span></div></div>
                <div className="kb-row"><span className="kb-desc">Universe</span><div className="kb-keys"><span className="kb-key">2</span></div></div>
                <div className="kb-row"><span className="kb-desc">Pipeline</span><div className="kb-keys"><span className="kb-key">3</span></div></div>
                <div className="kb-row"><span className="kb-desc">Matchmaker</span><div className="kb-keys"><span className="kb-key">4</span></div></div>
                <div className="kb-row"><span className="kb-desc">Previous tab</span><div className="kb-keys"><span className="kb-key">←</span><span className="kb-key">[</span><span className="kb-key">PgUp</span></div></div>
                <div className="kb-row"><span className="kb-desc">Next tab</span><div className="kb-keys"><span className="kb-key">→</span><span className="kb-key">]</span><span className="kb-key">PgDn</span></div></div>
              </div>
              <div className="kb-section">
                <div className="kb-section-title">Global</div>
                <div className="kb-row"><span className="kb-desc">Show / hide this panel</span><div className="kb-keys"><span className="kb-key">?</span></div></div>
                <div className="kb-row"><span className="kb-desc">Close modal / dismiss</span><div className="kb-keys"><span className="kb-key">Esc</span></div></div>
                <div className="kb-row"><span className="kb-desc">Refresh data</span><div className="kb-keys"><span className="kb-key">R</span></div></div>
              </div>
              <div className="kb-section">
                <div className="kb-section-title">Context-Sensitive Actions</div>
                <div className="kb-row"><span className="kb-desc">New task (Todo) / new firm, contact, or opp (Universe, based on active sub-tab)</span><div className="kb-keys"><span className="kb-key">N</span></div></div>
                <div className="kb-row"><span className="kb-desc">Focus search bar (Contacts / Opportunities)</span><div className="kb-keys"><span className="kb-key">/</span></div></div>
              </div>
              <div className="kb-section">
                <div className="kb-section-title">Modals &amp; Forms</div>
                <div className="kb-row"><span className="kb-desc">Confirm / save</span><div className="kb-keys"><span className="kb-key">Enter</span></div></div>
                <div className="kb-row"><span className="kb-desc">Cancel / close</span><div className="kb-keys"><span className="kb-key">Esc</span></div></div>
              </div>
              <div className="kb-section">
                <div className="kb-section-title">Matchmaker (when active)</div>
                <div className="kb-row"><span className="kb-desc">Reject (swipe left)</span><div className="kb-keys"><span className="kb-key">←</span></div></div>
                <div className="kb-row"><span className="kb-desc">Accept (swipe right)</span><div className="kb-keys"><span className="kb-key">→</span></div></div>
                <div className="kb-row"><span className="kb-desc">Open job posting</span><div className="kb-keys"><span className="kb-key">O</span></div></div>
              </div>
              <div className="kb-section">
                <div className="kb-section-title">Contact Rows</div>
                <div className="kb-row"><span className="kb-desc">Expand / collapse detail</span><div className="kb-keys"><span className="kb-key">Click</span></div></div>
                <div className="kb-row"><span className="kb-desc">Copy email to clipboard</span><div className="kb-keys"><span className="kb-key">✉ button</span></div></div>
                <div className="kb-row"><span className="kb-desc">Copy phone to clipboard</span><div className="kb-keys"><span className="kb-key">☎ button</span></div></div>
              </div>
              <div style={{marginTop:16,textAlign:'center'}}><button className="btn btn-s btn-sm" onClick={()=>setShowHelp(false)}>Close</button></div>
            </div>
          </div>
        )}
      </div>
    </NotifyCtx.Provider>
    </UICtx.Provider>
    </DataCtx.Provider>
  );
}

/* ══════════════════ SIGN-IN SCREEN ══════════════════ */
/* ══════════════════ MOBILE NAV ══════════════════ */
function MobileNav({items, tab, setTab}){
  const itemRefs = React.useRef([]);
  const textRefs = React.useRef([]);
  const activeIndex = items.findIndex(item => item.k === tab);
  React.useEffect(()=>{
    const update = () => {
      const el = itemRefs.current[activeIndex];
      const txt = textRefs.current[activeIndex];
      if(el && txt) el.style.setProperty('--lineWidth', txt.offsetWidth + 'px');
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, [activeIndex, items]);
  return (
    <nav className="mobile-menu" role="navigation">
      {items.map((item, index) => {
        const isActive = index === activeIndex;
        const Icon = item.Icon;
        return (
          <button
            key={item.k}
            className={'mobile-menu__item' + (isActive ? ' active' : '')}
            onClick={() => setTab(item.k)}
            ref={el => itemRefs.current[index] = el}
            style={{'--lineWidth': '0px'}}
          >
            <div className="mobile-menu__icon"><Icon /></div>
            <strong
              className={'mobile-menu__text' + (isActive ? ' active' : '')}
              ref={el => textRefs.current[index] = el}
            >{item.label}</strong>
          </button>
        );
      })}
    </nav>
  );
}

function SignInScreen(){
  const [mode,setMode]=useState('signin');
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [confirm,setConfirm]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  async function go(){
    const u=username.trim().toLowerCase();
    if(!u||!password){setErr('Username and password required.');return;}
    if(mode==='create'){
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(u)){setErr('Username: 3–20 chars, alphanumeric + underscores.');return;}
      if(password.length<6){setErr('Password must be at least 6 characters.');return;}
      if(password!==confirm){setErr('Passwords do not match.');return;}
    }
    setLoading(true);setErr('');
    try{
      const cfg=getDbConfig();
      const db=new DB(cfg.url,cfg.key);
      if(mode==='signin'){
        const rows=await db.rpc('check_password',{p_username:u,p_password:password});
        if(Array.isArray(rows)&&rows.length>0){
          localStorage.setItem('hfcrm_auth',JSON.stringify({userId:rows[0].id,username:rows[0].username,ts:Date.now()}));
          if(rows[0].username==='demo'){
            await fetch(`${cfg.url}/rest/v1/matchmaker?user_id=eq.${rows[0].id}`,{method:'PATCH',headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify({pipeline_decision:'pending'})});
          }
          window.location.reload();
        } else {setErr('Invalid username or password.');}
      } else {
        const rows=await db.rpc('create_user',{p_username:u,p_password:password});
        if(Array.isArray(rows)&&rows.length>0){
          localStorage.setItem('hfcrm_auth',JSON.stringify({userId:rows[0].id,username:rows[0].username,ts:Date.now()}));
          window.location.reload();
        } else {setErr('Could not create account.');}
      }
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('duplicate key')||msg.includes('unique'))setErr('Username already taken.');
      else setErr((mode==='signin'?'Login':'Signup')+' error: '+msg);
    }
    setLoading(false);
  }

  return(
    <div className="auth-wrap"><div className="auth-card">
      <h1>Job Search Tracker</h1>
      <div style={{display:'flex',gap:0,marginBottom:24}}>
        <button className={`btn ${mode==='signin'?'btn-p':'btn-s'}`} style={{flex:1,justifyContent:'center',borderRadius:'var(--r) 0 0 var(--r)'}} onClick={()=>{setMode('signin');setErr('');}}>Sign In</button>
        <button className={`btn ${mode==='create'?'btn-p':'btn-s'}`} style={{flex:1,justifyContent:'center',borderRadius:'0 var(--r) var(--r) 0'}} onClick={()=>{setMode('create');setErr('');}}>Create Account</button>
      </div>
      <div className="field"><label>Username</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Username" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      <div className="field"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" onKeyDown={e=>e.key==='Enter'&&(mode==='signin'?go():null)}/></div>
      {mode==='create'&&<div className="field"><label>Confirm Password</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="Confirm password" onKeyDown={e=>e.key==='Enter'&&go()}/></div>}
      {err&&<div className="error-msg">{err}</div>}
      <button className="btn btn-p" style={{width:'100%',justifyContent:'center',marginTop:20}} onClick={go} disabled={loading}>{loading?(mode==='signin'?'Signing in…':'Creating…'):(mode==='signin'?'Sign In →':'Create Account →')}</button>
    </div></div>
  );
}

/* ══════════════════ SETUP SCREEN (one-time fallback) ══════════════════ */
function SetupScreen(){
  const [url,setUrl]=useState('');const [key,setKey]=useState('');const [err,setErr]=useState('');const [loading,setLoading]=useState(false);
  async function go(){
    if(!url.trim()||!key.trim()){setErr('URL and key required.');return;}
    setLoading(true);setErr('');
    try{const d=new DB(url.trim(),key.trim());await d.get('firms','limit=1');localStorage.setItem('hfcrm_config',JSON.stringify({url:url.trim(),key:key.trim()}));window.location.reload();}
    catch(e){setErr('Could not connect: '+e.message);}
    setLoading(false);
  }
  return(
    <div className="auth-wrap"><div className="auth-card">
      <h1>Job Search Tracker</h1><p className="sub">One-time setup: connect your Supabase project.</p>
      <div className="note-box">After setup, you can hard-code SUPABASE_URL and SUPABASE_KEY in the source to skip this on all devices.</div>
      <details style={{marginBottom:24}}><summary style={{cursor:'pointer',fontSize:13,color:'var(--accent)',fontWeight:600,marginBottom:8}}>First time? Create tables in Supabase SQL Editor</summary>
        <div className="setup-code">{`CREATE TABLE users (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  username TEXT NOT NULL UNIQUE,
  password TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
-- Create your first user via the Sign Up screen

CREATE TABLE firms (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name TEXT NOT NULL, type TEXT, next_steps TEXT, notes TEXT,
  priority BOOLEAN DEFAULT false, order_position INTEGER DEFAULT 0,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE TABLE contacts (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID NOT NULL REFERENCES firms(id) ON DELETE CASCADE,
  name TEXT NOT NULL, role TEXT, email TEXT, linkedin TEXT, phone TEXT,
  status TEXT DEFAULT 'not_contacted', notes TEXT, advice TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE TABLE opportunities (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID NOT NULL REFERENCES firms(id) ON DELETE CASCADE,
  role TEXT NOT NULL, location TEXT, link TEXT, referral TEXT,
  stage TEXT DEFAULT 'not_applied', stage_order INTEGER DEFAULT 0,
  notes TEXT, created_at TIMESTAMPTZ DEFAULT NOW()
);

-- If upgrading from previous version:
ALTER TABLE opportunities ADD COLUMN IF NOT EXISTS stage_order INTEGER DEFAULT 0;`}</div>
      </details>
      <div className="field"><label>Project URL</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
      <div className="field"><label>Anon / Legacy Key</label><input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGci..." onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      {err&&<div className="error-msg">{err}</div>}
      <button className="btn btn-p" style={{width:'100%',justifyContent:'center',marginTop:20}} onClick={go} disabled={loading}>{loading?'Connecting…':'Connect →'}</button>
    </div></div>
  );
}

/* ══════════════════ APP ══════════════════ */
function App(){
  const cfg=getDbConfig();
  if(!cfg)return <SetupScreen/>;
  const auth=getAuth();
  if(!auth||!auth.userId)return <SignInScreen/>;
  return <Dashboard db={new DB(cfg.url,cfg.key,auth.userId)}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
