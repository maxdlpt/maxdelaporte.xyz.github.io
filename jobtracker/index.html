    .auth-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {

    .auth-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .auth-card p { color: var(--muted); margin-bottom: 28px; font-size: 13px; }

    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .field input, .field select, .field textarea {

      border-radius: var(--radius-sm); color: var(--text); padding: 9px 12px;
      font-size: 14px; outline: none; transition: border-color .15s; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: var(--surface2); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm); border: none;
      cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; font-family: inherit;

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-icon { padding: 5px; background: transparent; border: none; cursor: pointer; color: var(--muted); border-radius: var(--radius-sm); transition: all .15s; }

      display: flex; align-items: center; justify-content: center;

    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 0; }

    .modal-body { padding: 20px 24px; }

  </style>
</head>

// ─── DB (plain fetch → Supabase REST) ────────────────────────────────────────

class DB {
  constructor(url, key) {
    this.base = `${url}/rest/v1`;
    this.h = { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' };
  }
  async get(table, qs = '') {
    const r = await fetch(`${this.base}/${table}${qs ? '?' + qs : ''}`, { headers: this.h });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async insert(table, data) {
    const r = await fetch(`${this.base}/${table}`, {
      method: 'POST', headers: { ...this.h, Prefer: 'return=representation' }, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    const rows = await r.json();
    return Array.isArray(rows) ? rows[0] : rows;
  }
  async update(table, id, data) {
    const r = await fetch(`${this.base}/${table}?id=eq.${id}`, {
      method: 'PATCH', headers: { ...this.h, Prefer: 'return=representation' }, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    const rows = await r.json();
    return Array.isArray(rows) ? rows[0] : rows;
  }
  async del(table, id) {
    const r = await fetch(`${this.base}/${table}?id=eq.${id}`, {
      method: 'DELETE', headers: { ...this.h, Prefer: 'return=minimal' }
    });
    if (!r.ok) throw new Error(await r.text());
  }
}

        {contact.linkedin && <a className="contact-link" href={contact.linkedin} target="_blank" rel="noreferrer">in</a>}
        {contact.phone    && <a className="contact-link" href={`tel:${contact.phone}`} title={contact.phone}>☎</a>}
      </div>
      {contact.advice && <span title={contact.advice} style={{fontSize:11,color:'var(--muted)',cursor:'help',flexShrink:0}}>💬</span>}
      <div className="contact-row-actions">
        <button className="btn-icon" onClick={() => onEdit(contact)}>✎</button>
        <button className="btn-icon" style={{color:'var(--red)'}} onClick={() => onDelete(contact.id)}>✕</button>
      </div>
    </div>
  );
}

// ─── Opportunity Row ──────────────────────────────────────────────────────────

function OppRow({ opp, onEdit, onDelete }) {
  return (
    <div className="opp-row">
      <div className="opp-role">
        {opp.link
          ? <a href={opp.link} target="_blank" rel="noreferrer" style={{color:'var(--text)',textDecoration:'none'}} onMouseOver={e=>e.target.style.textDecoration='underline'} onMouseOut={e=>e.target.style.textDecoration='none'}>{opp.role}</a>
          : opp.role}
      </div>
      <div className="opp-location">{opp.location}</div>
      {opp.referral && <span className="tag" style={{fontSize:11}}>{opp.referral==='Yes' ? '✓ Referral' : opp.referral==='Pending' ? '⏳ Referral' : ''}</span>}
      <Badge value={opp.stage} arr={APP_STAGES} />
      <div className="opp-row-actions">
        <button className="btn-icon" onClick={() => onEdit(opp)}>✎</button>
        <button className="btn-icon" style={{color:'var(--red)'}} onClick={() => onDelete(opp.id)}>✕</button>
      </div>
    </div>
  );
}

// ─── Firm Card ────────────────────────────────────────────────────────────────

function FirmCard({ firm, contacts, opportunities, onUpdate, onDelete, db }) {
  const [open, setOpen]               = useState(false);
  const [addContact, setAddContact]   = useState(false);
  const [addOpp, setAddOpp]           = useState(false);
  const [editContact, setEditContact] = useState(null);
  const [editOpp, setEditOpp]         = useState(null);
  const [editFirm, setEditFirm]       = useState(false);
  const [saving, setSaving]           = useState(false);

  const emptyContact = { name:'', role:'', email:'', linkedin:'', phone:'', status:'not_contacted', notes:'', advice:'' };
  const emptyOpp     = { role:'', location:'', link:'', referral:'', stage:'not_applied', notes:'' };
  const [contactForm, setContactForm] = useState(emptyContact);
  const [oppForm, setOppForm]         = useState(emptyOpp);
  const [firmForm, setFirmForm]       = useState({ name:firm.name, type:firm.type||'', next_steps:firm.next_steps||'', notes:firm.notes||'', priority:firm.priority||false });

  const coldContacts = contacts.filter(c => c.status === 'cold');

  async function saveContact() {
    if (!contactForm.name.trim()) return;
    setSaving(true);
    try {
      if (editContact) {
        const data = await db.update('contacts', editContact.id, contactForm);
        onUpdate('contact_update', data); setEditContact(null);
      } else {
        const data = await db.insert('contacts', { ...contactForm, firm_id: firm.id });
        onUpdate('contact_add', data); setAddContact(false);
      }
      setContactForm(emptyContact);
    } catch(e) { alert('Error: ' + e.message); }
    setSaving(false);
  }

  async function saveOpp() {
    if (!oppForm.role.trim()) return;
    setSaving(true);
    try {
      if (editOpp) {
        const data = await db.update('opportunities', editOpp.id, oppForm);
        onUpdate('opp_update', data); setEditOpp(null);
      } else {
        const data = await db.insert('opportunities', { ...oppForm, firm_id: firm.id });
        onUpdate('opp_add', data); setAddOpp(false);
      }
      setOppForm(emptyOpp);
    } catch(e) { alert('Error: ' + e.message); }
    setSaving(false);
  }

  async function saveFirmEdit() {
    if (!firmForm.name.trim()) return;
    setSaving(true);
    try {
      const data = await db.update('firms', firm.id, firmForm);
      onUpdate('firm_update', data); setEditFirm(false);
    } catch(e) { alert('Error: ' + e.message); }
    setSaving(false);
  }

  async function deleteContact(id) {
    if (!confirm('Delete this contact?')) return;
    await db.del('contacts', id);
    onUpdate('contact_delete', { id });
  }

  async function deleteOpp(id) {
    if (!confirm('Delete this opportunity?')) return;
    await db.del('opportunities', id);
    onUpdate('opp_delete', { id });
  }

  function startEditContact(c) {
    setContactForm({ name:c.name, role:c.role||'', email:c.email||'', linkedin:c.linkedin||'', phone:c.phone||'', status:c.status, notes:c.notes||'', advice:c.advice||'' });
    setEditContact(c);
  }
  function startEditOpp(o) {
    setOppForm({ role:o.role, location:o.location||'', link:o.link||'', referral:o.referral||'', stage:o.stage, notes:o.notes||'' });
    setEditOpp(o);
  }

  return (
    <div className="firm-card">
      <div className="firm-header" onClick={() => setOpen(p => !p)}>
        <span className={`firm-chevron ${open ? 'open' : ''}`}>▶</span>
        <span className="firm-name">{firm.name}</span>
        <div className="firm-meta">
          {firm.type && <span className="tag">{firm.type}</span>}
          {firm.priority && <span className="tag priority">★ Priority</span>}
          {coldContacts.length > 0 && <span className="tag" style={{background:'rgba(245,158,11,.1)',color:'var(--amber)',borderColor:'rgba(245,158,11,.3)'}}>🌡 {coldContacts.length} cold</span>}
          <span className="tag">{contacts.length} contact{contacts.length!==1?'s':''}</span>
          {opportunities.length > 0 && <span className="tag">{opportunities.length} opp{opportunities.length>1?'s':''}</span>}
        </div>
        <div className="firm-header-actions" onClick={e => e.stopPropagation()}>
          <button className="btn-icon" onClick={() => { setFirmForm({ name:firm.name, type:firm.type||'', next_steps:firm.next_steps||'', notes:firm.notes||'', priority:firm.priority||false }); setEditFirm(true); }}>✎</button>
          <button className="btn-icon" style={{color:'var(--red)'}} onClick={() => onDelete(firm.id)}>✕</button>
        </div>
      </div>

      {firm.next_steps && (
        <div className="firm-next-steps"><span>Next steps</span>{firm.next_steps}</div>
      )}

      {open && (
        <div className="firm-body">
          <div className="section-header">
            <span>Contacts</span>
            <button className="btn btn-ghost btn-sm" onClick={() => { setContactForm(emptyContact); setAddContact(true); }}>+ Add</button>
          </div>
          {contacts.length === 0
            ? <div className="empty">No contacts yet.</div>
            : contacts.map(c => <ContactRow key={c.id} contact={c} onEdit={startEditContact} onDelete={deleteContact} />)
          }

          <div className="section-header" style={{marginTop:2}}>
            <span>Opportunities</span>
            <button className="btn btn-ghost btn-sm" onClick={() => { setOppForm(emptyOpp); setAddOpp(true); }}>+ Add</button>
          </div>
          {opportunities.length === 0
            ? <div className="empty">No opportunities tracked.</div>
            : opportunities.map(o => <OppRow key={o.id} opp={o} onEdit={startEditOpp} onDelete={deleteOpp} />)
          }

          {firm.notes && (
            <div style={{padding:'10px 18px',fontSize:12,color:'var(--muted)',borderTop:'1px solid var(--border)'}}>
              <span style={{color:'var(--muted)',textTransform:'uppercase',fontSize:11,letterSpacing:'.05em',marginRight:6}}>Notes</span>{firm.notes}
            </div>
          )}
        </div>
      )}

      {(addContact || editContact) && (
        <Modal title={editContact ? 'Edit Contact' : 'Add Contact'} onClose={() => { setAddContact(false); setEditContact(null); }} onSave={saveContact} saving={saving}>
          <ContactForm data={contactForm} onChange={(k,v) => setContactForm(p => ({...p,[k]:v}))} />
        </Modal>
      )}
      {(addOpp || editOpp) && (
        <Modal title={editOpp ? 'Edit Opportunity' : 'Add Opportunity'} onClose={() => { setAddOpp(false); setEditOpp(null); }} onSave={saveOpp} saving={saving}>
          <OppForm data={oppForm} onChange={(k,v) => setOppForm(p => ({...p,[k]:v}))} />
        </Modal>
      )}
      {editFirm && (
        <Modal title="Edit Firm" onClose={() => setEditFirm(false)} onSave={saveFirmEdit} saving={saving}>
          <FirmForm data={firmForm} onChange={(k,v) => setFirmForm(p => ({...p,[k]:v}))} />
        </Modal>
      )}
    </div>
  );
}

// ─── Setup Screen ─────────────────────────────────────────────────────────────

const SQL_SCHEMA = `CREATE TABLE firms (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name TEXT NOT NULL,
  type TEXT, next_steps TEXT, notes TEXT,
  priority BOOLEAN DEFAULT false,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE contacts (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID REFERENCES firms(id) ON DELETE CASCADE,
  name TEXT NOT NULL,
  role TEXT, email TEXT, linkedin TEXT, phone TEXT,
  status TEXT DEFAULT 'not_contacted',
  notes TEXT, advice TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE opportunities (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  firm_id UUID REFERENCES firms(id) ON DELETE CASCADE,
  role TEXT NOT NULL,
  location TEXT, link TEXT, referral TEXT,
  stage TEXT DEFAULT 'not_applied',
  notes TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);`;

function SetupScreen({ onSetup }) {
  const [url, setUrl]         = useState('');
  const [key, setKey]         = useState('');
  const [err, setErr]         = useState('');
  const [loading, setLoading] = useState(false);

  async function handleConnect() {
    if (!url.trim() || !key.trim()) { setErr('Both fields are required.'); return; }
    setLoading(true); setErr('');
    try {
      const r = await fetch(`${url.trim()}/rest/v1/firms?select=id&limit=1`, {
        headers: { apikey: key.trim(), Authorization: `Bearer ${key.trim()}` }
      });
      if (!r.ok) { setErr('Could not connect: ' + await r.text()); setLoading(false); return; }
      const cfg = { url: url.trim(), key: key.trim() };
      localStorage.setItem('hfcrm_config', JSON.stringify(cfg));
      onSetup(cfg);
    } catch(e) { setErr('Connection failed: ' + e.message); setLoading(false); }
  }

  return (
    <div className="auth-wrap">
      <div className="auth-card" style={{maxWidth:560}}>
        <h1>One-time Setup</h1>
        <p>Connect your Supabase project. Run the SQL below first, then enter your credentials.</p>
        <div className="section-label">Step 1 — Run this in Supabase → SQL Editor</div>
        <div className="setup-code">{SQL_SCHEMA}</div>
        <div className="section-label">Step 2 — Enter your project credentials</div>
        <p style={{fontSize:12,color:'var(--muted)',marginBottom:14}}>Supabase → your project → Settings → API Keys → Legacy anon key (starts with eyJ...)</p>
        <div className="field"><label>Project URL</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co" /></div>
        <div className="field"><label>Anon / Legacy key</label><input value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGci..." /></div>
        {err && <div className="error-msg">{err}</div>}
        <button className="btn btn-primary" onClick={handleConnect} disabled={loading} style={{width:'100%',marginTop:8,justifyContent:'center'}}>
          {loading ? 'Connecting…' : 'Connect & Continue →'}
        </button>
      </div>
    </div>
  );
}

// ─── Login Screen ─────────────────────────────────────────────────────────────

function LoginScreen({ onLogin }) {
  const [pw, setPw]   = useState('');
  const [err, setErr] = useState('');

  function handleLogin() {
    if (pw === CORRECT_PASSWORD) { sessionStorage.setItem('hfcrm_auth', '1'); onLogin(); }
    else { setErr('Incorrect password.'); setPw(''); }
  }

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <h1>HF Job Tracker</h1>
        <p>Enter your password to continue.</p>
        <div className="field"><label>Password</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} autoFocus />
        </div>
        {err && <div className="error-msg">{err}</div>}
        <button className="btn btn-primary" onClick={handleLogin} style={{width:'100%',justifyContent:'center'}}>Unlock →</button>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────

function Dashboard({ db }) {
  const [firms,    setFirms]   = useState([]);
  const [contacts, setContacts]= useState([]);
  const [opps,     setOpps]    = useState([]);
  const [loading,  setLoading] = useState(true);
  const [search,   setSearch]  = useState('');
  const [addFirm,  setAddFirm] = useState(false);
  const [saving,   setSaving]  = useState(false);
  const [firmForm, setFirmForm]= useState({ name:'', type:'', next_steps:'', notes:'', priority:false });

  useEffect(() => {
    async function load() {
      try {
        const [f, c, o] = await Promise.all([
          db.get('firms',        'select=*&order=priority.desc,name.asc'),
          db.get('contacts',     'select=*&order=name.asc'),
          db.get('opportunities','select=*&order=created_at.asc'),
        ]);
        setFirms(f); setContacts(c); setOpps(o);
        if (f.length === 0) {
          await seedData(db);
          const [f2, c2, o2] = await Promise.all([
            db.get('firms',        'select=*&order=priority.desc,name.asc'),
            db.get('contacts',     'select=*&order=name.asc'),
            db.get('opportunities','select=*&order=created_at.asc'),
          ]);
          setFirms(f2); setContacts(c2); setOpps(o2);
        }
      } catch(e) { alert('Load error: ' + e.message); }
      setLoading(false);
    }
    load();
  }, []);

  async function seedData(db) {
    for (const sd of SEED_FIRMS) {
      const fRow = await db.insert('firms', { name:sd.name, type:sd.type, next_steps:sd.next_steps, notes:'', priority:sd.priority });
      if (!fRow?.id) continue;
      for (const sc of SEED_CONTACTS.filter(c => c.firm === sd.name))
        await db.insert('contacts', { firm_id:fRow.id, name:sc.name, role:sc.role, email:sc.email, linkedin:sc.linkedin, phone:sc.phone, status:sc.status, notes:sc.notes, advice:sc.advice });
      for (const so of SEED_OPPS.filter(o => o.firm === sd.name))
        await db.insert('opportunities', { firm_id:fRow.id, role:so.role, location:so.location, link:so.link, referral:so.referral, stage:so.stage, notes:'' });
    }
  }

  async function saveFirm() {
    if (!firmForm.name.trim()) return;
    setSaving(true);
    try {
      const data = await db.insert('firms', firmForm);
      setFirms(p => [...p, data].sort((a,b) => b.priority - a.priority || a.name.localeCompare(b.name)));
      setAddFirm(false); setFirmForm({ name:'', type:'', next_steps:'', notes:'', priority:false });
    } catch(e) { alert('Error: ' + e.message); }
    setSaving(false);
  }

  async function deleteFirm(id) {
    if (!confirm('Delete this firm and all its contacts/opportunities?')) return;
    await db.del('firms', id);
    setFirms(p => p.filter(f => f.id !== id));
    setContacts(p => p.filter(c => c.firm_id !== id));
    setOpps(p => p.filter(o => o.firm_id !== id));
  }

  function handleUpdate(type, payload) {
    if (type === 'firm_update')    setFirms(p => p.map(f => f.id===payload.id ? payload : f).sort((a,b) => b.priority-a.priority || a.name.localeCompare(b.name)));
    if (type === 'contact_add')    setContacts(p => [...p, payload]);
    if (type === 'contact_update') setContacts(p => p.map(c => c.id===payload.id ? payload : c));
    if (type === 'contact_delete') setContacts(p => p.filter(c => c.id!==payload.id));
    if (type === 'opp_add')        setOpps(p => [...p, payload]);
    if (type === 'opp_update')     setOpps(p => p.map(o => o.id===payload.id ? payload : o));
    if (type === 'opp_delete')     setOpps(p => p.filter(o => o.id!==payload.id));
  }

  const filtered = useMemo(() => {
    if (!search.trim()) return firms;
    const q = search.toLowerCase();
    return firms.filter(f => f.name.toLowerCase().includes(q) || f.type?.toLowerCase().includes(q));
  }, [firms, search]);

  const actionItems = useMemo(() => {
    const items = [];
    firms.forEach(f => {
      const cold = contacts.filter(c => c.firm_id===f.id && c.status==='cold');
      if (cold.length) items.push({ text:`${f.name}: ${cold.length} cold contact${cold.length>1?'s':''}`, urgent:false });
      if (opps.some(o => o.firm_id===f.id && o.stage==='offer')) items.push({ text:`🎉 Offer at ${f.name}!`, urgent:true });
      if (f.priority && f.next_steps) items.push({ text:`${f.name}: ${f.next_steps}`, urgent:false });
    });
    return items;
  }, [firms, contacts, opps]);

  const stats = useMemo(() => ({
    firms: firms.length,
    contacts: contacts.length,
    applied: opps.filter(o => o.stage !== 'not_applied').length,
    active:  opps.filter(o => !['not_applied','rejected','offer'].includes(o.stage)).length,
  }), [firms, contacts, opps]);

  if (loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--muted)'}}>Loading…</div>;

  return (
    <div className="app-shell">
      <div className="header">
        <h1>HF Job Tracker</h1>
        <div className="header-actions">
          <input className="search-input" placeholder="Search firms…" value={search} onChange={e=>setSearch(e.target.value)} />
          <button className="btn btn-primary" onClick={() => setAddFirm(true)}>+ Firm</button>
          <button className="btn btn-ghost btn-sm" title="Log out" onClick={() => { sessionStorage.removeItem('hfcrm_auth'); window.location.reload(); }}>⏻</button>
        </div>
      </div>

      <div className="stats-bar">
        <div className="stat"><div className="stat-value">{stats.firms}</div><div className="stat-label">Firms</div></div>
        <div className="stat"><div className="stat-value">{stats.contacts}</div><div className="stat-label">Contacts</div></div>
        <div className="stat"><div className="stat-value">{stats.applied}</div><div className="stat-label">Applied</div></div>
        <div className="stat"><div className="stat-value">{stats.active}</div><div className="stat-label">Active pipelines</div></div>
      </div>

      {actionItems.length > 0 && (
        <div className="action-section">
          <h2>Needs attention</h2>
          <div className="action-chips">
            {actionItems.map((item, i) => <div key={i} className={`action-chip ${item.urgent?'urgent':''}`}>{item.text}</div>)}
          </div>
        </div>
      )}

      {filtered.length === 0
        ? <div style={{color:'var(--muted)',textAlign:'center',padding:'60px 0'}}>{search ? 'No firms match your search.' : 'No firms yet. Add one to get started.'}</div>
        : filtered.map(firm => (
          <FirmCard
            key={firm.id}
            firm={firm}
            contacts={contacts.filter(c => c.firm_id===firm.id)}
            opportunities={opps.filter(o => o.firm_id===firm.id)}
            onUpdate={(type, payload) => handleUpdate(type, payload)}
            onDelete={deleteFirm}
            db={db}
          />
        ))
      }

      {addFirm && (
        <Modal title="Add Firm" onClose={() => setAddFirm(false)} onSave={saveFirm} saving={saving}>
          <FirmForm data={firmForm} onChange={(k,v) => setFirmForm(p => ({...p,[k]:v}))} />
        </Modal>
      )}
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState(() => {
    if (!getConfig()) return 'setup';
    if (!sessionStorage.getItem('hfcrm_auth')) return 'login';
    return 'dashboard';
  });
  const [db, setDb] = useState(() => {
    const cfg = getConfig();
    return cfg ? new DB(cfg.url, cfg.key) : null;
  });

  function handleSetup(cfg) {
    setDb(new DB(cfg.url, cfg.key));
    setScreen('login');
  }

  if (screen === 'setup')     return <SetupScreen onSetup={handleSetup} />;
  if (screen === 'login')     return <LoginScreen onLogin={() => setScreen('dashboard')} />;
  if (screen === 'dashboard') return <Dashboard db={db} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
