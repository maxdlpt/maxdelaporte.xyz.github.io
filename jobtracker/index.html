<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Job Search Tracker</title>
  <link rel="icon" href="/logo3.svg" type="image/svg+xml">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JobTracker">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#1a1d27">
  <!-- Splash screens -->
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-750x1334.png">
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1d27;
      --bg2: #252830;
      --card: #2d3436;
      --text: #ffffff;
      --muted: #b0b3ba;
      --accent: #81D31A;
      --accent-h: #9ae830;
      --success: #1dd1a1;
      --danger: #ff6348;
      --warning: #feca57;
      --bdr: rgba(176,179,186,0.12);
      --bdr2: rgba(176,179,186,0.2);
      --sh-sm: 0 2px 8px rgba(0,0,0,0.15);
      --sh-md: 0 4px 12px rgba(0,0,0,0.25);
      --sh-lg: 0 8px 20px rgba(0,0,0,0.35);
      --r: 8px;
      --r-pill: 20px;
      --col-neutral: #6b7280;
      --col-amber: #f59e0b;
      --col-red: #ef4444;
      --col-green: #10b981;
      --col-lgreen: #6ee7b7;
      --accent-bg: rgba(129,211,26,.12);
      --accent-bg2: rgba(129,211,26,.06);
      --danger-bg: rgba(255,99,72,.15);
      --danger-bg2: rgba(255,99,72,.08);
      --sp-sm: 8px;
      --sp-md: 16px;
      --sp-lg: 24px;
      --sp-xl: 40px;
      --content-max: 700px;
      --card-min: 300px;
      --ease-decel: cubic-bezier(0, 0, 0.2, 1);
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; -webkit-touch-callout:none; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
    html, body { overscroll-behavior:none; }
    .field textarea, .field input { -webkit-touch-callout:default; }
    .sidebar, .bottom-nav, .btn, .mm-card, .pl-card, .firm-col { -webkit-user-select:none; user-select:none; }
    .truncate { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .flex-center { display:flex; align-items:center; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button:focus-visible, .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; box-shadow:0 0 0 4px rgba(129,211,26,.2); }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes popIn { from { opacity:0; transform:scale(.95); } to { opacity:1; transform:scale(1); } }
    @keyframes toastIn { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateX(100%); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }

    /* ── Auth ── */
    .auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .auth-card { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:40px; width:100%; max-width:480px; animation:fadeIn .5s ease-out; }
    .auth-card h1 { font-size:24px; font-weight:700; margin-bottom:4px; letter-spacing:-.02em; }
    .auth-card .sub { color:var(--muted); margin-bottom:28px; font-size:13px; }

    /* ── Fields ── */
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
    .field input, .field select, .field textarea { width:100%; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); }
    .field textarea { resize:vertical; min-height:72px; }
    .field select { cursor:pointer; }
    .field select option { background:var(--card); }

    /* ── Combobox ── */
    .combo-wrap { position:relative; }
    .combo-input { width:100%; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
    .combo-input:focus { border-color:var(--accent); }
    .combo-list { position:absolute; top:calc(100% + 2px); left:0; right:0; background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); max-height:180px; overflow-y:auto; z-index:50; box-shadow:var(--sh-md); }
    .combo-opt { padding:9px 12px; cursor:pointer; font-size:13px; transition:background .1s; border-bottom:1px solid var(--bdr); }
    .combo-opt:last-child { border-bottom:none; }
    .combo-opt:hover { background:var(--bg2); }
    .combo-opt.create { color:var(--accent); font-weight:600; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:var(--r); border:none; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; font-family:inherit; }
    .btn-p { background:var(--accent); color:#111; }
    .btn-s { background:transparent; color:var(--muted); border:1px solid var(--bdr2); }
    .btn-d { background:var(--danger-bg); color:var(--danger); border:1px solid rgba(255,99,72,.3); }
    .btn-sm { padding:6px 12px; font-size:12px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn-icon { padding:6px; background:transparent; border:none; cursor:pointer; color:var(--muted); border-radius:var(--r); transition:all .15s; font-size:16px; line-height:1; }

    /* ── Layout: Sidebar ── */
    .app { display:flex; height:100vh; }
    .sidebar { width:60px; background:var(--card); border-right:1px solid var(--bdr); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .35s ease; z-index:10; }
    .sidebar-top { padding:14px 0 10px; display:flex; align-items:center; justify-content:center; }
    .sidebar-top svg { width:28px; height:28px; fill:var(--accent); flex-shrink:0; }
    .sidebar-nav { flex:1; display:flex; flex-direction:column; padding:8px 0; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:12px 0; cursor:pointer; color:var(--muted); transition:all .15s; white-space:nowrap; box-shadow:inset 3px 0 0 transparent; }
    .sidebar-icon-slot { width:59px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .sidebar-item.active { color:var(--accent); background:rgba(129,211,26,.08); box-shadow:inset 3px 0 0 var(--accent); }
    .sidebar-item svg { width:22px; height:22px; flex-shrink:0; }
    .sidebar-item[data-k="matchmaker"] svg { width:28px; height:28px; }
    .sidebar-item svg path, .sidebar-item svg rect, .sidebar-item svg circle { transition:fill .15s, stroke .15s; }
    .sidebar-item.active svg path { fill:var(--accent); }
    .sidebar-item.active svg path[stroke] { stroke:var(--accent); fill:none; }
    .sidebar-item.active svg circle[stroke] { stroke:var(--accent); fill:none; }
    .sidebar-item:not(.active) svg path { fill:var(--muted); }
    .sidebar-item:not(.active) svg path[stroke] { stroke:var(--muted); fill:none; }
    .sidebar-item:not(.active) svg circle { fill:var(--muted); }
    .sidebar-item:not(.active) svg circle[stroke] { stroke:var(--muted); fill:none; }
    .sidebar-item:not(.active) svg rect { fill:none; }
    .sidebar-label { font-size:13px; font-weight:600; opacity:0; transition:opacity .2s; white-space:nowrap; }
    .sidebar-bottom { border-top:1px solid var(--bdr); padding:8px 0; }

    .main-area { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--bdr); flex-shrink:0; }
    .topbar h1 { font-size:18px; font-weight:700; letter-spacing:-.02em; }
    .topbar-r { display:flex; align-items:center; gap:10px; }
    .tab-content { flex:1; overflow:auto; }

    /* ── Overview ── */
    .overview { display:flex; gap:16px; padding:20px; overflow-y:auto; align-items:flex-start; }
    .overview::-webkit-scrollbar { width:6px; }
    .overview::-webkit-scrollbar-track { background:var(--bg); }
    .overview::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:4px; }
    .overview-col { flex:1; display:flex; flex-direction:column; gap:16px; min-width:0; }

    .firm-col { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); cursor:grab; transition:transform .35s, opacity .35s, border-color .28s, box-shadow .28s; animation:fadeIn .5s ease-out; }
    .firm-col.dragging { opacity:.4; cursor:grabbing; transform:scale(.97); }
    .firm-col.drag-over { border-color:var(--accent); box-shadow:0 0 16px rgba(129,211,26,.2); }

    .fc-head { padding:14px 16px 10px; }
    .fc-name { font-size:15px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:8px; }
    .fc-meta { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
    .fc-next { padding:0 16px 10px; font-size:12px; color:var(--warning); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fc-actions { display:flex; gap:4px; margin-left:auto; opacity:0; transition:opacity .15s; }

    .fc-section { border-top:1px solid var(--bdr); }
    .fc-section.fc-tasks { border-top:1px solid var(--bdr); border-left:3px solid var(--accent); background:rgba(129,211,26,.04); }
    .fc-task-badge { display:inline-flex; align-items:center; justify-content:center; background:var(--accent); color:#000; font-size:10px; font-weight:800; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-pill); line-height:1; }
    .fc-section-head { padding:8px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; display:flex; align-items:center; justify-content:space-between; }
    .fc-item { padding:6px 16px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:background .1s; display:flex; align-items:center; gap:6px; }
    .fc-empty { padding:10px 16px; font-size:12px; color:var(--muted); font-style:italic; }

    .add-firm-col { min-width:var(--card-min); max-width:var(--card-min); background:transparent; border:2px dashed var(--bdr2); border-radius:var(--r); display:flex; align-items:center; justify-content:center; min-height:200px; cursor:pointer; transition:all .15s; flex-shrink:0; color:var(--muted); font-size:14px; font-weight:600; }

    /* ── Pipeline ── */
    .pipeline { display:flex; gap:10px; padding:16px; min-height:0; align-items:stretch; }
    .pipeline::-webkit-scrollbar { height:8px; }
    .pipeline::-webkit-scrollbar-track { background:var(--bg); }
    .pipeline::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:4px; }

    .pl-col { flex:1; min-width:0; background:var(--bg2); border:1px solid var(--bdr); border-radius:var(--r); display:flex; flex-direction:column; transition:border-color .28s, box-shadow .28s; }
    .pl-col.drag-over { border-color:var(--accent); box-shadow:0 0 12px rgba(129,211,26,.15); }
    .pl-col-head { padding:10px 12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--col-neutral); }
    .pl-col-head.c-neutral { border-bottom-color:var(--col-neutral); }
    .pl-col-head.c-amber { border-bottom-color:var(--col-amber); }
    .pl-col-head.c-red { border-bottom-color:var(--col-red); }
    .pl-col-head.c-green { border-bottom-color:var(--col-green); }
    .pl-col-head.c-lgreen { border-bottom-color:var(--col-lgreen); }
    .pl-count { background:var(--card); padding:2px 8px; border-radius:var(--r-pill); font-size:11px; }
    .pl-drop { min-height:120px; padding:8px; flex:1; display:flex; flex-direction:column; gap:6px; transition:padding-bottom .3s ease; }
    .pl-col.drag-over .pl-drop { padding-bottom:80px; }
    .pl-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); padding:10px 12px; cursor:grab; transition:transform .28s, opacity .28s, border-color .15s, box-shadow .15s; animation:slideIn .35s ease-out; }
    .pl-card.dragging { opacity:.4; cursor:grabbing; transform:scale(.95); }
    .pl-card-firm { font-size:12px; font-weight:700; color:var(--accent); margin-bottom:2px; }
    .pl-card-role { font-size:13px; font-weight:500; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pl-card-ref { font-size:11px; color:var(--muted); }
    .pl-card-actions { display:flex; gap:4px; margin-top:6px; opacity:0; transition:opacity .15s; }
    .pl-card:hover .pl-card-actions { opacity:1; }
    .pl-empty { text-align:center; padding:20px 10px; font-size:12px; color:var(--muted); font-style:italic; }

    /* ── Interview Rounds group ── */
    .itv-group { flex:5; flex-shrink:0; border:1px dashed var(--col-neutral); border-radius:var(--r); padding:10px; background:rgba(107,114,128,.04); display:flex; flex-direction:column; }
    .itv-group-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; text-align:center; }
    .itv-grid { display:flex; gap:8px; flex:1; }
    .itv-grid .pl-col { flex:1; min-width:0; }

    /* ── Recycling bin ── */
    .recycle-zone { display:flex; align-items:center; justify-content:center; flex:1; min-height:80px; }

    /* ── Contacts ── */
    .contacts-page { padding:20px; max-width:900px; margin:0 auto; width:100%; }
    .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
    .filter-bar select, .filter-bar input { background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:8px 12px; font-size:13px; outline:none; font-family:inherit; }
    .filter-bar input { flex:1; min-width:180px; }
    .filter-bar select { cursor:pointer; }
    .filter-bar select option { background:var(--card); }

    .section-group { margin-bottom:16px; background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); overflow:hidden; animation:fadeIn .3s ease-out; }
    .section-head { padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background .1s; user-select:none; -webkit-user-select:none; }
    .section-head:hover { background:rgba(255,255,255,.03); }
    .section-head .chevron { color:var(--muted); font-size:12px; transition:transform .28s; }
    .section-head .chevron.open { transform:rotate(90deg); }
    .section-count { font-size:12px; color:var(--muted); margin-left:8px; }

    .c-row { padding:10px 16px; border-top:1px solid var(--bdr); display:flex; align-items:center; gap:10px; transition:all .15s; cursor:pointer; }
    .c-row:hover { background:rgba(255,255,255,.03); }
    .c-row.expanded { background:var(--bg2); border-left:3px solid var(--accent); }
    .c-row-name { font-weight:600; min-width:130px; font-size:13px; }
    .c-row-role { color:var(--muted); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-row-links { display:flex; gap:4px; }
    .c-row-link { font-size:11px; color:var(--muted); text-decoration:none; padding:3px 6px; border:1px solid var(--bdr); border-radius:4px; transition:all .15s; }
    .c-row-link:hover { color:var(--accent); border-color:var(--accent); }
    .c-row-copy { background:transparent; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; padding:3px 6px; }
    .c-row-copy svg { width:13px; height:13px; fill:currentColor; display:block; }
    .c-row-actions { display:flex; gap:4px; opacity:0; transition:opacity .15s; }
    .c-row:hover .c-row-actions { opacity:1; }
    .contact-row { --contact-action-size:28px; display:grid; grid-template-columns:minmax(132px,1.15fr) 128px minmax(0,1fr) minmax(0,1fr) 100px 64px; column-gap:10px; }
    .contact-col-name { min-width:0; text-align:left; }
    .contact-col-status, .contact-col-role, .contact-col-firm { min-width:0; width:100%; text-align:center; justify-self:center; }
    .contact-col-status { display:flex; justify-content:center; }
    .contact-col-role, .contact-col-firm { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .contact-col-links { width:100px; display:flex; justify-content:center; gap:4px; }
    .contact-col-links .c-row-link, .contact-col-actions .btn-icon { width:var(--contact-action-size); height:var(--contact-action-size); padding:0; display:inline-flex; align-items:center; justify-content:center; }
    .contact-col-links .c-row-link { border:none; background:transparent; border-radius:0; }
    .contact-col-links .c-row-link:hover { border:none; background:transparent; }
    .contact-col-links .c-row-copy svg { width:16px; height:16px; fill:currentColor; display:block; }
    .contact-linkedin svg { width:18px; height:18px; fill:currentColor; display:block; }
    .contact-linkedin { font-size:0; line-height:1; }
    .contact-btn-placeholder { width:var(--contact-action-size); height:var(--contact-action-size); border:1px solid transparent; border-radius:4px; display:block; }
    .contact-col-actions { width:64px; display:flex; justify-content:center; gap:8px; opacity:0; transition:opacity .15s; }
    .contact-row:hover .contact-col-actions { opacity:1; }

    /* ── Flat lines table (shared by contacts + opps) ── */
    .lines-table-header { background:var(--bg2); border:1px solid var(--bdr); border-radius:var(--r) var(--r) 0 0; margin-top:12px; padding:0 16px; }
    .lines-table-header.opp-row { padding-top:0; padding-bottom:0; }
    .lines-th { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 0; user-select:none; -webkit-user-select:none; white-space:nowrap; }
    div.lines-th { font-size:11px !important; font-weight:700 !important; }
    .lines-th--sortable { cursor:pointer; transition:color .15s; }
    .lines-th--sortable:hover { color:var(--text); }
    .lines-th--active { color:var(--accent); }
    .lines-sort-arrow { font-size:11px; margin-left:2px; }
    .lines-table-body { background:var(--card); border:1px solid var(--bdr); border-top:none; border-radius:0 0 var(--r) var(--r); overflow:hidden; }
    .lines-table-body > :first-child { border-top:none; }

    /* ── Opportunity row grid ── */
    .opp-row { display:grid; grid-template-columns:minmax(130px,2fr) 110px minmax(90px,1.4fr) minmax(70px,1fr) 70px 44px 64px; column-gap:10px; padding:10px 16px; border-top:1px solid var(--bdr); align-items:center; cursor:pointer; transition:background .15s; }
    .opp-row:hover { background:rgba(255,255,255,.03); }
    .opp-row.expanded { background:var(--bg2); border-left:3px solid var(--accent); }
    .opp-col-role { font-weight:600; font-size:13px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .opp-col-stage { display:flex; justify-content:center; }
    .opp-col-firm, .opp-col-loc { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; text-align:center; }
    .opp-col-ref { display:flex; justify-content:center; }
    .opp-col-link { display:flex; justify-content:center; }
    .opp-link-btn { color:var(--muted); text-decoration:none; }
    .opp-link-btn svg { width:14px; height:14px; fill:currentColor; display:block; }
    .opp-col-actions { display:flex; justify-content:center; gap:8px; opacity:0; transition:opacity .15s; }
    .opp-row:hover .opp-col-actions { opacity:1; }

    /* ── Overview firm card link button ── */
    .fc-link-btn { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; color:var(--muted); flex-shrink:0; border-radius:4px; transition:color .15s, background .15s; text-decoration:none; }
    .fc-link-btn svg { width:11px; height:11px; fill:currentColor; display:block; }

    /* ── Universe sub-tab bar ── */
    .universe-tabbar { display:flex; align-items:center; gap:0; background:var(--bg2); border-bottom:1px solid var(--bdr); padding:0 20px; flex-shrink:0; }
    .universe-tab-btn { display:flex; align-items:center; gap:7px; padding:11px 18px; background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); font-family:inherit; transition:color .15s, border-color .15s; margin-bottom:-1px; text-transform:uppercase; letter-spacing:.05em; }
    .universe-tab-btn svg { width:16px; height:16px; flex-shrink:0; }
    .universe-tab-btn svg path[stroke], .universe-tab-btn svg circle[stroke] { stroke:currentColor; fill:none; }
    .universe-tab-btn svg path:not([stroke]) { fill:currentColor; stroke:none; }
    .universe-tab-btn:hover { color:var(--text); }
    .universe-tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

    /* ── Keyboard shortcuts overlay ── */
    .kb-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:center; justify-content:center; animation:fadeIn .15s ease-out; }
    .kb-modal { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:28px 32px; width:520px; max-width:95vw; max-height:85vh; overflow-y:auto; }
    .kb-modal h2 { font-size:16px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .kb-modal h2 kbd { background:var(--bg2); border:1px solid var(--bdr2); border-radius:4px; padding:2px 7px; font-size:12px; font-weight:600; }
    .kb-section { margin-bottom:16px; }
    .kb-section-title { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:8px; }
    .kb-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--bdr); font-size:13px; }
    .kb-row:last-child { border-bottom:none; }
    .kb-keys { display:flex; gap:4px; flex-shrink:0; }
    .kb-key { background:var(--bg2); border:1px solid var(--bdr2); border-radius:4px; padding:2px 7px; font-size:11px; font-weight:600; color:var(--text); white-space:nowrap; }
    .kb-desc { color:var(--muted); }

    .c-detail { padding:12px 16px 12px 24px; border-top:1px solid var(--bdr); background:var(--bg2); font-size:13px; animation:fadeIn .2s ease-out; }
    .c-detail-row { margin-bottom:6px; }
    .c-detail-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
    .c-detail-val { color:var(--text); }
    .c-detail-val a { color:var(--accent); text-decoration:none; }
    .c-detail-val a:hover { text-decoration:underline; }

    /* ── Opportunities ── */
    .opps-page { padding:20px; max-width:900px; margin:0 auto; width:100%; }

    /* ── Badges ── */
    .badge { padding:3px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:600; white-space:nowrap; flex-shrink:0; }
    .b-grey   { background:rgba(168,181,209,.15); color:#a8b5d1; }
    .b-blue   { background:rgba(72,219,251,.15);  color:#48dbfb; }
    .b-purple { background:rgba(167,139,250,.15); color:#a78bfa; }
    .b-green  { background:rgba(0,208,132,.15);   color:var(--success); }
    .b-amber  { background:rgba(254,202,87,.15);  color:var(--warning); }
    .b-red    { background:rgba(255,99,72,.15);    color:var(--danger); }
    .b-indigo { background:rgba(99,102,241,.15);   color:#818cf8; }
    .b-teal   { background:rgba(20,184,166,.15);   color:#2dd4bf; }

    .tag { padding:3px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:600; background:var(--bg2); color:var(--muted); border:1px solid var(--bdr); }
    .tag-p { background:rgba(129,211,26,.12); color:var(--accent); border-color:rgba(129,211,26,.3); }

    /* ── Modal ── */
    .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }
    .modal { background:var(--card); border:1px solid var(--bdr2); border-radius:10px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; animation:popIn .35s ease-out; box-shadow:var(--sh-lg); }
    .modal-h { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--bdr); }
    .modal-h h3 { font-size:16px; font-weight:700; }
    .modal-b { padding:20px 24px; }
    .modal-f { display:flex; justify-content:flex-end; gap:10px; padding:0 24px 20px; }

    /* ── Toast ── */
    .toast-container { position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:12px 16px; border-radius:var(--r); font-size:13px; font-weight:500; animation:toastIn .3s ease-out; min-width:260px; box-shadow:var(--sh-md); }
    .toast.out { animation:toastOut .3s ease-in forwards; }
    .toast-s { background:#1a3d2a; border:1px solid var(--success); color:var(--success); }
    .toast-e { background:#3d1a1a; border:1px solid var(--danger); color:var(--danger); }

    /* ── Create form card ── */
    .create-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); margin-bottom:24px; overflow:hidden; }
    .create-card-head { padding:14px 16px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition:background .1s; user-select:none; -webkit-user-select:none; color:var(--accent); }
    /* Base = closed = defines FAST collapse transition (fires when --open is removed) */
    .create-card-body { max-height:0; overflow:hidden; opacity:0; border-top:1px solid transparent; transition:max-height 0.22s ease, opacity 0.15s ease, border-top-color 0.12s ease, padding 0.18s ease; padding:0 16px; }
    /* Open state = defines SLOW expand transition (fires when --open is added) */
    .create-card-body--open { max-height:800px; opacity:1; padding:16px; border-top-color:var(--bdr); transition:max-height 1.5s var(--ease-decel), opacity 0.6s var(--ease-decel), border-top-color 0.3s ease, padding 0.4s var(--ease-decel); }
    /* Plus/minus icon morph */
    .create-card-icon { position:relative; width:16px; height:16px; flex-shrink:0; }
    .create-card-icon::before, .create-card-icon::after { content:''; position:absolute; background:var(--accent); border-radius:1px; left:50%; top:50%; transition:transform 0.35s var(--ease-decel), opacity 0.35s; }
    .create-card-icon::before { width:14px; height:2px; transform:translate(-50%,-50%); }
    .create-card-icon::after { width:2px; height:14px; transform:translate(-50%,-50%) scaleY(1); transform-origin:center; }
    .create-card-icon.open::after { transform:translate(-50%,-50%) scaleY(0); opacity:0; }

    /* ── Matchmaker ── */
    .mm-page { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; height:100%; user-select:none; -webkit-user-select:none; }
    .mm-summary { display:flex; gap:12px; align-items:center; margin-bottom:16px; font-size:13px; color:var(--muted); }
    .mm-count { display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:var(--r-pill); font-weight:600; font-size:12px; }
    .mm-progress { font-size:12px; color:var(--muted); margin-bottom:12px; }

    .mm-stack { position:relative; width:100%; max-width:400px; margin-bottom:28px; }
    .mm-stack::before, .mm-stack::after { content:''; position:absolute; left:50%; bottom:-4px; width:92%; height:100%; background:var(--bg2); border:1px solid var(--bdr); border-radius:12px; transform:translateX(-50%); z-index:0; pointer-events:none; }
    .mm-stack::after { bottom:-8px; width:84%; opacity:.5; }

    .mm-card { position:relative; z-index:1; background:var(--card); border:1px solid var(--bdr2); border-radius:12px; padding:28px 28px 20px; box-shadow:var(--sh-lg); touch-action:pan-y; transition:transform .15s ease, opacity .15s ease; will-change:transform; }
    .mm-card.swiping { transition:none; }
    .mm-card.exit-left { animation:mmExitLeft .35s ease-in forwards; }
    .mm-card.exit-right { animation:mmExitRight .35s ease-in forwards; }
    .mm-card.entering { animation:mmEnter .3s ease-out; }

    @keyframes mmExitLeft { to { transform:translateX(-140%) rotate(-15deg); opacity:0; } }
    @keyframes mmExitRight { to { transform:translateX(140%) rotate(15deg); opacity:0; } }
    @keyframes mmEnter { from { opacity:0; transform:scale(.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }

    .mm-swipe-hint { position:absolute; top:20px; padding:8px 18px; border-radius:var(--r); font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; opacity:0; transition:opacity .1s; pointer-events:none; z-index:5; }
    .mm-swipe-hint.reject-hint { right:20px; border:3px solid var(--danger); color:var(--danger); transform:rotate(12deg); }
    .mm-swipe-hint.accept-hint { left:20px; border:3px solid var(--accent); color:var(--accent); transform:rotate(-12deg); }

    .mm-firm { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
    .mm-title { font-size:20px; font-weight:700; line-height:1.3; margin-bottom:14px; }
    .mm-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
    .mm-score { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:var(--r-pill); font-size:12px; font-weight:700; }
    .mm-score.high { background:rgba(16,185,129,.15); color:var(--col-green); }
    .mm-score.medium { background:rgba(245,158,11,.15); color:var(--col-amber); }
    .mm-score.low { background:rgba(107,114,128,.15); color:var(--col-neutral); }

    .mm-link-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--accent); text-decoration:none; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; transition:all .15s; }

    .mm-actions { display:flex; align-items:center; justify-content:center; gap:32px; }
    .mm-action-btn { width:64px; height:64px; border-radius:50%; border:2px solid; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; font-size:24px; line-height:1; }
    .mm-btn-reject { border-color:var(--danger); color:var(--danger); }
    .mm-btn-reject svg { width:24px; height:24px; }
    .mm-btn-accept { border-color:var(--accent); color:var(--accent); }
    .mm-btn-accept svg { width:28px; height:28px; }

    .mm-keys-hint { display:flex; justify-content:center; gap:20px; margin-top:16px; font-size:11px; color:var(--muted); }
    .mm-keys-hint kbd { background:var(--bg2); border:1px solid var(--bdr2); border-radius:4px; padding:1px 6px; font-size:11px; font-weight:600; margin-right:3px; }

    .mm-history-toggle { margin-top:20px; background:transparent; border:none; cursor:pointer; font-family:inherit; font-size:13px; color:var(--muted); font-weight:500; transition:color .15s; }
    .mm-history { width:100%; max-width:400px; margin-top:10px; animation:fadeIn .2s ease-out; }
    .mm-history-row { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--bdr); border-radius:var(--r); background:var(--card); margin-bottom:4px; font-size:12px; }
    .mm-history-row .h-title { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mm-history-row .h-firm { color:var(--muted); white-space:nowrap; }

    /* ── Misc ── */
    .error-msg { color:var(--danger); font-size:13px; margin-top:8px; padding:10px; background:rgba(255,99,72,.08); border:1px solid rgba(255,99,72,.2); border-radius:var(--r); }
    .setup-code { background:var(--bg); border:1px solid var(--bdr); border-radius:var(--r); padding:14px; font-family:'Monaco','Courier New',monospace; font-size:11px; color:var(--muted); white-space:pre-wrap; margin-bottom:16px; overflow-x:auto; max-height:300px; overflow-y:auto; }
    .note-box { padding:12px 16px; background:rgba(129,211,26,.06); border:1px solid rgba(129,211,26,.2); border-radius:var(--r); font-size:13px; color:var(--muted); margin-bottom:20px; }
    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }

    /* ── Todo ── */
    .todo-page { padding:20px; max-width:700px; margin:0 auto; width:100%; }
    .task-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--bdr); border-radius:var(--r); background:var(--card); margin-bottom:6px; cursor:default; transition:border-color .15s, box-shadow .15s; position:relative; }
    .task-row.reorderable { cursor:grab; }
    .task-row.reorderable:active { cursor:grabbing; }
    .task-row.dragging { opacity:.4; }
    .task-row.drag-over { border-color:var(--accent); box-shadow:0 0 10px rgba(129,211,26,.2); }
    .task-row.done-row { opacity:.5; }
    /* ── Custom checkbox (SVG draw animation) ── */
    .task-cb { width:18px; height:18px; border-radius:7px; background:linear-gradient(180deg, rgba(22,26,35,.98), rgba(14,17,24,.98)); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 0 0 1.5px rgba(176,179,186,.18), 0 1px 2px rgba(0,0,0,.22); cursor:pointer; align-self:center; flex-shrink:0; position:relative; transition:box-shadow .2s ease, background .2s ease, transform .15s ease; display:flex; align-items:center; justify-content:center; outline:none; }
    .task-cb-svg { width:12px; height:12px; display:block; overflow:visible; }
    .task-cb-check { stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset 0s; }
    .task-cb:focus-visible { box-shadow:inset 0 0 0 1.5px var(--accent), 0 0 0 3px rgba(129,211,26,.2); }
    .task-cb:active { transform:scale(.93); }
    .task-cb--ticking { background:linear-gradient(180deg, rgba(30,41,20,.98), rgba(20,28,14,.98)); box-shadow:inset 0 1px 0 rgba(255,255,255,.03), inset 0 0 0 1.5px var(--accent), 0 0 0 1px rgba(129,211,26,.1); }
    .task-cb--ticking .task-cb-check { stroke-dashoffset:0; transition:stroke-dashoffset 0.5s var(--ease-decel); }
    .task-cb--checked { background:linear-gradient(180deg, rgba(30,41,20,.98), rgba(20,28,14,.98)); box-shadow:inset 0 1px 0 rgba(255,255,255,.03), inset 0 0 0 1.5px rgba(129,211,26,.45), 0 0 0 1px rgba(129,211,26,.08); }
    .task-cb--checked .task-cb-check { stroke-dashoffset:0; transition:none; }
    /* When both ticking AND checked, ticking wins so draw animation plays */
    .task-cb--ticking.task-cb--checked .task-cb-check { stroke-dashoffset:0; transition:stroke-dashoffset 0.5s var(--ease-decel); }

    .task-main { flex:1; min-width:0; }
    .task-title { font-size:13px; font-weight:600; color:var(--text); }
    /* Animated strikethrough — inline-block gives ::after a proper box for top:50% */
    .task-title-text { position:relative; display:inline-block; }
    .task-title-text::after { content:''; position:absolute; left:0; top:50%; height:1.5px; width:0%; background:var(--muted); border-radius:1px; transform:translateY(-50%); transition:width 0s; }
    .task-title-text.striking::after { width:100%; transition:width 1.5s var(--ease-decel) 0.5s; }
    .task-title-text.struck::after { width:100%; transition:none; }
    .task-row.done-row .task-title-text { color:var(--muted); }
    .task-meta { display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; }
    .task-notes { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:300px; }
    .task-actions { display:flex; gap:4px; opacity:0; transition:opacity .15s; flex-shrink:0; }
    .task-drop-indicator { height:2px; background:var(--accent); border-radius:2px; margin-bottom:4px; }
    .done-section-header { display:flex; align-items:center; gap:6px; padding:10px 0 6px; font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; -webkit-user-select:none; border-top:1px solid var(--bdr); margin-top:8px; }
    .firm-todo-item { padding:5px 16px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; transition:background .1s; }
    .firm-todo-item .todo-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }

    /* ── Hover: only on devices that support it ── */
    @media (hover: hover) {
      .btn-p:hover { background:var(--accent-h); box-shadow:0 4px 16px rgba(129,211,26,.3); }
      .btn-s:hover { color:var(--text); border-color:var(--muted); }
      .btn-d:hover { background:rgba(255,99,72,.25); }
      .btn-icon:hover { color:var(--accent); background:rgba(129,211,26,.08); }
      .sidebar:hover { width:180px; }
      .sidebar:hover .sidebar-label { opacity:1; }
      .sidebar-item:hover { color:var(--text); background:rgba(255,255,255,.04); }
      .firm-col:hover { border-color:rgba(129,211,26,.4); box-shadow:var(--sh-sm); }
      .firm-col:hover .fc-actions { opacity:1; }
      .fc-item:hover { background:rgba(255,255,255,.03); color:var(--text); }
      .add-firm-col:hover { border-color:var(--accent); color:var(--accent); }
      .pl-card:hover { border-color:rgba(129,211,26,.4); transform:translateY(-1px); box-shadow:var(--sh-sm); }
      .task-row:hover { border-color:rgba(129,211,26,.3); box-shadow:var(--sh-sm); }
      .task-cb:hover { box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 0 1.5px var(--accent), 0 0 0 2px rgba(129,211,26,.12); }
      .task-row:hover .task-actions { opacity:1; }
      .firm-todo-item:hover { background:rgba(255,255,255,.03); color:var(--text); }
      .create-card-head:hover { background:var(--accent-bg2); }
      .mm-link-btn:hover { border-color:var(--accent); background:var(--accent-bg2); }
      .mm-btn-reject:hover { background:rgba(255,99,72,.12); transform:scale(1.1); box-shadow:0 0 20px rgba(255,99,72,.25); }
      .mm-btn-accept:hover { background:var(--accent-bg); transform:scale(1.1); box-shadow:0 0 20px rgba(129,211,26,.25); }
      .mm-history-toggle:hover { color:var(--text); }
      .fc-link-btn:hover { color:var(--accent); background:var(--accent-bg2); }
      .opp-link-btn:hover { color:var(--accent); }
      .done-section-header:hover { color:var(--text); }
    }

    /* ── Touch: always show action buttons ── */
    @media (hover: none) {
      .fc-actions { opacity:1; }
      .task-actions { opacity:1; }
      .pl-card-actions { opacity:1; }
      .contact-col-actions { opacity:1; }
      .opp-col-actions { opacity:1; }
      .c-row-actions { opacity:1; }
    }

    /* ── Active/pressed states for touch feedback ── */
    .btn:active { transform:scale(0.97); opacity:0.8; }
    .btn-icon:active { transform:scale(0.9); opacity:0.7; }
    .sidebar-item:active, .bottom-nav-item:active { opacity:0.7; }
    .task-row:active { background:var(--accent-bg2); }
    .pl-card:active { transform:scale(0.98); }
    .firm-col:active { transform:scale(0.99); }
    .mm-action-btn:active { transform:scale(0.9); }

    /* ── Mobile navigation menu ── */
    @keyframes iconBounce {
      0%,100% { transform:translateY(0); }
      20%     { transform:translateY(-5px); }
      40%     { transform:translateY(0); }
      60%     { transform:translateY(-2px); }
      80%     { transform:translateY(0); }
    }
    .mobile-menu { display:none; }

    /* ── Tab slide animation ── */
    .tab-slide { animation: tabFadeIn .15s ease-out; }
    @keyframes tabFadeIn { from { opacity:0; } to { opacity:1; } }

    /* ── Pull-to-refresh indicator ── */
    .pull-indicator { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; overflow:hidden; transition:color .15s; }

    /* ── Touch: task move buttons ── */
    .task-move-btns { display:flex; flex-direction:column; gap:2px; }
    .task-move-btns .btn-icon { padding:2px 6px; font-size:12px; min-width:unset; min-height:unset; }

    /* ── Stage picker (touch pipeline) ── */
    .stage-picker-grid { display:flex; flex-direction:column; gap:6px; }
    .stage-picker-grid .btn { width:100%; justify-content:center; }

    /* ── Tablet ── */
    @media (max-width:1024px) {
      .overview { padding:var(--sp-md); gap:12px; }
      .mm-stack { max-width:360px; }
    }

    /* ── Mobile ── */
    @media (max-width:768px) {
      .sidebar { display:none; }
      /* Floating pill nav */
      .mobile-menu {
        display:flex;
        position:fixed;
        bottom:max(12px, env(safe-area-inset-bottom));
        left:16px; right:16px;
      background:color-mix(in srgb, var(--card) 60%, transparent);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
        border:1px solid var(--bdr2);
        border-radius:20px;
        z-index:50;
        height:56px;
        align-items:center;
        padding:0 4px;
      }
      .mobile-menu__item {
        flex:1;
        display:flex;
        flex-direction:row;
        align-items:center;
        justify-content:center;
        gap:6px;
        padding:10px 4px;
        background:transparent;
        border:none;
        color:var(--muted);
        font-family:inherit;

  if (!msg) return 'Something went wrong. Please try again.';
  if (msg.includes('duplicate key') || msg.includes('unique')) return 'That already exists.';
  if (msg.includes('violates foreign key')) return 'Related record not found.';

async function fetchWithRetry(fn, retries = 2, delay = 1000) {
  for (let i = 0; i <= retries; i++) {
    try { return await fn(); }
    catch(e) { if (i === retries) throw e; await new Promise(r => setTimeout(r, delay * (i + 1))); }
  }
}

/* ══════════════════ PULL-TO-REFRESH HOOK ══════════════════ */
function usePullToRefresh(onRefresh) {
  const [pulling, setPulling] = useState(false);
  const [pullDist, setPullDist] = useState(0);
  const startY = useRef(0);
  const scrollEl = useRef(null);
  const THRESHOLD = 80;

  function onTouchStart(e) {
    /* Only activate when scrolled to top */
    const el = scrollEl.current || e.currentTarget;
    if (el.scrollTop === 0) startY.current = e.touches[0].clientY;
    else startY.current = 0;
  }
  function onTouchMove(e) {
    if (!startY.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && dy < 150) { setPullDist(dy); setPulling(dy > THRESHOLD); }
  }
  async function onTouchEnd() {
    if (pulling) { await onRefresh(); }
    setPullDist(0); setPulling(false); startY.current = 0;
  }
  return { onTouchStart, onTouchMove, onTouchEnd, pullDist, pulling, scrollEl };
}

/* Consolidates duplicated drag-and-drop logic used by OverviewTab, PipelineTab, TodoTab.
   Returns a function that, given an index, produces draggable event handlers. */
function useDragReorder(onReorder) {
  const dragRef = useRef(null);
  const handlers = (i) => ({
    draggable: true,
    onDragStart: (e) => { dragRef.current = i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; },
    onDragEnd: (e) => { e.currentTarget.classList.remove('dragging'); dragRef.current = null; },
    onDragOver: (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); },
    onDragLeave: (e) => { e.currentTarget.classList.remove('drag-over'); },
    onDrop: (e) => {
      e.currentTarget.classList.remove('drag-over');
      if (dragRef.current !== null && dragRef.current !== i) onReorder(dragRef.current, i);
    },
  });
  return { handlers, dragRef };
}

/* ══════════════════ VIRTUAL LIST ══════════════════ */
/* Simple windowed renderer for long lists — only renders visible rows.

function VirtualList({ items, rowHeight, renderItem, style }) {
  const [scrollTop, setScrollTop] = useState(0);
  const containerRef = useRef(null);
  const visibleCount = Math.ceil((containerRef.current?.clientHeight || 600) / rowHeight) + 2;
  const startIdx = Math.floor(scrollTop / rowHeight);
  const endIdx = Math.min(items.length, startIdx + visibleCount);
  return (
    <div ref={containerRef} onScroll={e => setScrollTop(e.target.scrollTop)}
      style={{ overflow: 'auto', height: '100%', ...style }}>
      <div style={{ height: items.length * rowHeight, position: 'relative' }}>
        {items.slice(startIdx, endIdx).map((item, i) => (
          <div key={startIdx + i} style={{ position: 'absolute', top: (startIdx + i) * rowHeight, width: '100%' }}>
            {renderItem(item, startIdx + i)}

/* ══════════════════ DB CLASS ══════════════════ */
class DB {
  constructor(u,k,userId){this.base=`${u}/rest/v1`;this.userId=userId;this.h={'apikey':k,'Authorization':`Bearer ${k}`,'Content-Type':'application/json'};}
  async get(t,qs=''){const uf=t==='users'?'':'user_id=eq.'+this.userId;const q=[qs,uf].filter(Boolean).join('&');const r=await fetch(`${this.base}/${t}${q?'?'+q:''}`,{headers:this.h});if(!r.ok)throw new Error(await r.text());return r.json();}
  async ins(t,d){const body=t==='users'?d:{...d,user_id:this.userId};const r=await fetch(`${this.base}/${t}`,{method:'POST',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async upd(t,id,d){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'PATCH',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async del(t,id){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'DELETE',headers:{...this.h,Prefer:'return=minimal'}});if(!r.ok)throw new Error(await r.text());}
  async rpc(fn,params){const r=await fetch(`${this.base}/rpc/${fn}`,{method:'POST',headers:this.h,body:JSON.stringify(params)});if(!r.ok)throw new Error(await r.text());return r.json();}
}
function getDbConfig(){
  if(SUPABASE_URL&&SUPABASE_KEY)return{url:SUPABASE_URL,key:SUPABASE_KEY};
  try{return JSON.parse(localStorage.getItem('hfcrm_config')||'null');}catch{return null;}
}
function getAuth(){
  try{
    const auth=JSON.parse(localStorage.getItem('hfcrm_auth')||'null');
    /* Expire sessions after 7 days of inactivity */
    if(auth && Date.now()-auth.ts > 7*24*60*60*1000){
      localStorage.removeItem('hfcrm_auth');
      return null;
    }
    return auth;
  }catch{return null;}
}

/* ══════════════════ MODAL ══════════════════ */
function Modal({title,onClose,onSave,saveLabel='Save',children,saving,danger}){
  const modalRef = useRef(null);
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    /* Auto-focus first input inside modal for accessibility */
    const first = modalRef.current?.querySelector('input, select, textarea');
    if(first) setTimeout(()=>first.focus(), 50);
    return()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return(
    <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onClose()} role="presentation">
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" ref={modalRef}>
        <div className="modal-h"><h3 id="modal-title">{title}</h3><button className="btn-icon" onClick={onClose} aria-label="Close modal">✕</button></div>
        <div className="modal-b">{children}</div>
        <div className="modal-f">
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
          <button className={`btn ${danger?'btn-d':'btn-p'}`} onClick={onSave} disabled={saving}>{saving?'Saving…':saveLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════ COMPANY COMBOBOX ══════════════════ */
function CompanyCombo({value,onChange,firms,onCreateNew,label='Company'}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const selFirm=firms.find(f=>f.id===value);

  useEffect(()=>{if(selFirm&&!open)setQ(selFirm.name);},[selFirm,open]);
  /* Clear text when value is explicitly cleared externally */
  useEffect(()=>{if(!value)setQ('');},[value]);

  const matches=useMemo(()=>{
    if(!q.trim())return firms;
    return firms.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  },[firms,q]);

  const exactMatch=matches.find(f=>f.name.toLowerCase()===q.trim().toLowerCase());
  const showCreate=q.trim()&&!exactMatch&&!!onCreateNew;

  function pick(f){onChange(f.id);setQ(f.name);setOpen(false);}

  return(
    <div className="field">
      <label>{label}</label>
      <div className="combo-wrap">
        <input className="combo-input" placeholder="Type company name..." value={q}
          onChange={e=>{setQ(e.target.value);setOpen(true);if(!e.target.value)onChange('');}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),180)}/>
        {open&&(matches.length>0||showCreate)&&(
          <div className="combo-list">
            {matches.map(f=><div key={f.id} className="combo-opt" onMouseDown={e=>e.preventDefault()} onClick={()=>pick(f)}>{f.name}</div>)}
            {showCreate&&<div className="combo-opt create" onMouseDown={e=>e.preventDefault()} onClick={()=>{onCreateNew(q.trim());setOpen(false);}}>+ Create: {q.trim()}</div>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ContactCombo — type-ahead search for contacts, optionally filtered by firm */
function ContactCombo({value,onChange,contacts,firmId,label='Contact (optional)'}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const pool=useMemo(()=>firmId?contacts.filter(c=>c.firm_id===firmId):contacts,[contacts,firmId]);
  const selContact=contacts.find(c=>c.id===value);

  useEffect(()=>{if(selContact&&!open)setQ(selContact.name);},[selContact,open]);
  /* If the selected contact no longer belongs to the newly chosen firm, clear */
  useEffect(()=>{
    if(value&&firmId){const c=contacts.find(x=>x.id===value);if(c&&c.firm_id!==firmId){onChange('');setQ('');}}
  },[firmId]);
  useEffect(()=>{if(!value)setQ('');},[value]);

  const matches=useMemo(()=>{
    if(!q.trim())return pool;
    const lq=q.toLowerCase();
    return pool.filter(c=>c.name.toLowerCase().includes(lq)||(c.role&&c.role.toLowerCase().includes(lq)));
  },[pool,q]);

  function pick(c){onChange(c.id);setQ(c.name);setOpen(false);}

  return(
    <div className="field">
      <label>{label}</label>
      <div className="combo-wrap">
        <input className="combo-input" placeholder="Type contact name..." value={q}
          onChange={e=>{setQ(e.target.value);setOpen(true);if(!e.target.value)onChange('');}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),180)}/>

/* ══════════════════ TAB 2: OVERVIEW ══════════════════ */
function OverviewTab(){
  const {firms,contacts,opps,todos,db,reload} = useContext(DataCtx);
  const {setModal,setTab} = useContext(UICtx);
  const {toast} = useContext(NotifyCtx);
  const sorted = useMemo(()=>{
    const openTodos = [...todos.filter(t=>!t.done)].sort((a,b)=>a.priority-b.priority);
    const seen = [];
    openTodos.forEach(t=>{if(t.firm_id&&!seen.includes(t.firm_id))seen.push(t.firm_id);});
    const withTodos = seen.map(id=>firms.find(f=>f.id===id)).filter(Boolean);
    const withoutTodos = [...firms].filter(f=>!seen.includes(f.id)).sort((a,b)=>(a.order_position||0)-(b.order_position||0));
    return [...withTodos,...withoutTodos];
  },[firms,todos]);
  const dragRef = useRef(null);
  const containerRef = useRef(null);
  const [colCount, setColCount] = useState(3);

  useEffect(()=>{
    const el = containerRef.current; if(!el) return;
    let timeout;
    const update = ()=>{ clearTimeout(timeout); timeout=setTimeout(()=>setColCount(Math.max(1, Math.floor((el.offsetWidth - 40) / 316))),100); };
    update();
    const ro = new ResizeObserver(update); ro.observe(el);
    return ()=>{ ro.disconnect(); clearTimeout(timeout); };
  }, []);

  function onDragStart(e,i){dragRef.current=i;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
  function onDragEnd(e){e.currentTarget.classList.remove('dragging');dragRef.current=null;}
  function onDragOver(e,i){e.preventDefault();e.currentTarget.classList.add('drag-over');}
  function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
  async function onDrop(e,i){
    e.currentTarget.classList.remove('drag-over');
    const from=dragRef.current;if(from===null||from===i)return;
    /* Store previous order so we can roll back if the batch update partially fails */
    const prevOrder = sorted.map(f=>({id:f.id,order_position:f.order_position}));
    const arr=[...sorted];const [moved]=arr.splice(from,1);arr.splice(i,0,moved);
    try{await Promise.all(arr.map((f,idx)=>db.upd('firms',f.id,{order_position:idx})));reload();toast('Order saved','s');}
    catch(err){
      toast('Failed to save order, reverting','e');
      try{await Promise.all(prevOrder.map(p=>db.upd('firms',p.id,{order_position:p.order_position})));}catch(_){}
      reload();
    }
  }

  function firmContacts(fid){return contacts.filter(c=>c.firm_id===fid);}
  function firmOpps(fid){return opps.filter(o=>o.firm_id===fid);}

  const columns = Array.from({length:colCount}, ()=>[]);
  sorted.forEach((f,i)=>columns[i%colCount].push({f,i}));

  function renderCard(f,i){
    const fTodos=todos.filter(t=>t.firm_id===f.id&&!t.done).sort((a,b)=>a.priority-b.priority);
    return(
      <div key={f.id} className="firm-col" {...(!isTouchDevice()?{draggable:true,onDragStart:e=>onDragStart(e,i),onDragEnd,onDragOver:e=>onDragOver(e,i),onDragLeave,onDrop:e=>onDrop(e,i)}:{})}>
        <div className="fc-head">
          <div className="fc-name">
            {f.name}
            <div className="fc-actions">
              <button className="btn-icon" onClick={()=>setModal({type:'edit-firm',data:f})} aria-label="Edit firm">✎</button>
              <button className="btn-icon" style={{color:'var(--danger)'}} onClick={()=>setModal({type:'del-firm',data:f})} aria-label="Delete firm">✕</button>
            </div>
          </div>
          <div className="fc-meta">
            {f.type&&<span className="tag">{f.type}</span>}
          </div>
        </div>
        {fTodos.length>0?(
          <div className="fc-section fc-tasks">
            <div className="fc-section-head"><span>Tasks</span><span className="fc-task-badge">{fTodos.length}</span></div>
            {fTodos.slice(0,3).map(t=>(
              <div key={t.id} className="firm-todo-item" onClick={e=>{e.stopPropagation();setTab('todo');}}>
                <span className="todo-dot"/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{t.title}</span>
              </div>
            ))}
            {fTodos.length>3&&<div className="firm-todo-item" style={{color:'var(--accent)',fontStyle:'italic'}} onClick={e=>{e.stopPropagation();setTab('todo');}}>+{fTodos.length-3} more</div>}
          </div>
        ):f.next_steps?<div className="fc-next">⚡ {f.next_steps}</div>:null}
        <div className="fc-section">
          <div className="fc-section-head"><span>Contacts ({firmContacts(f.id).length})</span><button className="btn btn-sm btn-s" onClick={()=>setModal({type:'add-contact',firmId:f.id})}>+</button></div>
          {firmContacts(f.id).length?firmContacts(f.id).map(c=>(
            <div key={c.id} className="fc-item" onClick={()=>setModal({type:'edit-contact',data:c})}><Badge v={c.status} arr={C_ST}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{c.name}{c.role?' · '+c.role:''}</span></div>
          )):<div className="fc-empty">No contacts</div>}
        </div>
        <div className="fc-section">
          <div className="fc-section-head"><span>Opportunities ({firmOpps(f.id).length})</span><button className="btn btn-sm btn-s" onClick={()=>setModal({type:'add-opp',firmId:f.id})}>+</button></div>
          {firmOpps(f.id).length?firmOpps(f.id).map(o=>(
            <div key={o.id} className="fc-item" onClick={()=>setModal({type:'edit-opp',data:o})}><Badge v={o.stage} arr={STAGES}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{o.role}</span>{o.link&&<a className="fc-link-btn" href={o.link} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} aria-label="Open job posting" title="Open job posting"><IconExternalLink/></a>}</div>
          )):<div className="fc-empty">No opportunities</div>}
        </div>
      </div>
    );
  }

  return(
    <div ref={containerRef} className="overview">
      {columns.map((col,ci)=>(
        <div key={ci} className="overview-col">
          {col.map(({f,i})=>renderCard(f,i))}
          {ci===columns.length-1&&<div className="add-firm-col" onClick={()=>setModal({type:'add-firm'})}>+ Add Firm</div>}
        </div>
      ))}
      {sorted.length===0&&<div className="add-firm-col" onClick={()=>setModal({type:'add-firm'})}>+ Add Firm</div>}
    </div>
  );
}

/* ══════════════════ TAB 2: PIPELINE ══════════════════ */
function PipelineTab(){
  const {firms,opps,contacts,db,reload} = useContext(DataCtx);
  const {setModal} = useContext(UICtx);
  const {toast} = useContext(NotifyCtx);
  const dragRef = useRef(null);
  const [localOpps,setLocalOpps] = useState([]);
  const [dragOverStage,setDragOverStage] = useState(null);
  const dragCounter = useRef({});
  const [stagePicker,setStagePicker] = useState(null); /* touch: {opp} */
  const touch = isTouchDevice();

  useEffect(()=>{setLocalOpps(opps);},[opps]);

  function firmName(fid){const f=firms.find(x=>x.id===fid);return f?f.name:'?';}
  function referrer(o){const c=contacts.find(x=>x.firm_id===o.firm_id&&x.status==='willing_to_refer');return c?c.name:o.referral==='Yes'||o.referral==='Pending'?'(referral pending)':null;}
  function stageOpps(stg){return [...localOpps.filter(o=>o.stage===stg)].sort((a,b)=>(a.stage_order||0)-(b.stage_order||0));}

  function onDragStart(e,opp){dragRef.current=opp;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging');}
  function onDragEnd(e){e.currentTarget.classList.remove('dragging');dragRef.current=null;setDragOverStage(null);dragCounter.current={};}

  function onCardDragOver(e,targetOpp,stage){
    e.preventDefault();
    const src=dragRef.current;if(!src)return;
    if(src.id===targetOpp.id)return;
    if(src.stage===stage){
      const items=stageOpps(stage);
      const srcIdx=items.findIndex(o=>o.id===src.id);
      const tgtIdx=items.findIndex(o=>o.id===targetOpp.id);
      if(srcIdx===tgtIdx)return;
      const reordered=[...items];
      reordered.splice(srcIdx,1);
      reordered.splice(tgtIdx,0,src);
      const updated=localOpps.map(o=>{
        const ri=reordered.findIndex(r=>r.id===o.id);
        if(ri>=0)return {...o,stage_order:ri};
        return o;
      });
      setLocalOpps(updated);
    }
  }

  function colDragEnter(e,stage){
    e.preventDefault();
    dragCounter.current[stage]=(dragCounter.current[stage]||0)+1;
    setDragOverStage(stage);
  }
  function colDragLeave(e,stage){
    dragCounter.current[stage]=(dragCounter.current[stage]||0)-1;
    if(dragCounter.current[stage]<=0){
      dragCounter.current[stage]=0;
      if(dragOverStage===stage)setDragOverStage(null);
    }
  }
  function colDragOver(e){e.preventDefault();}

  /* Touch: change stage via picker */
  async function touchChangeStage(oppId, newStage){
    try{await db.upd('opportunities',oppId,{stage:newStage});reload();toast(`Moved to ${si(newStage,STAGES).label}`,'s');setStagePicker(null);}
    catch(err){toast(friendlyError(err.message),'e');}
  }

  async function colDrop(e,stage){
    e.preventDefault();
    dragCounter.current[stage]=0;
    setDragOverStage(null);
    const opp=dragRef.current;if(!opp)return;
    if(opp.stage!==stage){
      try{await db.upd('opportunities',opp.id,{stage});reload();toast(`Moved to ${si(stage,STAGES).label}`,'s');}
      catch(err){toast(friendlyError(err.message),'e');reload();}
    }
  }

  function renderCol(stg){
    const items=stageOpps(stg.v);
    const isRejected=stg.v==='rejected';
    const isOver=dragOverStage===stg.v;
    const borderColor=COLOR_MAP[stg.color]||'var(--col-neutral)';
    return(
      <div key={stg.v} className={`pl-col ${isOver?'drag-over':''}`}
        onDragEnter={e=>colDragEnter(e,stg.v)}
        onDragLeave={e=>colDragLeave(e,stg.v)}
        onDragOver={colDragOver}
        onDrop={e=>colDrop(e,stg.v)}>
        <div className={`pl-col-head ${stg.color}`}><span>{stg.label}</span><span className="pl-count">{isRejected?opps.filter(o=>o.stage==='rejected').length:items.length}</span></div>
        <div className="pl-drop">
          {isRejected?(
            <div className="recycle-zone"><IconRecycleBin/></div>
          ):items.length?items.map(o=>(
            <div key={o.id} className="pl-card"
              style={{borderLeft:`3px solid ${borderColor}`}}
              {...(!touch?{draggable:true,onDragStart:e=>onDragStart(e,o),onDragEnd,onDragOver:e=>onCardDragOver(e,o,stg.v),onDrop:e=>{e.stopPropagation();colDrop(e,stg.v);}}:{})}
              onClick={touch?()=>setStagePicker(o):undefined}>
              <div className="pl-card-firm">{firmName(o.firm_id)}</div>
              <div className="pl-card-role">{o.role}</div>
              {referrer(o)&&<div className="pl-card-ref">↪ {referrer(o)}</div>}
              <div className="pl-card-actions">
                <button className="btn-icon" style={{fontSize:14}} onClick={()=>setModal({type:'edit-opp',data:o})} aria-label="Edit opportunity">✎</button>
                <button className="btn-icon" style={{fontSize:14,color:'var(--danger)'}} onClick={()=>setModal({type:'del-opp',data:o})} aria-label="Delete opportunity">✕</button>
              </div>
            </div>
          )):<div className="pl-empty">Drop here</div>}
        </div>
      </div>
    );
  }

  const mainBefore = STAGES.filter(s=>s.group==='main'&&(s.v==='not_applied'||s.v==='waiting'));
  const mainAfter = STAGES.filter(s=>s.group==='main'&&(s.v==='rejected'||s.v==='offer'));

  return(
    <div className="pipeline">
      {mainBefore.map(renderCol)}
      <div className="itv-group">
        <div className="itv-group-label">Interview Rounds</div>
        <div className="itv-grid">
          {ITV_STAGES.map(renderCol)}
        </div>
      </div>
      {mainAfter.map(renderCol)}
      {stagePicker&&(
        <Modal title={`Move "${stagePicker.role}"`} onClose={()=>setStagePicker(null)} onSave={()=>{}} saveLabel="">
          <div className="stage-picker-grid">
            {STAGES.filter(s=>s.v!=='rejected').map(s=>(
              <button key={s.v} className={`btn ${stagePicker.stage===s.v?'btn-p':'btn-s'}`}
                onClick={()=>touchChangeStage(stagePicker.id,s.v)}>
                {s.label}
              </button>
            ))}
          </div>
          <div style={{marginTop:12,display:'flex',gap:8}}>
            <button className="btn btn-s" style={{flex:1}} onClick={()=>{setModal({type:'edit-opp',data:stagePicker});setStagePicker(null);}}>Edit</button>
            <button className="btn btn-d" style={{flex:1}} onClick={()=>{setModal({type:'del-opp',data:stagePicker});setStagePicker(null);}}>Delete</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════ TAB 3: CONTACTS ══════════════════ */
function ContactsTab(){
  const {firms,contacts,db,reload} = useContext(DataCtx);
  const {setModal,shortcutAction} = useContext(UICtx);
  const {toast} = useContext(NotifyCtx);
  const [search,setSearch] = useState('');
  const [formOpen,setFormOpen] = useState(false);
  const [sortCol,setSortCol] = useState('status');
  const [sortDir,setSortDir] = useState('asc');
  const searchRef = useRef(null);
  useEffect(()=>{
    if(!shortcutAction) return;
    if(shortcutAction.type==='focus-search') searchRef.current?.focus();
    if(shortcutAction.type==='new-contact') setFormOpen(true);
  },[shortcutAction]);
  const [form,setForm] = useState({firm_id:'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});
  const [saving,setSaving] = useState(false);
  const [newFirmModal,setNewFirmModal] = useState(null);
  const [newFirmForm,setNewFirmForm] = useState({name:'',type:'',next_steps:'',notes:''});

  function handleSort(col){if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(col);setSortDir('asc');}}

  const filtered = useMemo(()=>{
    let list = contacts;
    if(search){const q=search.toLowerCase();list=list.filter(c=>[c.name,c.role,c.email,c.phone,c.linkedin,c.notes,firms.find(f=>f.id===c.firm_id)?.name].some(v=>v?.toLowerCase().includes(q)));}
    return list;
  },[contacts,search,firms]);

  const STATUS_ORDER = ['not_contacted','contacted','contacted_spoken_to','contacted_cant_help','cold','willing_to_refer'];
  const sorted = useMemo(()=>{
    let list=[...filtered];
    if(!sortCol) return list;
    list.sort((a,b)=>{
      let va,vb;
      if(sortCol==='name'){va=a.name?.toLowerCase()??'';vb=b.name?.toLowerCase()??'';}
      else if(sortCol==='status'){va=STATUS_ORDER.indexOf(a.status??'');vb=STATUS_ORDER.indexOf(b.status??'');return sortDir==='asc'?va-vb:vb-va;}
      else if(sortCol==='firm'){va=firms.find(f=>f.id===a.firm_id)?.name?.toLowerCase()??'';vb=firms.find(f=>f.id===b.firm_id)?.name?.toLowerCase()??'';}
      else if(sortCol==='role'){va=a.role?.toLowerCase()??'';vb=b.role?.toLowerCase()??'';}
      else return 0;
      return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    });
    return list;
  },[filtered,sortCol,sortDir,firms]);

  async function handleCreateFirm(){
    if(!newFirmForm.name.trim()){toast('Firm name required','e');return;}
    try{const f=await db.ins('firms',{...newFirmForm,order_position:firms.length});reload();setForm(prev=>({...prev,firm_id:f.id}));setNewFirmModal(null);toast('Firm created','s');}
    catch(e){toast(friendlyError(e.message),'e');}
  }

  async function createContact(){
    if(!form.name.trim()||!form.firm_id){toast('Name and company required','e');return;}
    setSaving(true);
    try{await db.ins('contacts',form);reload();toast('Contact created','s');setForm({firm_id:'',name:'',role:'',email:'',linkedin:'',phone:'',status:'not_contacted',notes:'',advice:''});setFormOpen(false);}
    catch(e){toast(friendlyError(e.message),'e');}
    setSaving(false);
  }

  /* cls mirrors the data-row column class so header alignment matches data alignment */
  const CONTACT_COLS=[
    {key:'name',   label:'Name',         cls:'contact-col-name'},
    {key:'status', label:'Status',       cls:'contact-col-status'},
    {key:'firm',   label:'Firm',         cls:'contact-col-firm'},
    {key:'role',   label:'Role',          cls:'contact-col-role'},
    {key:null,     label:'Links',        cls:'contact-col-links'},
    {key:null,     label:'',             cls:'contact-col-actions'},
  ];

  return(
    <div className="contacts-page">
      <div className="create-card">
        <div className="create-card-head" onClick={()=>setFormOpen(!formOpen)}>
          <span className={`create-card-icon${formOpen?' open':''}`} aria-hidden="true"/> New Contact
        </div>
        <div className={`create-card-body${formOpen?' create-card-body--open':''}`}>
          <ContactFormFields d={form} set={setForm} firms={firms} onCreateFirm={(name)=>{setNewFirmForm({name,type:'',next_steps:'',notes:''});setNewFirmModal(true);}}/>
          <button className="btn btn-p" onClick={createContact} disabled={saving} style={{marginTop:8}}>{saving?'Saving…':'Create Contact'}</button>
        </div>
      </div>

      {newFirmModal&&<Modal title="Create Firm" onClose={()=>setNewFirmModal(null)} onSave={handleCreateFirm} saveLabel="Create"><FirmForm d={newFirmForm} set={setNewFirmForm}/></Modal>}

      <div className="filter-bar" style={{marginBottom:0}}>
        <input ref={searchRef} placeholder="Search contacts..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1}}/>
      </div>

      <div className="lines-table-header contact-row" style={{cursor:'default'}}>
        {CONTACT_COLS.map(({key,label,cls})=>(
          <div key={cls} className={`lines-th${cls?' '+cls:''}${key?' lines-th--sortable':''}${sortCol===key?' lines-th--active':''}`} onClick={()=>key&&handleSort(key)}>
            {label}{sortCol===key&&<span className="lines-sort-arrow">{sortDir==='asc'?' ↑':' ↓'}</span>}
          </div>
        ))}
      </div>
      <div className="lines-table-body">
        {sorted.length?sorted.map(c=>(
          <React.Fragment key={c.id}>
            <div className="c-row contact-row" style={{cursor:'pointer'}} onClick={()=>setModal({type:'edit-contact',data:c})}>
              <div className="c-row-name contact-col-name">{c.name}</div>
