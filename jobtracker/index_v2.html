<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Job Tracker v2</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1d27;
      --bg2: #252830;
      --card: #2d3436;
      --text: #ffffff;
      --muted: #b0b3ba;
      --accent: #81D31A;
      --accent-h: #9ae830;
      --success: #1dd1a1;
      --danger: #ff6348;
      --warning: #feca57;
      --bdr: rgba(176,179,186,0.12);
      --bdr2: rgba(176,179,186,0.2);
      --sh-sm: 0 2px 8px rgba(0,0,0,0.15);
      --sh-md: 0 4px 12px rgba(0,0,0,0.25);
      --sh-lg: 0 8px 20px rgba(0,0,0,0.35);
      --r: 8px;
      --r-pill: 20px;
      --col-neutral: #6b7280;
      --col-amber: #f59e0b;
      --col-red: #ef4444;
      --col-green: #10b981;
      --col-lgreen: #6ee7b7;
      --hot: #ef4444;
      --medium: #f59e0b;
      --cold: #6b7280;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes popIn { from { opacity:0; transform:scale(.95); } to { opacity:1; transform:scale(1); } }
    @keyframes toastIn { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }

    /* ── Auth ── */
    .auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .auth-card { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:40px; width:100%; max-width:480px; animation:fadeIn .5s ease-out; }
    .auth-card h1 { font-size:24px; font-weight:700; margin-bottom:4px; letter-spacing:-.02em; }
    .auth-card .sub { color:var(--muted); margin-bottom:28px; font-size:13px; }

    /* ── Fields ── */
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
    .field input, .field select, .field textarea { width:100%; background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); }
    .field textarea { resize:vertical; min-height:72px; }
    .field select { cursor:pointer; }
    .field select option { background:var(--card); }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:var(--r); border:none; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; font-family:inherit; }
    .btn-p { background:var(--accent); color:#111; }
    .btn-p:hover { background:var(--accent-h); box-shadow:0 4px 16px rgba(129,211,26,.3); }
    .btn-s { background:transparent; color:var(--muted); border:1px solid var(--bdr2); }
    .btn-s:hover { color:var(--text); border-color:var(--muted); }
    .btn-d { background:rgba(255,99,72,.15); color:var(--danger); border:1px solid rgba(255,99,72,.3); }
    .btn-d:hover { background:rgba(255,99,72,.25); }
    .btn-sm { padding:6px 12px; font-size:12px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn-icon { padding:6px; background:transparent; border:none; cursor:pointer; color:var(--muted); border-radius:var(--r); transition:all .15s; font-size:16px; line-height:1; }
    .btn-icon:hover { color:var(--accent); background:rgba(129,211,26,.08); }

    /* ── Layout: Sidebar ── */
    .app { display:flex; height:100vh; }
    .sidebar { width:60px; background:var(--card); border-right:1px solid var(--bdr); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .35s ease; z-index:10; }
    .sidebar:hover { width:180px; }
    .sidebar-top { padding:14px 0 10px; border-bottom:1px solid var(--bdr); display:flex; align-items:center; justify-content:center; }
    .sidebar-top svg { width:28px; height:28px; fill:var(--accent); flex-shrink:0; }
    .sidebar-nav { flex:1; display:flex; flex-direction:column; padding:8px 0; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:12px 18px; cursor:pointer; color:var(--muted); transition:all .15s; white-space:nowrap; border-left:3px solid transparent; }
    .sidebar-item:hover { color:var(--text); background:rgba(255,255,255,.04); }
    .sidebar-item.active { color:var(--accent); background:rgba(129,211,26,.08); border-left-color:var(--accent); }
    .sidebar-item svg { width:22px; height:22px; flex-shrink:0; }
    .sidebar-label { font-size:13px; font-weight:600; opacity:0; transition:opacity .2s; }
    .sidebar:hover .sidebar-label { opacity:1; }
    .sidebar-bottom { border-top:1px solid var(--bdr); padding:8px 0; }

    .main-area { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--bdr); flex-shrink:0; }
    .topbar h1 { font-size:18px; font-weight:700; letter-spacing:-.02em; }
    .topbar-r { display:flex; align-items:center; gap:10px; }
    .tab-content { flex:1; overflow:auto; }

    /* ── Dashboard ── */
    .dashboard { padding:20px; max-width:1200px; margin:0 auto; width:100%; }
    .dash-section { margin-bottom:32px; }
    .dash-section-title { font-size:18px; font-weight:700; margin-bottom:16px; color:var(--text); letter-spacing:-.02em; }
    .dash-stat-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
    .dash-stat-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); padding:16px; animation:fadeIn .5s ease-out; }
    .dash-stat-num { font-size:32px; font-weight:700; color:var(--accent); margin-bottom:4px; }
    .dash-stat-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }

    .dash-upcoming { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); padding:16px; margin-bottom:16px; animation:slideIn .35s ease-out; }
    .dash-upcoming-item { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--bdr); }
    .dash-upcoming-item:last-child { border-bottom:none; }
    .dash-upcoming-left { flex:1; }
    .dash-upcoming-firm { font-weight:700; font-size:13px; color:var(--accent); margin-bottom:2px; }
    .dash-upcoming-role { font-size:12px; color:var(--text); }
    .dash-upcoming-date { font-size:11px; color:var(--muted); margin-top:2px; }
    .dash-upcoming-right { text-align:right; font-size:11px; color:var(--muted); }

    .dash-hot-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    .dash-hot-item { background:var(--card); border:2px solid var(--hot); border-radius:var(--r); padding:12px; text-align:center; cursor:pointer; transition:all .15s; }
    .dash-hot-item:hover { transform:translateY(-2px); box-shadow:0 0 12px rgba(239,68,68,.2); }
    .dash-hot-firm { font-weight:700; font-size:12px; margin-bottom:4px; color:var(--accent); }
    .dash-hot-role { font-size:11px; color:var(--muted); }

    .dash-stalled { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); border-radius:var(--r); padding:16px; margin-bottom:16px; }
    .dash-stalled-title { font-size:14px; font-weight:700; color:var(--danger); margin-bottom:12px; }
    .dash-stalled-item { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(239,68,68,.1); }
    .dash-stalled-item:last-child { border-bottom:none; }
    .dash-stalled-left { flex:1; }
    .dash-stalled-firm { font-weight:700; font-size:12px; color:var(--text); margin-bottom:2px; }
    .dash-stalled-days { font-size:11px; color:var(--danger); }

    /* ── Pipeline ── */
    .pipeline { display:flex; gap:10px; padding:16px; min-height:0; align-items:stretch; }
    .pipeline::-webkit-scrollbar { height:8px; }
    .pipeline::-webkit-scrollbar-track { background:var(--bg); }
    .pipeline::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:4px; }

    .pl-col { flex:1; min-width:0; background:var(--bg2); border:1px solid var(--bdr); border-radius:var(--r); display:flex; flex-direction:column; transition:border-color .28s, box-shadow .28s; }
    .pl-col.drag-over { border-color:var(--accent); box-shadow:0 0 12px rgba(129,211,26,.15); }
    .pl-col-head { padding:10px 12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--col-neutral); }
    .pl-col-head.c-neutral { border-bottom-color:var(--col-neutral); }
    .pl-col-head.c-amber { border-bottom-color:var(--col-amber); }
    .pl-col-head.c-red { border-bottom-color:var(--col-red); }
    .pl-col-head.c-green { border-bottom-color:var(--col-green); }
    .pl-col-head.c-lgreen { border-bottom-color:var(--col-lgreen); }
    .pl-count { background:var(--card); padding:2px 8px; border-radius:var(--r-pill); font-size:11px; }
    .pl-drop { min-height:120px; padding:8px; flex:1; display:flex; flex-direction:column; gap:6px; transition:padding-bottom .3s ease; }
    .pl-col.drag-over .pl-drop { padding-bottom:80px; }

    .pl-card { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); padding:10px 12px; cursor:grab; transition:transform .28s, opacity .28s, border-color .15s, box-shadow .15s; animation:slideIn .35s ease-out; border-left:3px solid var(--col-neutral); }
    .pl-card:hover { border-color:rgba(129,211,26,.4); transform:translateY(-1px); box-shadow:var(--sh-sm); }
    .pl-card.dragging { opacity:.4; cursor:grabbing; transform:scale(.95); }
    .pl-card.stalled { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3); }

    .pl-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:6px; }
    .pl-card-firm { font-size:12px; font-weight:700; color:var(--accent); }
    .pl-card-star { cursor:pointer; font-size:12px; opacity:0.5; transition:opacity .15s; }
    .pl-card-star:hover { opacity:1; }
    .pl-card-star.active { opacity:1; color:var(--warning); }

    .pl-card-role { font-size:13px; font-weight:500; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pl-card-ref { font-size:11px; color:var(--muted); margin-bottom:6px; }

    .pl-card-quick { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .pl-card-priority { font-size:10px; padding:2px 6px; border-radius:3px; font-weight:600; text-transform:uppercase; cursor:pointer; transition:all .15s; border:1px solid; }
    .pl-card-priority.hot { background:rgba(239,68,68,.15); color:var(--hot); border-color:rgba(239,68,68,.3); }
    .pl-card-priority.medium { background:rgba(245,158,11,.15); color:var(--medium); border-color:rgba(245,158,11,.3); }
    .pl-card-priority.cold { background:rgba(107,114,128,.15); color:var(--cold); border-color:rgba(107,114,128,.3); }

    .pl-card-date { font-size:10px; color:var(--muted); background:rgba(255,255,255,.03); padding:3px 6px; border-radius:3px; }
    .pl-card-actions { display:flex; gap:4px; margin-top:6px; opacity:0; transition:opacity .15s; }
    .pl-card:hover .pl-card-actions { opacity:1; }
    .pl-empty { text-align:center; padding:20px 10px; font-size:12px; color:var(--muted); font-style:italic; }

    /* ── Interview Rounds group ── */
    .itv-group { flex:5; flex-shrink:0; border:1px dashed var(--col-neutral); border-radius:var(--r); padding:10px; background:rgba(107,114,128,.04); display:flex; flex-direction:column; }
    .itv-group-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; text-align:center; }
    .itv-grid { display:flex; gap:8px; flex:1; }
    .itv-grid .pl-col { flex:1; min-width:0; }

    /* ── Contacts ── */
    .contacts-page { padding:20px; max-width:900px; margin:0 auto; width:100%; }
    .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
    .filter-bar select, .filter-bar input { background:var(--bg); border:1px solid var(--bdr2); border-radius:var(--r); color:var(--text); padding:8px 12px; font-size:13px; outline:none; font-family:inherit; }
    .filter-bar input { flex:1; min-width:180px; }
    .filter-bar select { cursor:pointer; }

    .section-group { margin-bottom:16px; background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); overflow:hidden; animation:fadeIn .3s ease-out; }
    .section-head { padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background .1s; user-select:none; }
    .section-head:hover { background:rgba(255,255,255,.03); }
    .section-head .chevron { color:var(--muted); font-size:12px; transition:transform .28s; }
    .section-head .chevron.open { transform:rotate(90deg); }

    .c-row { padding:10px 16px; border-top:1px solid var(--bdr); display:flex; align-items:center; gap:10px; transition:all .15s; cursor:pointer; }
    .c-row:hover { background:rgba(255,255,255,.03); }
    .c-row-name { font-weight:600; min-width:130px; font-size:13px; }
    .c-row-role { color:var(--muted); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-row-links { display:flex; gap:4px; }
    .c-row-link { font-size:11px; color:var(--muted); text-decoration:none; padding:3px 6px; border:1px solid var(--bdr); border-radius:4px; transition:all .15s; }
    .c-row-link:hover { color:var(--accent); border-color:var(--accent); }

    /* ── Modal ── */
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
    .modal { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); width:100%; max-width:480px; max-height:80vh; overflow:auto; animation:popIn .3s ease-out; box-shadow:var(--sh-lg); }
    .modal-header { padding:20px 20px 10px; border-bottom:1px solid var(--bdr); font-size:16px; font-weight:700; }
    .modal-body { padding:20px; }
    .modal-footer { padding:16px 20px 20px; display:flex; gap:12px; justify-content:flex-end; border-top:1px solid var(--bdr); }

    /* ── Toast ── */
    .toast-container { position:fixed; bottom:20px; right:20px; z-index:1000; max-width:350px; }
    .toast { background:var(--card); border:1px solid var(--bdr2); border-radius:var(--r); padding:12px 16px; margin-bottom:8px; animation:toastIn .3s ease-out; box-shadow:var(--sh-md); font-size:13px; }
    .toast.error { background:rgba(255,99,72,.1); border-color:rgba(255,99,72,.3); color:var(--danger); }
    .toast.success { background:rgba(29,209,161,.1); border-color:rgba(29,209,161,.3); color:var(--success); }

    .badge { display:inline-block; padding:2px 8px; border-radius:var(--r-pill); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    .badge.c-neutral { background:rgba(107,114,128,.15); color:#9ca3af; }
    .badge.c-amber { background:rgba(245,158,11,.15); color:var(--col-amber); }
    .badge.c-red { background:rgba(239,68,68,.15); color:var(--col-red); }
    .badge.c-green { background:rgba(16,185,129,.15); color:var(--col-green); }
    .badge.c-lgreen { background:rgba(110,231,183,.15); color:var(--col-lgreen); }
  </style>
</head>

class DB {
  constructor(url,key){this.base=url+'/rest/v1';this.h={'apikey':key,'Content-Type':'application/json'};}
  async get(t,qs=''){const r=await fetch(`${this.base}/${t}${qs?'?'+qs:''}`,{headers:this.h});if(!r.ok)throw new Error(await r.text());return r.json();}
  async ins(t,d){const r=await fetch(`${this.base}/${t}`,{method:'POST',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async upd(t,id,d){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'PATCH',headers:{...this.h,Prefer:'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;}
  async del(t,id){const r=await fetch(`${this.base}/${t}?id=eq.${id}`,{method:'DELETE',headers:{...this.h,Prefer:'return=minimal'}});if(!r.ok)throw new Error(await r.text());}
}

function Modal({title,onClose,onSave,saveLabel='Save',children,saving,danger}){
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[onClose]);
  return <div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header">{title}</div><div className="modal-body">{children}</div><div className="modal-footer"><button className="btn btn-s" onClick={onClose}>Cancel</button><button className={`btn ${danger?'btn-d':'btn-p'}`} onClick={onSave} disabled={saving}>{saving?'Saving...':saveLabel}</button></div></div></div>;
}

function CompanyCombo({value,onChange,firms,onCreateNew}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const selFirm=firms.find(f=>f.id===value);

  const matches=useMemo(()=>{
    if(!q.trim())return firms;
    return firms.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  },[q,firms]);

  const exactMatch=matches.find(f=>f.name.toLowerCase()===q.trim().toLowerCase());
  const showCreate=q.trim()&&!exactMatch;

  function pick(f){onChange(f.id);setQ(f.name);setOpen(false);}
  function create(){if(q.trim()){onCreateNew(q);setQ('');setOpen(false);}}

  return <div className="combo-wrap">
    <input className="combo-input" placeholder="Select firm..." value={q||selFirm?.name||''} onChange={e=>{setQ(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),100)} />
    {open && <div className="combo-list">{matches.map(f=><div key={f.id} className="combo-opt" onClick={()=>pick(f)}>{f.name}</div>)}{showCreate&&<div className="combo-opt create" onClick={create}>+ Create "{q}"</div>}</div>}
  </div>;
}

function PipelineTab({opps,firms,onUpdateOpp,onDeleteOpp}){
  const [draggedOpp,setDraggedOpp] = useState(null);

  const groupedByStage = useMemo(()=>{
    const groups = {};
    STAGES.forEach(s=>groups[s.v]=[]);
    opps.forEach(o=>groups[o.stage]?.push(o));
    return groups;
  },[opps]);

  function colDrop(e,stageV){
    e.preventDefault();
    if(!draggedOpp)return;
    if(draggedOpp.stage !== stageV){
      onUpdateOpp(draggedOpp.id, {stage:stageV, last_contact_date: new Date().toISOString().split('T')[0]});
    }
    setDraggedOpp(null);
  }

  function toggleFavorite(oppId){
    const opp = opps.find(o=>o.id===oppId);
    if(opp)onUpdateOpp(oppId, {is_favorite: !opp.is_favorite});
  }

  function changePriority(oppId, newPriority){
    onUpdateOpp(oppId, {priority: newPriority});
  }

  return <div className="pipeline" onDragOver={e=>e.preventDefault()}>
    {STAGES.map(stage=>{
      const cards = groupedByStage[stage.v]||[];

      if(stage.group === 'interview'){
        return <div key={stage.v}></div>;
      }

      return <div key={stage.v} className="pl-col" onDragOver={e=>e.preventDefault()} onDrop={e=>colDrop(e,stage.v)}>
        <div className={`pl-col-head ${stage.cls}`}><span>{stage.label}</span><span className="pl-count">{cards.length}</span></div>
        <div className="pl-drop">
          {cards.length===0&&<div className="pl-empty">No opportunities</div>}
          {cards.map(card=>{
            const firm = firms.find(f=>f.id===card.firm_id);
            const isPriority = {hot:'🔴',medium:'🟡',cold:'⚪'}[card.priority||'cold'];
            const daysSinceContact = card.last_contact_date ? Math.floor((new Date() - new Date(card.last_contact_date)) / (1000*60*60*24)) : null;
            const isStalled = daysSinceContact && daysSinceContact >= 14;
            return <div key={card.id} className={`pl-card ${isStalled?'stalled':''}`} draggable onDragStart={()=>setDraggedOpp(card)} onDragEnd={()=>setDraggedOpp(null)}>
              <div className="pl-card-head">
                <div className="pl-card-firm">{firm?.name}</div>
                <div className="pl-card-star" onClick={()=>toggleFavorite(card.id)}>{card.is_favorite?'⭐':'☆'}</div>
              </div>
              <div className="pl-card-role">{card.role_title}</div>
              {card.referral_source && <div className="pl-card-ref">Ref: {card.referral_source}</div>}
              <div className="pl-card-quick">
                <div className={`pl-card-priority ${card.priority||'cold'}`} onClick={()=>changePriority(card.id, card.priority==='hot'?'medium':card.priority==='medium'?'cold':'hot')}>{isPriority} {(card.priority||'cold').toUpperCase()}</div>
                {card.next_follow_up && <div className="pl-card-date">{new Date(card.next_follow_up).toLocaleDateString([], {month:'short',day:'numeric'})}</div>}
              </div>
              <div className="pl-card-actions">
                <button className="btn-icon" onClick={()=>onDeleteOpp(card.id)}>🗑️</button>
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}

    <div className="itv-group">
      <div className="itv-group-label">Interview Rounds</div>
      <div className="itv-grid">
        {ITV_STAGES.map(stage=>{
          const cards = groupedByStage[stage.v]||[];
          return <div key={stage.v} className="pl-col" onDragOver={e=>e.preventDefault()} onDrop={e=>colDrop(e,stage.v)}>
            <div className={`pl-col-head ${stage.cls}`}><span>{stage.label}</span><span className="pl-count">{cards.length}</span></div>
            <div className="pl-drop">
              {cards.length===0&&<div className="pl-empty">—</div>}
              {cards.map(card=>{
                const firm = firms.find(f=>f.id===card.firm_id);
                const isPriority = {hot:'🔴',medium:'🟡',cold:'⚪'}[card.priority||'cold'];
                return <div key={card.id} className="pl-card" draggable onDragStart={()=>setDraggedOpp(card)} onDragEnd={()=>setDraggedOpp(null)}>
                  <div className="pl-card-head">
                    <div className="pl-card-firm" style={{fontSize:'11px'}}>{firm?.name}</div>
                    <div className="pl-card-star" onClick={()=>toggleFavorite(card.id)} style={{fontSize:'11px'}}>{card.is_favorite?'⭐':'☆'}</div>
                  </div>
                  <div className="pl-card-role" style={{fontSize:'11px'}}>{card.role_title}</div>
                  {card.referral_source && <div className="pl-card-ref" style={{fontSize:'10px'}}>Ref: {card.referral_source}</div>}
                  <div className="pl-card-quick" style={{marginBottom:'4px'}}>
                    <div className={`pl-card-priority ${card.priority||'cold'}`} onClick={()=>changePriority(card.id, card.priority==='hot'?'medium':card.priority==='medium'?'cold':'hot')} style={{fontSize:'9px',padding:'1px 4px'}}>{isPriority}</div>
                  </div>
                </div>;
              })}
            </div>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

function ContactsTab({firms,contacts,onAddContact,onDeleteContact}){
  const [searchText,setSearchText] = useState('');
  const [filter,setFilter] = useState('');

  const grouped = useMemo(()=>{
    const g = {};
    contacts.forEach(c=>{
      const fn = firms.find(f=>f.id===c.firm_id)?.name||'Unknown';
      if(!g[fn])g[fn]=[]; g[fn].push(c);
    });
    return g;
  },[contacts,firms]);

  const filtered = useMemo(()=>{
    const result = {};
    Object.entries(grouped).forEach(([firmName,cts])=>{
      const fs = cts.filter(c=> c.name.toLowerCase().includes(searchText.toLowerCase()) && (!filter||c.role===filter));
      if(fs.length>0)result[firmName]=fs;
    });
    return result;
  },[grouped,searchText,filter]);

  return <div className="contacts-page">
    <div className="filter-bar">
      <input type="text" placeholder="Search contacts..." value={searchText} onChange={e=>setSearchText(e.target.value)} />
    </div>
    {Object.entries(filtered).map(([firmName,cts])=>(
      <div key={firmName} className="section-group">
        <div className="section-head">{firmName} <span className="section-count">({cts.length})</span></div>
        <div>
          {cts.map(c=>(
            <div key={c.id} className="c-row">
              <div className="c-row-name">{c.name}</div>
              <div className="c-row-role">{c.role}</div>
              <div className="c-row-links">
                {c.email && <a href={`mailto:${c.email}`} className="c-row-link" title="Email">✉️</a>}
                {c.phone && <a href={`tel:${c.phone}`} className="c-row-link" title="Call">☎️</a>}
              </div>
              <button className="btn-icon" onClick={()=>onDeleteContact(c.id)}>🗑️</button>
            </div>
          ))}
        </div>
      </div>
    ))}
  </div>;
}

  const [modal,setModal] = useState(null);
  const [loading,setLoading] = useState(false);
  const db = useMemo(()=>new DB(SUPABASE_URL,SUPABASE_KEY),[]);

  useEffect(()=>{
    load();
  },[]);

  async function load(){
    try{
      setFirms(await db.get('firms','order=created_at.desc'));
      setOpps(await db.get('opportunities','order=created_at.desc'));
      setContacts(await db.get('contacts','order=created_at.desc'));
    }catch(e){
      console.error('Load error:',e);
    }
  }

  async function saveData(table,data,isNew){
    try{
      setLoading(true);
      if(isNew){
        const newRec = await db.ins(table, {...data, user_id: user.id});
        if(table==='firms')setFirms([...firms,newRec]);
        else if(table==='opportunities')setOpps([...opps,newRec]);
        else if(table==='contacts')setContacts([...contacts,newRec]);
      }else{
        await db.upd(table,data.id,data);
        if(table==='firms')setFirms(firms.map(f=>f.id===data.id?{...f,...data}:f));
        else if(table==='opportunities')setOpps(opps.map(o=>o.id===data.id?{...o,...data}:o));
        else if(table==='contacts')setContacts(contacts.map(c=>c.id===data.id?{...c,...data}:c));
      }
      setModal(null);
    }catch(e){
      console.error('Save error:',e.message);
    }finally{
      setLoading(false);
    }
  }

  async function deleteData(table,id){
    try{
      await db.del(table,id);
      if(table==='firms')setFirms(firms.filter(f=>f.id!==id));
      else if(table==='opportunities')setOpps(opps.filter(o=>o.id!==id));
      else if(table==='contacts')setContacts(contacts.filter(c=>c.id!==id));
    }catch(e){
      console.error('Delete error:',e.message);
    }
  }

  function onAddFirm(){
    setModal({type:'firm',data:{},isNew:true});
  }

  function onAddOpp(){
    setModal({type:'opp',data:{},isNew:true});
  }

  function onAddContact(){
    setModal({type:'contact',data:{},isNew:true});
  }

  function onUpdateOpp(id,delta){
    saveData('opportunities',{id,...opps.find(o=>o.id===id),...delta},false);
  }

  return <div className="main-area">
    <div className="topbar"><h1>{tab.charAt(0).toUpperCase() + tab.slice(1)}</h1><div className="topbar-r"><button className="btn btn-s btn-sm" onClick={()=>{ localStorage.removeItem('hfcrm_auth'); location.reload(); }}>Logout</button></div></div>

    {tab==='dashboard' && <Dashboard firms={firms} opps={opps} contacts={contacts} />}
    {tab==='pipeline' && <PipelineTab opps={opps} firms={firms} onUpdateOpp={onUpdateOpp} onDeleteOpp={id=>deleteData('opportunities',id)} />}
    {tab==='contacts' && <ContactsTab firms={firms} contacts={contacts} onAddContact={onAddContact} onDeleteContact={id=>deleteData('contacts',id)} />}

    <div className="sidebar">
      <div className="sidebar-top"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3L5.5 9H3v6h2.5L11 21v-6h8V9h-8V3z"/></svg></div>
      <div className="sidebar-nav">
        <div className={`sidebar-item ${tab==='dashboard'?'active':''}`} onClick={()=>setTab('dashboard')}><IconDashboard /><div className="sidebar-label">Dashboard</div></div>
        <div className={`sidebar-item ${tab==='pipeline'?'active':''}`} onClick={()=>setTab('pipeline')}><IconPipeline /><div className="sidebar-label">Pipeline</div></div>
        <div className={`sidebar-item ${tab==='contacts'?'active':''}`} onClick={()=>setTab('contacts')}><IconContacts /><div className="sidebar-label">Contacts</div></div>
      </div>
    </div>

    {modal && <Modal title={modal.type==='firm'?'Add Firm':modal.type==='opp'?'Add Opportunity':'Add Contact'} onClose={()=>setModal(null)} onSave={()=>{ const d=modal.data; if(!d.name||!d.firm_id)return; saveData(modal.type==='firm'?'firms':modal.type==='opp'?'opportunities':'contacts',d,modal.isNew); }} saving={loading}>
      {modal.type==='firm'&&<FirmForm d={modal.data} set={d=>setModal({...modal,data:d})} />}
      {modal.type==='opp'&&<OppFormFields d={modal.data} set={d=>setModal({...modal,data:d})} firms={firms} onCreateFirm={n=>{const f={name:n,type:'Other'}; setFirms([...firms,f]); setModal({...modal,data:{...modal.data,firm_id:f.id}});}} />}
      {modal.type==='contact'&&<ContactFormFields d={modal.data} set={d=>setModal({...modal,data:d})} firms={firms} onCreateFirm={n=>{const f={name:n,type:'Other'}; setFirms([...firms,f]); setModal({...modal,data:{...modal.data,firm_id:f.id}});}} />}
    </Modal>}
  </div>;
}

function App(){
  const [user,setUser] = useState(null);
  const [username,setUsername] = useState('');
  const [password,setPassword] = useState('');
  const [error,setError] = useState('');
  const [toasts,setToasts] = useState([]);
  const db = useMemo(()=>new DB(SUPABASE_URL,SUPABASE_KEY),[]);

  useEffect(()=>{
    const auth = getAuth();
    if(auth)setUser(auth);
  },[]);

  async function signIn(){
    try{
      setError('');
      const users = await db.get('users',`username=eq.${username}`);
      if(!users||!users[0])throw new Error('User not found');
      const u = users[0];
      if(u.password !== password)throw new Error('Invalid password');
      const auth = {id:u.id,username:u.username};
      localStorage.setItem('hfcrm_auth',JSON.stringify(auth));
      setUser(auth);
    }catch(e){
      setError(e.message);
    }
  }

  if(!user) return <div className="auth-wrap"><div className="auth-card"><h1>HF Job Tracker</h1><div className="sub">Sign in to access your tracker.</div><div className="field"><label>USERNAME</label><input type="text" value={username} onChange={e=>setUsername(e.target.value)} onKeyPress={e=>e.key==='Enter'&&signIn()} /></div><div className="field"><label>PASSWORD</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyPress={e=>e.key==='Enter'&&signIn()} /></div>{error&&<div style={{background:'rgba(255,99,72,.15)',border:'1px solid rgba(255,99,72,.3)',borderRadius:'var(--r)',padding:'10px 12px',marginBottom:'16px',color:'var(--danger)',fontSize:'12px'}}>{error}</div>}<button className="btn btn-p" style={{width:'100%'}} onClick={signIn}>Sign In →</button></div></div>;

  return <Ctx.Provider value={{user,toasts,setToasts}}><div className="app"><AppInner /></div><ToastContainer /></Ctx.Provider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
